name: Sync Italy album photos
on:
  push:
    branches: [main]
    paths: ['italy-2026/photo-service.json', 'scripts/sync-italy-photos.py', '.github/workflows/italy-photos.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: italy-photo-sync
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read public album and download website previews
        run: python3 scripts/sync-italy-photos.py
      - name: Save photo updates
        id: commit
        run: |
          git add italy-2026/photos italy-2026/photos.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'SONA Album Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Italy album previews and classifications'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Refresh GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
