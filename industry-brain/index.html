<script id="knowledge-data" type="application/json">{"sources":[],"articles":[{"id":"tpm","units":["T34"],"cat":"人才需求","title":"TPM 真正在做什麼？","en":"Technical Product Manager","summary":"把客戶與市場需求轉成產品規格，整合工程、供應鏈與量產決策。","tags":["TPM","CDU","產品定義","Roadmap"],"body":[{"title":"職務重心","text":"依 T34 工作定位，TPM 的工作從需求理解、規格定義、開發驗證延伸到量產與商業化。需要能理解液冷整機的技術限制，也能解釋產品方向與設計取捨。"},{"title":"履歷要找的證據","text":"確認人選親自決定過哪些功能、性能目標或規格，方案選擇依據是什麼，決策如何影響成本、交期與可靠度。把參與、協調與主導分開記錄。"},{"title":"面試觀察","text":"面談中反覆追問實際判斷與設計參與程度。多年 PM 經歷只能當作背景，仍須用具體產品案例確認責任範圍。"},{"title":"先辨識 Technical Product 與 Technical Program","text":"T34 的職務定位將 TPM 放在 Technical Product Manager 的產品技術定位：要理解市場、客戶、規格、產品路線與商業化。Technical Program Manager 通常更聚焦跨團隊開發計畫、依賴與里程碑。兩種職稱在不同公司可能重疊，應以本職缺的實際決策責任為準，不能只看 TPM 三個字。"},{"title":"一、需求與產品方向","text":"從市場、客戶與競品了解需求，提出 Roadmap。釐清是一次性客製案，還是能標準化、模組化、跨客戶銷售的產品。除了客戶說要的功能，也要問應用情境、未說出的限制、競爭差異與商業可行性。"},{"title":"二、規格與系統取捨","text":"把需求轉成可驗證的功能、性能、可靠度及成本規格。液冷系統需要理解 Pump、Heat Exchanger、Valve、Piping、Sensors、Control 的連動，包含流量、壓力、溫度與冷卻液品質。TPM 不一定親自畫每張圖，但要能說明選哪個方案、為何接受某項限制，以及誰負責驗證。"},{"title":"三、開發、驗證與量產","text":"從概念、設計、樣機到 EVT／DVT／PVT 與量產協調，追蹤異常、設計變更與未完成驗證的風險。上市時間不能取代驗證結論；需要列出尚未證明的項目、影響範圍、改善方案與升級決策者。實際關卡名稱與放行標準依公司定義。"},{"title":"四、供應與交付","text":"與供應鏈、製造及工廠確認長交期料、單一來源、產能與出貨計畫。工廠無法交貨時，要辨識是物料、設備、工序、良率還是驗證問題，再制定具體恢復計畫。到現場的目的，是用資料找出限制並解除限制。"},{"title":"五、商業化與人才背景","text":"協助 Sales 說清產品性能、應用、差異與限制，把市場回饋轉入下一代產品。可從硬體、系統、工業設備、HVAC、伺服器與散熱產品 PM，或具產品決策經驗的工程師尋找；仍要核對本人負責的規格、方案選擇及結果，不能由產業名稱直接認定適配。"},{"title":"現有產品的市場溝通","text":"除了定義下一代，也需在展覽或技術交流中解釋現有產品、設計理由與應用限制，將多客戶回饋轉成可驗證方向。這是產品技術溝通，不能直接當成所有 Sales PM、FAE 或一般 PM 的工作定義。"}],"questions":["哪個產品規格是你主導定義的？","性能、成本與交期衝突時，你做了哪項取捨？","請說明一個從模糊客戶需求轉成可測規格的案例。","RD 想提高性能，但成本與期限不允許，你如何決定？","驗證尚未完成但客戶要求上市，你如何呈報與處理？","工廠說不能出貨時，你如何找出真正限制？","你親自做過哪項設計取捨？結果如何驗證？","如何判斷新技術值得導入？","如何把客製需求轉成標準產品與下一代 Roadmap？"],"related":["tradeoff","npi","e14-role"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"tradeoff","units":["T34"],"cat":"面試洞察","title":"技術取捨：從答案看到決策能力","en":"Trade-off & Risk","summary":"面試要追到選項、限制、決策與驗證結果。","tags":["Trade-off","風險","產品決策"],"body":[{"title":"從提問歸納","text":"T34 對話關注新技術導入、設計異常、客戶時程與工廠交付。可以從案例中辨識人選是否把問題拆成可比較的方案，並說明每個方案的代價。"},{"title":"建議整理方式","text":"以「目標／限制／備選方案／個人決策／風險／驗證結果」記錄案例。這是知識庫整理方法，並非主管正式評分制度。"},{"title":"證據界線","text":"若人選只是傳遞他人結論，應記為協調經驗；若能說清楚採用方案的依據與自己的決策權，再標註技術決策經驗。"},{"title":"完整案例要還原什麼","text":"先寫清產品與問題、現象與數據、已知限制，再列候選方案。比較性能、可靠度、成本、時程、供應與製造難度；交代排除方案的理由、本人做的決定、由誰核准、用什麼測試確認。只有「溝通後解決」無法還原工程判斷。"},{"title":"跨領域經驗如何追問","text":"可用匿名的熱變形、潤滑噪音或材料壓合案例追問：是否先分離材料、結構、製程與量測誤差？是否設計實驗比較溫度、壓力或配方條件？結果是否能重複？這些是追問框架，不代表特定案例已證明液冷產品能力。"},{"title":"可交付的決策紀錄","text":"一份有用的紀錄至少含需求基準、版本、比較表、失效風險、測試方法、前後結果與後續監控。若採用客戶資料，還需確認量測方法與重複性，避免把量測差異當成設計改善。過去助理提出的權重只是整理建議，並非已核准的招募評分標準。"}],"questions":["你否決了哪個方案，為什麼？","做出決策後，如何確認風險受控？"],"related":["tpm","npi","evidence"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"npi","units":["T34","E14","E13"],"cat":"技術概念","title":"NPI：從產品開發、驗證到量產","en":"New Product Introduction","summary":"理解需求、設計、樣品、驗證與量產準備如何銜接。","tags":["NPI","驗證","量產"],"body":[{"title":"NPI 是什麼","text":"New Product Introduction（新產品導入）是把產品從開發推進到可製造、可交付的過程。對話中反覆出現設計、驗證、試產與量產準備；不同公司會有不同名稱與關卡。"},{"title":"開發流程要看哪些交付物","text":"需求與規格、圖面與 BOM、樣品、測試結果、未結問題、製程及供應準備，都是需要銜接的資訊。只知道目前階段名稱，仍無法判斷產品是否準備完成。"},{"title":"驗證與放行","text":"測試通過與量產準備完成並非相同問題。工程、品質、物料、產能與變更管理都可能影響交付，實際放行條件要依產品與團隊規範確認。"},{"title":"各階段要驗證不同事情","text":"概念與需求先釐清應用、可行性、成本與風險。工程樣機驗證設計是否能工作；設計驗證檢查規格與可靠度；試產檢查工藝、治具、良率、測試與供應能否穩定量產。EVT／DVT／PVT 是常見叫法，不能替不同公司的關卡做未經確認的定義。"},{"title":"誰交付什麼","text":"TPM／PM 管理需求、風險與跨部門決策；RD 交設計、分析與異常對策；供應鏈交物料、產能與供應風險；製造／品質交工藝、測試、良率與驗收依據。實際權責需按專案核對，不能把多人合作寫成一個人的完整成果。"},{"title":"放行不是只有日期","text":"每個關卡要列測試結果、未結事項、變更版本、風險接受者與下一步。專案狀態顯示 Close 或有預計完成日，不足以證明設計、可靠度與量產條件均已通過。"}],"questions":["量產前你需要提交哪些結果？","有哪些未結問題會阻擋放行？"],"related":["tpm","e13-role","e14-role"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"產品開發與驗證"},{"id":"scpm","units":["T34"],"cat":"人才需求","title":"供應鏈人才：成本與交付的整合","en":"Supply Chain / Procurement","summary":"大型冷凍空調與散熱設備供應鏈：產業背景、成本、產能、交期與面試情境的詳細整理。","tags":["SCPM","採購","交期","成本"],"body":[{"title":"工作內容","text":"整合供應商、採購、RD、品質與工廠的資訊，處理成本、物料、產能與交期問題。面談涉及材料與加工報價、供應商開發、關鍵料件與交付風險。"},{"title":"要找什麼能力","text":"能拆解材料與工序成本，核實供應商產能，處理長交期與供應限制，並提出可執行的改善方案。跨部門協調要能落到負責人、時程與交付結果。"},{"title":"面試情境","text":"採購量不足時怎麼爭取供應商資源？關鍵 Pump 的供料時間長於客戶交期怎麼安排？如何確認供應商的瓶頸、並評估替代來源與品質風險？這些問題用來理解人選實際處理問題的方式。"},{"title":"優先考慮的產業背景","text":"工作需求偏好：要找大型中央空調、冷凍空調與散熱設備供應鏈人才；有做過相關設備業務，或冷凍空調相關科系畢業的人，特別值得看。這是案例中的背景偏好，不等同只有這兩條路，也不代表有該學歷或業務職稱就已具備 SCM 能力。"},{"title":"產品與產業範圍","text":"可優先看大型 HVAC、中央空調、工業冷卻、資料中心冷卻設備，以及 Dry Cooler、Chiller、Cooling Tower、Pump、Valve、Heat Exchanger、CDU 與管路相關供應網。原話提到大樓頂樓的「乾冷氣設備」，依情境可能是 Dry Cooler；仍保留原詞辨識的不確定性。"},{"title":"為何相關業務經驗有用","text":"大型設備 Sales、Technical Sales、Sales Engineer、BD 或 AM 可能熟悉設備規格、報價結構、供應商與市場交期。但轉入 Supply Chain 後，還需證明供應商開發、採購條件、成本分析、交付、品質及庫存風險管理。業務接觸不能直接等同採購與供應規劃責任。"},{"title":"工作要拆成六項責任","text":"1. 開發並評估有能力的設備供應商。\n2. 拆解材料、加工、組裝、測試及物流成本。\n3. 管理長交期料、供應優先順序及爬坡產能。\n4. 規劃庫存、提前備料與替代來源。\n5. 協調 RD、PM、Sales、工廠與跨國供應。\n6. 異常時提出有日期、數量、責任人的恢復方案。"},{"title":"背景相近也要分清","text":"消費電子塑膠、沖壓或筆電採購經驗，可能提供成本與供應商管理能力，但要再確認能否銜接大型冷卻設備的泵、熱交換器、管路、焊接、耐壓與防漏。HVAC 維修、現場施工、設備業務與設備供應鏈也各有不同交付物，不能視為同一種經驗。"}],"questions":["採購量不足時，如何爭取供應商配合？","你如何分辨真正的產能瓶頸與一般交期回覆？","過去接觸的是哪種大型冷卻設備？設備規格與供應商由誰決定？","如果從相關業務轉 SCM，你有哪些採購、交付與庫存責任的實例？","你熟悉哪些泵、閥、熱交換器或管路供應商？如何確認能力？"],"related":["cost","capacity","leadtime","vmi"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"cost","units":["T34"],"cat":"面試洞察","title":"Cost Down，要能拆到材料與工序","en":"Cost Breakdown","summary":"總價比價之外，辨識成本組成與降本條件。","tags":["Cost Down","模具","Heat Pipe","Cycle Time"],"body":[{"title":"面談主題","text":"面談中的提問涉及塑膠材料、模具工法、熱管及散熱模組。由此可歸納，成本能力需要延伸到材料差異、工序、良率、Cycle Time 與報價依據。"},{"title":"建議記錄欄位","text":"物料、製程、單價假設、良率、產出速度、供應條件及驗證方式。將供應商降價承諾和已驗證的降本成果分開。"},{"title":"追問方向","text":"若只拿到整組模組價格，可再問是否拆過關鍵零件成本、是否理解替代材料對性能與品質的影響。"},{"title":"塑膠件不能只問每公斤多少錢","text":"需要知道原生料／回收料、牌號、配比、材料認證、耗用量與損耗。模具成本還涉及鋼材、穴數、加工精度、鏡面拋光或咬花、壽命與維修。材料降價若同時造成良率下降或認證失效，總成本未必降低。"},{"title":"散熱件要看結構與工藝","text":"散熱模組報價與單支 Heat Pipe 報價不是同一層級。熱管成本涉及長度、毛細結構、壓扁與彎折、組裝及測試。外觀看似相同的空心銅管，缺少工作液與回流結構時不能當作等效熱管；替代方案需重新確認熱性能與可靠度。"},{"title":"Cost Down 的完整帳","text":"拆材料、工時、設備折舊、良率、製程週期、測試、包裝物流與供應風險。改善可來自設計簡化、減少工序、縮短 Cycle Time 或提升良率。比價需在相同規格、數量、交付條件下進行，不能單憑外包人工單價比內部高幾倍就斷定不合理。"},{"title":"原物料與備貨取捨","text":"銅、鋼等價格波動可能帶來提前鎖價的動機，但鎖價後價格下跌、預測變更或設計變更都會產生風險。需要說清價格依據、採購量、庫存所有權、取消條款與誰核准承擔風險。"},{"title":"資金與報價口徑","text":"VMI、近廠倉與長期備料涉及倉儲、資金與呆滯風險。材料單價、加工價、一次性工裝與整體交易條件要一起看，不把資金成本只等同供應商財報上的一個數字。"}],"questions":["這次降本究竟降低了哪一項成本？","如何確認降價沒有來自未授權的材料變更？","請把一個零件的報價拆到材料、加工、良率與測試。","你曾用哪個製程改善降低總成本？如何排除品質代價？"],"related":["scpm","capacity"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"capacity","units":["T34"],"cat":"面試洞察","title":"產能瓶頸，要能走到現場驗證","en":"Capacity & Bottleneck","summary":"把供應商的交期回覆拆成工序、設備、工時與排產。","tags":["產能","供應商","現場","製程"],"body":[{"title":"轉錄中的關注點","text":"面試追問如何確認供應商真正的產能狀況，以及供應商不願優先排產時如何推進。可觀察人選是否只說協調，或能描述介入方式與成果。"},{"title":"建議分析方式","text":"按工序確認每日可用工時、設備數、換線時間、良率與在製品，找出限制交付的站點。數據需要以供應商可核實的紀錄與現場結果交叉確認。"},{"title":"推進方案","text":"把增加工時、調整排程、替代工序與跨部門資源列為候選方案，再確認可行性、代價與責任人；這些屬整理建議。"},{"title":"把供應商的「滿載」變成可核對資料","text":"走到現場看真正限制的工序、設備數、每日可用時數、換線、停機、良率及在製品。用產出與瓶頸工序驗證承諾，不只看整廠機台數。供應商總產能不等於分配給本公司的可用產能。"},{"title":"小型新事業的供應優先權","text":"新 BU 量少時，供應商可能優先服務大客戶。可討論集團需求整合、預測透明度、合理承諾、產能預留或第二來源；各方案都伴隨採購量、資金與庫存風險，需要具體條件，不能只要求供應商配合。"},{"title":"跨國供應的製程成熟度","text":"在越南等新供應地點，沖壓、塑膠、壓鑄能力須逐項查證：打樣能做不代表穩定量產。焊接、變形控制、耐壓與漏測等設備產品工藝，也需要品質與工程共同審查。國家或工廠規模不能代替製程能力證據。"},{"title":"恢復計畫要能追蹤","text":"列瓶頸、對策、產能提升量、完成日與責任人，例如加班、模治具、設備或移轉。每天追的是實際良品產出與落差，而非只有口頭承諾。變更工廠或製程時仍須完成必要驗證。"}],"questions":["你如何證明是哪個站點限制產出？","供應商不願配合時，你提出了什麼具體交換條件？"],"related":["scpm","leadtime","cost"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"leadtime","units":["T34"],"cat":"面試洞察","title":"關鍵料交期長於交付承諾，怎麼辦？","en":"Lead Time & Delivery Risk","summary":"用時間表、替代驗證與責任分工，檢查方案是否落地。","tags":["Pump","Long Lead Time","ETA","交期"],"body":[{"title":"概括化面試情境","text":"客戶要求的交付時點早於關鍵 Pump 的供應時間。面試用此情境觀察調料、替代來源、排產優先權及風險處理，而非只聽到「請供應商加快」。"},{"title":"建議檢核","text":"各方案是否有承諾日期、數量、相容性驗證、額外費用與負責人？哪些變更需要 RD 或品質確認？是否仍有剩餘缺口？"},{"title":"設計變更與備料","text":"提前備料可以處理時間風險，也可能帶來變更或取消後的庫存風險，需另外確認風險分攤與停止點。"},{"title":"先把時間軸拆開","text":"把投標、預測、正式訂單、設計凍結、採購、製造、驗證、運輸及到貨拆開。當泵的採購前置時間長於客戶要求的交付窗口，單純催料無法消除客觀時間差，必須在接單前就討論備料與供應方案。"},{"title":"可選方案與代價","text":"提前鎖料／備安全庫存：縮短反應時間，但承擔資金與呆滯料。\n預測或 Planned PO：讓供應商提早規劃，但要釐清是否具有採購承諾。\n第二來源／替代料：降低單點依賴，但需要規格、品質、可靠度與客戶核准。\n分批交付／重談日期：降低單次缺口，但需要客戶接受且整體計畫可行。"},{"title":"提前備料後遇到 ECO 或取消","text":"應在承諾前談清可取消與不可取消的範圍、設計變更後舊料用途、退換料、費用與庫存所有權。提早備料的效益與風險必須同時呈現，不能把風險默默轉給供應商或工廠。"},{"title":"面試如何確認真的做過","text":"請對方用匿名案例給出各段實際前置時間、缺口、討論過的方案、本人承諾的範圍及最後交付。能說出「提早發現、提早談條件、追蹤結果」比只回答「跨部門協調」更有資訊。"}],"questions":["沒有確定後續訂單時，如何取得提前供貨？","替代料何時能通過驗證，誰負責確認？"],"related":["capacity","eta","scpm"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"vmi","units":["T34"],"cat":"技術概念","title":"VMI 與 JIT：庫存責任與交付模式","en":"Inventory & Delivery","summary":"了解誰決定補貨、誰持有庫存，以及何時交付。","tags":["VMI","JIT","庫存","資金成本"],"body":[{"title":"先分清兩個問題","text":"VMI（Vendor Managed Inventory）重點是供應商參與庫存與補貨管理；JIT（Just in Time）重點是物料依需求時點供應。具體責任分配仍由合作模式與合約決定。"},{"title":"不能只看貨有沒有準時到","text":"要問需求資料如何提供、誰觸發補貨、補貨量如何決定、庫存放在哪裡。準時交貨不代表已經建立 VMI。"},{"title":"庫存與資金責任","text":"所有權轉移、付款時間、倉儲費、呆滯料與需求變動風險，會影響整體合作成本。這些條件不能只靠模式名稱推定。"},{"title":"VMI 與 JIT 是兩個維度","text":"VMI（Vendor Managed Inventory）關心由誰根據需求與庫存資訊管理補貨。JIT（Just in Time）關心接近使用時點供應、降低等待與庫存。兩者可以同時存在；VMI 不自動代表所有庫存都由供應商出資，JIT 也不等於任何地方都沒有庫存。"},{"title":"談合約需逐項分清","text":"庫存放在哪裡、誰擁有、何時移轉所有權、誰付款、最低備量、補貨依據、預測誤差、過期呆滯、退換料與取消責任。倉庫位置、補貨責任與資金負擔是不同問題。"},{"title":"實際情境","text":"客戶要求快速供應，供應商在附近倉庫備貨，可能是 VMI，也可能是寄售或其他合作模式。要看合約及資訊流程；不能因「供應商有備庫存」就把模式名稱與風險分攤一起推定。"}],"questions":["你實際談過哪些庫存與付款條件？","預測變動後，呆滯料如何處理？"],"related":["scpm","leadtime"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"供應鏈術語"},{"id":"e13-role","units":["E13"],"cat":"人才需求","title":"E13：散熱 RD 的完整開發能力","en":"Server Heat Sink R&D","summary":"設計、模擬、驗證、性能異常分析與量產前可靠度。","tags":["Heat Sink","Thermal","RD","模擬"],"body":[{"title":"使用者提供的重點","text":"使用者明確補充，工作按專案推進，涵蓋模擬、分析、出圖、打樣、測試與驗證；身上同時有多個案子，整個流程由團隊合作完成。"},{"title":"主管提問主軸","text":"設計、模擬、驗證、性能異常如何分析，以及量產前須做什麼可靠度驗證。這些是使用者在對話中直接提供的面試方向。"},{"title":"分工理解","text":"使用者說明台灣端偏客戶對接與性能判斷，另由中國團隊協助出圖、打樣、組裝、測試、焊接。實際分工仍隨專案確認。"},{"title":"產品與工作範圍","text":"主要語境是伺服器 CPU／GPU 的 Heat Sink、Vapor Chamber、Heat Pipe、Fin 等散熱模組；會議摘要另有液冷模組內容。要以實際專案確認範圍，不能推成所有 E13 職缺均做相同產品，也不能直接等同 T34 CDU 整機。"},{"title":"從設計到量產的完整鏈條","text":"需求／規格 → 熱設計與模擬 → 圖面與材料 → 打樣 → 組裝與焊接 → 熱性能測試 → 模擬對照 → 異常分析 → 可靠度 → 量產移轉。主管重視設計、模擬、驗證與性能 FA 的連結，不能只會執行單一測試。"},{"title":"跨地分工與同時多案","text":"使用者描述台灣較偏客戶、規格、性能分析與協調，中國端較偏圖面、樣品、組裝、焊接及測試；仍依專案調整。RD 需要追版本、樣品與問題清單，也要能用技術英文說明條件、結果及下一步。多專案管理不代表一人完成全部工序。"},{"title":"機構與熱流都要能連起來","text":"除了熱傳／CFD，也可能涉及接觸、彈簧螺絲、壓合力、公差與結構分析。工具名稱只是例子，面試要問輸入條件、模型假設、網格、結果解釋及實測驗證，不能把會操作軟體等同完成產品設計。"},{"title":"熱阻術語的辨識限制","text":"「分段熱組」依工程情境可能是分段熱阻分析，但原詞未完全確認。理解時先核對每段熱路徑、溫度量測點與功率定義；下列題庫包含工作重點與延伸追問，不當成單一固定面試腳本。"},{"title":"由工程討論還原 RD 的責任深度","text":"除了散熱與結構設計，RD 要能辨認表面處理與加工對焊接的影響，讓圖面有可執行的加工餘量、接頭與檢驗要求；和 ME／PE、品質一起把漏液或熱性能問題定位、改版與複驗。跨團隊專案表則承接版本、證據與下一個交付。這些能力應用案例與本人交付物確認，不只依 CAD 軟體名稱。"},{"title":"三、E13 RD 實際工作內容","text":"E13 採取專案制開發模式。工程師會同時負責不只一個專案，並與台灣及中國團隊合作，完成整體產品開發。"},{"title":"核心工作流程","text":"這是整體產品開發流程，並不是每一個階段都由台灣 RD 親自完成。實際開發也可能因為客戶要求或測試結果，需要反覆修改設計、重新模擬及驗證。"},{"title":"E13 RD 的日常工作特性","text":"- 同時處理多個開發專案，依照時程與重要性安排工作。\n- 與海外客戶確認產品規格及技術需求。\n- 進行或判讀散熱模擬、技術分析及性能結果。\n- 與中國工程團隊協作，推進出圖、打樣、組裝、焊接及測試。\n- 分析測試異常，提出技術改善方向。\n- 確認產品符合客戶要求，並協助推動後續驗證及量產。"},{"title":"四、台灣與中國團隊的工作分工","text":"這是 E13 招募時需要特別理解的工作模式。\n\n| 工作項目 | 台灣團隊 | 中國團隊 |\n|--------|--------|--------|\n| 海外客戶對接 | 主要負責 | 視需求協助 |\n| 客戶規格確認 | 主要負責 | 提供技術支援 |\n| 散熱性能判斷 | 主要負責 | 提供測試資料 |\n| 模擬與技術分析 | 依專案執行及判讀 | 依專案協作 |\n| 工程出圖 | 確認設計與技術要求 | 協助執行 |\n| 打樣 | 協調、追蹤樣品 | 協助製作 |\n| 組裝 | 確認組裝需求 | 協助執行 |\n| 焊接 | 確認製程及性能需求 | 協助執行 |\n| 測試 | 分析及判讀結果 | 協助實際測試 |\n| 性能異常 | 判斷問題與改善方向 | 配合測試及驗證 |\n| 可靠度驗證 | 評估結果及確認規格 | 協助測試執行 |\n\n此表依目前已知工作分工整理，細部權責仍依實際專案安排為準。\n\n台灣 RD 的核心價值： 並非所有實作工序都要自己完成，而是要能理解完整開發流程、做出正確技術判斷、與客戶溝通，並協調中國團隊推進開發。\n\n因此，這個職務除了技術專業，也有一定程度的 Technical Project Coordination（技術專案協調）性質，但本質仍是研發職務。"},{"title":"十二、E13 完整技術面試題庫","text":"以下將目前所有重點整合成一份面試題庫。\n\n| 類別 | 面試問題 | 主管觀察重點 |\n|--------|--------|--------|\n| 產品經驗 | 1. 過去是否開發過 Server Heat Sink？主要負責哪些階段？ | 產品經驗與實際職責 |\n| 開發流程 | 2. 從客戶需求到量產，整體開發流程如何進行？ | 是否理解完整開發流程 |\n| 設計 | 3. VC、Heat Pipe、Fin 的設計如何決定？ | 熱設計能力 |\n| 模擬 | 4. 會使用哪些模擬工具？如何驗證模擬結果？ | 模擬分析能力 |\n| 性能判斷 | 5. 如何判斷散熱器是否符合客戶規格？ | 技術判斷能力 |\n| 異常分析 | 6. 模擬通過、實測未達標時，如何處理？ | 根因分析能力 |\n| 熱阻分析 | 7. 是否做過分段熱阻報告？ | 散熱分析深度 |\n| 機構設計 | 8. 彈簧螺絲的磅力及壓緊力如何決定？ | 機構設計經驗 |\n| 公差分析 | 9. 是否使用過 Worst Case Analysis？ | 極值法實務經驗 |\n| 可靠度 | 10. 量產前需要執行哪些可靠度測試？ | 產品驗證經驗 |\n| 多專案 | 11. 過去同時負責幾個專案？如何安排優先順序？ | 多案管理能力 |\n| 跨地協作 | 12. 是否曾與中國或其他異地團隊共同開發產品？ | 協作及技術溝通 |\n| 客戶對接 | 13. 是否曾直接對接海外客戶並處理技術問題？ | 客戶溝通能力 |\n| 量產導入 | 14. 產品從樣品驗證進入量產前，需要確認哪些事項？ | 量產與品質觀念 |"},{"title":"Q1：Cold Plate 跟 Heat Sink 最大的差異是什麼？","text":"觀察是否理解冷卻介質、熱傳路徑及系統配置差異"},{"title":"Q2：VC 為什麼需要毛細結構？","text":"觀察是否理解蒸發、冷凝、液體回流與兩相熱傳原理"},{"title":"Q3：Cold Plate 的微通道做得越細，散熱就一定越好嗎？","text":"觀察是否理解熱阻、壓降、流量分配及製程限制"},{"title":"Q4：你設計的樹枝狀結構是流道還是毛細結構？","text":"觀察候選人研究的實際產品及技術原理"},{"title":"Q5：你如何判斷一個流道設計是否優於其他設計？","text":"觀察是否會比較熱阻、溫度均勻性、流量、壓降與泵浦功耗，而非只看單一數據"},{"title":"Q6：你是否實際負責過 CFD、結構設計、打樣或測試驗證？","text":"確認候選人的親自參與程度，而不是只了解研究概念"}],"questions":["說明一個從需求到驗證的完整開發案。","模擬與實測不同時，先檢查什麼？","你做過哪些散熱產品？功率、空間與環境限制為何？","請從設計一路說到量產，各階段由誰負責？","如何選擇 VC、Heat Pipe 與 Fin？","CFD 用什麼邊界條件，如何與實測對照？","散熱不達標時如何做 FA？","熱阻如何分段與量測？","彈簧螺絲的力與公差如何計算？","可靠度做哪些項目，標準從哪裡來？","同時多案時如何管理圖面與樣品版本？","跨地工廠與客戶各如何溝通？","量產異常與設計問題如何區分？"],"related":["e13-engineering-complete","thermal-fa","tolerance","reliability"],"addedAt":"2026-11-19","updatedAt":"2026-11-23","section":"jobs","knowledgeTopic":null,"changeKind":"update"},{"id":"thermal-fa","units":["E13"],"cat":"面試洞察","title":"散熱性能異常：從測試條件到熱傳路徑","en":"Thermal Failure Analysis","summary":"用一致的量測條件與分段檢查，逐步排除性能差異。","tags":["熱阻","TIM","性能異常","Failure Analysis"],"body":[{"title":"分段熱阻的術語限制","text":"「分段熱組」可能指分段熱阻分析，原始術語與格式仍待確認。實務上先劃分熱路徑與量測點，再把溫差、功率及接觸條件對齊，不憑近音詞指定固定報告模板。"},{"title":"對話中的分析建議","text":"先比對功率、環境、風量與量測條件，再看組裝、接觸與散熱模組。這些是延伸分析框架，不表示主管逐項提出過。"},{"title":"要留下的證據","text":"量測位置、測試條件、比較基準、假設、排除方法及改善後結果。某段可能異常和已量測確認異常需要分開記錄。"},{"title":"先排除測試條件不一致","text":"對照加熱功率、進風／進液溫度、流量、壓力、感測器位置與校正、安裝方式、穩態判定和樣品版本。若條件不同，不能直接用溫度高低認定散熱器設計變差。"},{"title":"沿熱傳路徑逐段排查","text":"Chip → TIM → 接觸／底座或 VC → Heat Pipe → Fin → Air，是氣冷模組的示意路徑。液冷則需追到冷板、冷卻液與後段排熱。檢查 TIM 厚度與覆蓋、壓合力、接觸平整度、焊接與零件差異，再用溫差／熱阻與控制變因找出最可能瓶頸。"},{"title":"模擬與實測如何互相校正","text":"核對模型幾何、材料、接觸熱阻、風扇或流量邊界、網格與量測誤差。先提出可驗證假設，再更換零件、重裝或改測條件；改善後需複測及可靠度確認。這是工作重點的工程延伸框架，不冒稱主管逐字要求每一步。"},{"title":"八、Validation｜散熱性能驗證","text":"產品完成打樣後，需要確認實際測試結果是否符合設計與客戶要求。\n\n| 項目 | 英文 | 驗證內容 |\n|--------|--------|--------|\n| 熱阻 | Thermal Resistance | 散熱器熱傳效率 |\n| 晶片溫度 | Junction Temperature | 是否符合晶片溫度限制 |\n| 風量 | Airflow | 氣流是否符合設計條件 |\n| 壓降 | Pressure Drop | 氣流通過散熱器的阻力 |\n| 接觸狀態 | Contact Condition | TIM、底座與晶片接觸品質 |\n| 壓緊力 | Clamping Force | 是否符合晶片負載規範 |\n\n台灣團隊主要負責性能判斷，中國夥伴則協助實際測試作業。\n\n主管可能會問：\n\n「產品設計完成後，你通常如何確認散熱性能符合客戶要求？如何比較模擬與實際測試的差異？」"},{"title":"九、Failure Analysis｜性能異常分析","text":"主管非常重視人選遇到異常時的分析能力。"},{"title":"分段熱阻分析報告","text":"若主管說的「分段熱組報告」是指分段熱阻分析，英文可稱為 Thermal Resistance Breakdown。\n\n主要目的是將熱傳路徑拆分，找出熱阻較大的位置。\n\n| 區段 | 可能問題 |\n|--------|--------|\n| Chip → TIM | 導熱材料、塗佈厚度、接觸狀態 |\n| TIM → Base / VC | 底座平面度、接觸熱阻 |\n| VC / Heat Pipe | 熱傳能力、工作狀態 |\n| Heat Pipe → Fin | 接合不良、界面熱阻 |\n| Fin → Air | 氣流不足、鰭片設計不佳 |\n\n實際報告需要根據可取得的溫度、功耗及測試條件，判斷各區段熱阻，不能直接將推測當作量測結果。\n\n主管可能會問：\n\n「當散熱性能異常時，你會如何透過分段熱阻分析，找出是哪個區域造成問題？」"}],"questions":["如何排除量測條件造成的差異？","哪項量測支持你判定的根因？"],"related":["e13-role","reliability","drybulb"],"addedAt":"2026-11-19","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"散熱技術","changeKind":"update"},{"id":"tolerance","units":["E13"],"cat":"技術概念","title":"公差、彈簧力與安裝品質","en":"Tolerance & Clamping Force","summary":"把尺寸鏈與受力一起看，是 E13 對話整理出的技術延伸。","tags":["Worst Case","Spring Screw","壓緊力","公差"],"body":[{"title":"對話整理內容","text":"E13 對話將彈簧螺絲、壓緊力與 Worst Case 公差分析連在一起，作為研發能力的追問方向。此條來自對話整理，尚未取得正式設計規範。"},{"title":"初學者理解","text":"組裝尺寸改變，可能改變彈簧壓縮量，進而影響接觸負載。檢查時需回到結構、材料、彈簧特性與產品規格。"},{"title":"面談使用","text":"請人選用實際圖面或匿名案例解釋尺寸鏈如何建立、最不利組合如何選、結果如何驗證。不要只以能說出方法名稱判定能力。"},{"title":"尺寸鏈教學例","text":"假設 A=10±0.20 mm、B=5±0.10 mm、C=3±0.15 mm，組合尺寸 A+B−C 的名義值為 12 mm。Worst Case 把絕對公差相加為 ±0.45 mm，範圍 11.55～12.45 mm。這是教學數字，並非 E13 產品規格。"},{"title":"Worst Case、RSS、Monte Carlo","text":"Worst Case 看尺寸都落在最不利端點時能否裝配。RSS 用統計假設估計組合變異，不能在相關性與分布未知時當作保證邊界。Monte Carlo 可納入不同分布與相關性做模擬，但結果依賴輸入品質；三種方法不是任意選一個較好看的答案。"},{"title":"彈簧力教學例","text":"在線性且未超出工作區間的假設下 F=kx。k=10 N/mm、壓縮量 x=3 mm，力約 30 N，約 6.74 lbf。多顆彈簧還需看受力分布、行程差與公差，不能只把單顆數字乘顆數就保證均勻壓合。"},{"title":"鎖附扭力與壓合力不同","text":"扭力受螺紋、摩擦與結構影響，不是可直接等同的接觸力。需同時考慮晶片封裝容許載荷、TIM 壓縮、結構變形、螺絲到底位置及重複安裝，確認散熱接觸與機械可靠度。"},{"title":"五、Design｜機構與散熱設計","text":"E13 的 Heat Sink 開發需要同時考慮散熱性能、機構限制、組裝及製造可行性。"},{"title":"主要設計內容","text":"| 技術項目 | 英文 | 重點 |\n|--------|--------|--------|\n| 散熱器設計 | Heat Sink Design | 散熱器結構、尺寸、重量 |\n| 均熱板 | Vapor Chamber | 熱量擴散及均熱設計 |\n| 熱導管 | Heat Pipe | 熱傳路徑與傳熱能力 |\n| 散熱鰭片 | Cooling Fins | 鰭片厚度、間距、面積 |\n| 彈簧螺絲 | Spring-loaded Screw | 固定方式與彈簧力 |\n| 壓緊力 | Clamping Force | 散熱器對晶片的壓緊負載 |\n| 公差分析 | Tolerance Analysis | 尺寸鏈、組裝公差、干涉與間隙 |\n| 製造可行性 | DFM | 評估設計是否適合製造 |"},{"title":"彈簧螺絲與磅力設計","text":"Server Heat Sink 需要透過固定機構，確保散熱器與晶片保持適當接觸。\n\n彈簧基本關係式：\n\n\nF=kx\n\n\nF 為作用力，k 為彈簧常數，x 為彈簧壓縮量，適用於理想線性彈簧的簡化分析。\n\n設計時須考慮：\n\n- 彈簧磅力是否符合要求。\n- 彈簧壓縮量是否合理。\n- 螺絲鎖付扭力及固定方式。\n- 晶片封裝能承受的壓緊力範圍。\n- 公差變異對彈簧壓縮量的影響。\n- 是否能確保均勻接觸並避免晶片損傷。\n\n主管可能會問：\n\n「如果今天要開發一款 Server Heat Sink，你會如何決定彈簧螺絲的磅力與壓緊力？如何確認設計符合晶片負載規範？」"},{"title":"六、Tolerance Analysis｜公差分析","text":"E13 主要使用 Worst Case Analysis（極值法）。"},{"title":"三種常見方法","text":"| 方法 | 英文 | 用途 |\n|--------|--------|--------|\n| 極值法 | Worst Case Analysis | 計算所有尺寸最不利組合下的組裝極限 |\n| RSS 方根法 | Root Sum Square | 假設變異獨立等條件下，以統計方式估算尺寸變異 |\n| 蒙地卡羅模擬 | Monte Carlo Simulation | 使用隨機抽樣模擬尺寸組合與分布 |"},{"title":"極值法在 E13 的實際應用","text":"- 計算最大、最小組裝高度。\n- 判斷螺絲、支架、底座是否有干涉。\n- 評估彈簧最大、最小壓縮量。\n- 確認極端尺寸組合下的壓緊力。\n- 降低產品組裝不良或晶片受力異常的風險。\n\n例如：\n\n| 零件 | 尺寸 |\n|--------|--------|\n| A | 10 ±0.2 mm |\n| B | 5 ±0.1 mm |\n| C | 3 ±0.15 mm |\n\n若尺寸鏈為 A + B − C：\n\n名目尺寸 = 12 mm\n\n極值公差 = ±0.45 mm\n\n因此組裝尺寸範圍為 11.55–12.45 mm。\n\n這只是尺寸鏈示例，實際開發仍需考慮彈簧力公差、接觸變形及固定結構條件。\n\n主管可能會問：\n\n「過去是否有做過 Worst Case 公差分析？如果散熱器包含彈簧螺絲、支架及 PCB，如何確保最大及最小公差狀態下仍符合安裝與壓緊力要求？」"}],"questions":["你的尺寸鏈如何建立？","怎麼驗證裝配後負載與預期一致？"],"related":["e13-role","thermal-fa"],"addedAt":"2026-11-19","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"散熱技術","changeKind":"update"},{"id":"reliability","units":["E13","E14","T34"],"cat":"開發流程","title":"可靠度驗證：目的、條件與判定標準","en":"Reliability Validation","summary":"確認產品經過指定環境與應力後，功能及性能是否仍符合要求。","tags":["可靠度","Validation","量產"],"body":[{"title":"量產前與供應商驗證","text":"量產前可靠度與供應商產品是否滿足終端使用需求，是兩個需串連的層級。先定義風險與規格，再確認測試、樣本及失效後的改善閉環。"},{"title":"整理建議","text":"問清楚測試目的、條件依據、樣本與判定標準，再問失效如何分析、改版後如何重新確認。實際項目須依產品規格選定。"},{"title":"使用限制","text":"本知識庫不把對話中列出的溫循、振動、濕熱等通用例子視為任何職缺的固定測試規範。"},{"title":"測試從失效機制出發","text":"熱循環看反覆膨脹收縮；熱衝擊看快速溫差；溫濕度看材料與腐蝕風險；振動／機械衝擊看運輸與使用受力；鎖附與拆裝看力保持、磨耗與接觸變化。不是每個產品都必做同一套或同一條件。"},{"title":"把計畫寫完整","text":"列樣本、版本、前置處理、條件、循環／時間、量測點、性能基準與判退標準。測前測後要能比較熱性能、外觀、機械與密封等相關項目，失效後要做分析與對策複驗。"},{"title":"可靠度與單次性能不同","text":"樣品在室溫運作一次通過，不足以證明長期、極端環境或反覆安裝仍可靠。反過來，單項可靠度通過也不能代替全部產品規格驗證。"},{"title":"十、Reliability｜量產前可靠度驗證","text":"量產前需依客戶規格與產品適用條件，完成必要可靠度測試。\n\n| 測試項目 | 英文 | 主要目的 |\n|--------|--------|--------|\n| 溫度循環 | Thermal Cycling | 評估反覆熱脹冷縮造成的影響 |\n| 熱衝擊 | Thermal Shock | 評估快速溫差造成的材料與接合風險 |\n| 高溫高濕 | Temperature / Humidity | 評估腐蝕、氧化及材料劣化 |\n| 振動測試 | Vibration Test | 評估固定機構與零件是否鬆動 |\n| 機械衝擊 | Mechanical Shock | 評估衝擊後的結構完整性 |\n| 壓緊力保持 | Clamping Force Retention | 確認固定機構長期受力穩定性 |\n| 散熱性能複測 | Thermal Performance Retest | 確認可靠度測試前後熱性能是否合格 |\n| 安裝耐久性 | Assembly Durability | 驗證反覆組裝後的可靠性 |\n\n另外，正式量產導入通常也需要確認圖面版本、BOM、製程能力、檢驗標準及量產測試方法。\n\n主管可能會問：\n\n「過去產品正式量產前，你執行或參與過哪些可靠度驗證？若測試後性能下降，會如何分析？」"}],"questions":["你執行的測試要驗證哪個失效風險？","測試後性能下降，如何追到根因？"],"related":["npi","thermal-fa","supplier-review"],"addedAt":"2026-11-19","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"產品開發與驗證","changeKind":"update"},{"id":"e14-role","units":["E14"],"cat":"人才需求","title":"E14 Power EE：用設計經驗審查整機電力","en":"Power Electronics & System Integration","summary":"核心是 Converter、Inverter、供電與供應商方案審查。","tags":["Power Electronics","Converter","Inverter","CDU"],"body":[{"title":"主管初談描述","text":"工作內容將工作分成電力輸入、線材與走線、Converter、Inverter 等區塊，並將 Control 與 Power 分由不同團隊負責。面談中的 PCBA 字詞不清楚，保留待確認。"},{"title":"實際工作","text":"先理解 CDU 運作與電力規劃，再把過往電力電子設計經驗用於新案、變頻器應用及 ODM 供應商技術審查。"},{"title":"跨產業背景","text":"初談提及工業驅動、電動車與充電設備等背景可銜接。重點是個人技術責任、系統理解與驗證經驗，並非公司名稱。"},{"title":"從後續面談補充的團隊分工","text":"後續 E14 轉錄提到，團隊中有人負責設備配線與供應商圖面審查，有人負責變頻器、馬達或風扇控制板功能，也有人負責電源及轉換器。這些屬不同工程分工，不能把一張較廣的 JD 解讀成每個人都只做現場維護，或每個人都必須包辦全部項目。"},{"title":"職務定位與整機邊界","text":"E14 的工作定位，重點是設備電力電子、電氣整合與供應商／ODM Review。包括電源輸入、配電與線路、Converter／Inverter／PSU、VFD、控制板、感測及保護，並參與 CDU 新產品需求與 NPI。不能直接視為資料中心 MV／LV 建廠大電，也不能縮成只寫 PLC。"},{"title":"需要能審查的設計項目","text":"讀懂功率與控制架構、耐壓耐流、DC Bus、功率元件損失、線徑與 Connector、散熱與保護、EMI／EMC、測試規格及異常。外購模組不代表不用懂設計；需要用過去研發經驗判斷供應商方案、數據與整改是否合理。"},{"title":"後段主管介紹的工作","text":"供應商不一定提供完整可直接採用的設計，因此團隊要理解配線、變頻器、控制板、PSU 及整機運作，在規格、圖面、測試與整合上做技術把關。實際自研與外購比例需逐專案確認，不推成每一塊功率板都由 E14 從零設計。"},{"title":"人才來源與責任驗證","text":"工業驅動、伺服、電動車、充電設備、工業電源、UPS、Pump／VFD 等經驗可能有轉移價值。要問本人做功率級、控制板、感測、韌體、配線或測試的哪部分；懂低壓大電流不代表自然熟悉高壓工業整機，反過來也相同。"},{"title":"匿名面試案例要保留的推理","text":"既有高功率變頻器平台改成伺服應用，需分清沿用的是 Power Stage，重新設計的是控制／回授介面，還是功率板也有變更。提高產品等級不是把原板額定功率直接乘倍數；要重新核對半導體、DC Link、導體、散熱、瞬時過載與保護。個別人選表現與任用評價不公開。"},{"title":"技術面試問答：TCS、感測器與馬達控制","text":"以下是匿名技術面試問答。回答脈絡不代表已驗證結論，也不是所有 E14 職缺的通用規格。\n\n| 面談問題 | 匿名案例回答脈絡 |\n|---|---|\n| 1. 前後輪是否都有輪速感測器 | 前後輪均有感測資訊，可比較輪速差 |\n| 2. 感測器如何測量輪速 | 由磁性結構及感測器產生脈波，再計算輪速 |\n| 3. 感測器解析度多少 | 提及數位訊號與脈波計數，未給明確數值 |\n| 4. 前輪打滑如何處理 | 主要針對後輪驅動打滑，利用前輪速度作為參考 |\n| 5. 如何讓後輪轉速下降 | 逐步降低馬達輸出命令 |\n| 6. 輸出如何從 1000 降低 | 舉例降至 500、250，搭配斜率控制 |\n| 7. 降低輸出時能量去哪裡 | 提到回生煞車與電池能量回收 |\n| 8. 是否配置煞車電阻 | 該車款未額外使用，主要透過電池回收機制 |\n| 9. Hall PCB 是原本誰設計 | 中國供應商 |\n| 10. Hall PCB 改善了什麼 | 增加限流、軟啟動及訊號端電容 |\n| 11. 原本 Hall IC 的問題是什麼 | 啟動電流及元件規格可能存在風險 |\n| 12. 為何自行開發 Current Sensor | 標準品量程、尺寸及成本不完全符合需求 |\n| 13. 自製感測器真的比較省錢嗎 | 透過規格客製及供應商合作降低成本 |\n| 14. 為什麼不用 Shunt | 電流需求提高，考量隔離及損耗 |\n| 15. 是否比較其他感測原理 | 提及 Hall、磁阻及其他感測方案 |\n| 16. 為什麼需要隔離型感測器 | 新車型電流提高，舊方案不再理想 |"},{"title":"技術面試問答：功率級、損失與元件","text":"以下是匿名技術面試問答。回答脈絡不代表已驗證結論，也不是所有 E14 職缺的通用規格。\n\n| 面談問題 | 匿名案例回答脈絡 |\n|---|---|\n| 17. 案例產品大功率專案是什麼 | 約 75 kW 伺服驅動器開發 |\n| 18. 為何需要 75 kW | 負載需求約 41 kW，另考慮瞬間過載 |\n| 19. 原本只有 15 kW，如何提升 | 使用原本已具有大功率能力的變頻器平台 |\n| 20. 是整個 Power Stage 重新設計嗎 | 主要沿用符合功率規格的變頻器平台，重新設計控制部分 |\n| 21. 重新設計哪些部分 | 控制板、伺服回授與控制介面 |\n| 22. Power Stage 是否也由你負責 | 表示 Power Stage 與控制板都要負責 |\n| 23. 如何確認功率模組符合需求 | 依耐壓、耐流、操作條件與溫升評估 |\n| 24. Power Loss 有哪些 | 導通損失與切換損失 |\n| 25. 如何計算 Power Loss | 依電壓、電流、操作條件及溫度評估 |\n| 26. 二極體反向恢復是否考慮 | 提到二極體導通與電流損失 |\n| 27. 為什麼電動機車案例用 MOSFET，工業驅動器案例用 IGBT | 電動機車案例偏低壓大電流，工業驅動器案例偏較高電壓 |\n| 28. 並聯 MOSFET 如何均流 | 案例回答未展開均流設計；技術原理另見並聯均流筆記 |\n| 29. 如何確保並聯元件開關時間一致 | 目前未提供 Gate Resistance、Layout 等具體設計內容 |\n| 30. 硬體與韌體如何分工 | 自己偏硬體，韌體由其他人員開發，雙方配合測試 |\n| 31. IPM 與 SPM 如何選擇控制方式 | 提到部分 d-q 軸特性；完整控制策略未展開 |"},{"title":"技術面試問答：測試、法規與整合","text":"以下是匿名技術面試問答。回答脈絡不代表已驗證結論，也不是所有 E14 職缺的通用規格。\n\n| 面談問題 | 匿名案例回答脈絡 |\n|---|---|\n| 32. 案例產品主要做什麼測試 | DI／DO、過流、過壓、電流精度及溫度等 |\n| 33. 過去依據哪些標準測試 | 提到安規測試；原文字未提供可核對的標準編號 |\n| 34. 電流精度如何驗證 | 使用負載、量測設備及 ADC 數值進行比對 |\n| 35. 是否做過電流 Response | 曾比較感測訊號與回授訊號的延遲 |\n| 36. 是否能獨立寫 PLC 程式 | 提到早期程式書寫器；現代工具的使用範圍未展開 |\n| 37. 是否看得懂機台電路圖 | 表示有早期配線及設備接觸經驗 |\n| 38. 是否具備故障排查能力 | 曾與 RD 配合分析設計問題，透過測試提出對策 |\n| 39. EMC 問題如何處理 | 磁珠、電容、訊號量測與元件調整 |\n| 40. 為什麼選用特定磁珠 | 依據頻率特性及干擾頻段選擇 |"}],"questions":["你如何審查外部變頻器的設計與測試結果？","從過去產品轉到 CDU，哪些整合條件需要重查？","請畫出你負責的功率與控制架構，圈出親自設計的部分。","沿用既有功率平台時，你重新驗證了哪些項目？","請依元件曲線、電流、母線電壓與頻率估算 Power Loss。","並聯元件如何做靜態及動態均流？","感測器量程、隔離、延遲與成本如何取捨？","如何驗證過流、過壓、溫度與故障保護？","供應商測試報告不完整時，你如何要求補證？","哪些工作由硬體、韌體、PLC 與整合人員分工？"],"related":["supplier-review","power-split","regeneration"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"supplier-review","units":["E14"],"cat":"面試洞察","title":"供應商 Review，要能提出技術判斷","en":"ODM Technical Review","summary":"用自己的研發經驗，檢查規格、性能與可靠度是否有證據。","tags":["ODM","Supplier Review","電力電子","驗證"],"body":[{"title":"從初談歸納","text":"主管說明，不是所有電源或變頻器都由內部從零開發，工程師需要審查供應商規格、性能與可靠度，判斷是否符合整機及客戶要求。"},{"title":"建議追問","text":"請人選描述曾經拒絕或要求修改的供應商方案，指出問題、依據與驗證方式。能否解讀測試結果與整合限制，比轉述規格表更有辨識度。"},{"title":"待確認","text":"具體審查清單、保護條件與測試數值需依設計規範確認；本頁不發布內部規格。"},{"title":"從需求往下審，不只看型錄","text":"先確認輸入／輸出、額定與峰值、持續時間、環境與安裝條件，再看供應商架構與元件。產品標稱功率不能替代整機最差條件驗證；要知道功率如何分配、熱從哪裡排出、故障時怎麼安全處理。"},{"title":"要索取的交付物","text":"架構圖、原理圖／配線、BOM 與關鍵元件選型、線徑與 Connector 額定、損失與熱評估、保護條件、測試程序、波形與原始結果、EMC／安規適用性，以及問題清單與版本。可公開的是審查方法，不是內部供應商圖面。"},{"title":"Review 到底由誰做判斷","text":"確認本人提出過哪個問題、依據哪條規格或測試數據、供應商改了什麼、如何複測關閉。能整理會議與催報告是協調責任；技術 Review 需能說明接受或拒絕方案的工程理由。"}],"questions":["你曾要求供應商修正哪項設計？","如果規格表符合，但測試條件不同，你會如何處理？"],"related":["e14-role","reliability","evidence"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"regeneration","units":["E14"],"cat":"技術概念","title":"能量回生：把能量流向問清楚","en":"Regeneration & Common DC Bus","summary":"共直流母線分享能量與回送電網，需要分別確認。","tags":["DC Bus","能量回生","馬達驅動","Inverter"],"body":[{"title":"需要分清的架構","text":"驅動器模組化、DC Bus、煞車電阻與回生涉及不同架構。母線內分享能量與回送 AC 電網不是相同功能，需畫出能量路徑。"},{"title":"面談辨識","text":"請人選畫出能量由何處產生、經過哪些模組、最後流向哪個負載或電網，再標明自己負責的電路與驗證。"},{"title":"技術校核狀態","text":"本條保留面談中的概念區別；尚未取得原始電路或產品文件，不據此認定任何候選人已具完整回生設計能力。"},{"title":"先分清能量流向","text":"驅動時：電源／電池 → 轉換器 → 馬達 → 機械負載。回生時：機械負載 → 馬達發電 → DC Bus，再依架構流向電池、其他軸、電網或煞車電阻。只說有回生，還不知道能量最後去了哪裡。"},{"title":"共直流母線與回送電網","text":"Common DC Bus 可讓減速軸回送的能量被其他耗能軸利用，但不自動代表可以回送 AC 電網。回送電網需要適合的前端與控制；多餘能量若不能被利用或儲存，可能透過 Chopper／Braking Resistor 轉為熱。"},{"title":"TCS 降扭不等於再生煞車","text":"降低扭力命令可能只是減少電池向馬達供能，不一定已讓機械能回充電池。回充還受轉速、控制、電池 SOC、溫度與可接受充電能力限制。面試應請對方畫出當時的能量路徑，別把幾個名詞視為同一功能。"},{"title":"八、Regenerative Braking 能量回收","text":"這段錄音有一個特別容易搞混的觀念\n\n降低馬達輸出，不一定等於能量回收"},{"title":"馬達驅動與回生煞車","text":"正常加速時\n\n電池 → 逆變器 → 馬達 → 車輪\n\n執行再生煞車時，在合適的控制與運作條件下\n\n車輪機械能 → 馬達發電 → 逆變器 → 電池\n\n也就是讓馬達在減速過程中以發電方式回收部分能量"},{"title":"為什麼還需要 Braking Resistor？","text":"有些工業設備減速時，馬達回送的能量會使 DC Bus 電壓上升\n\n如果不能將能量送回電網、儲能系統或其他負載，就可能需要透過 Braking Chopper 與 Braking Resistor，把多餘能量轉成熱\n\n但並非所有設備都需要煞車電阻\n\n電動車通常優先利用可接受充電的電池吸收回生能量，也必須考慮電池溫度、電量、充電能力及控制安全"}],"questions":["回生能量流到其他模組，還是電網？","你負責的是哪個轉換環節？"],"related":["e14-role","supplier-review"],"addedAt":"2026-11-19","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"電力電子","changeKind":"update"},{"id":"power-split","units":["E14","跨領域"],"cat":"職能判斷","title":"大電 EE、Power EE、Control EE 怎麼分？","en":"Electrical Career Map","summary":"先看工程對象與交付物，再看電壓、功率及職稱。","tags":["大電","EE","Power Electronics","Control","PCB"],"body":[{"title":"建廠大電","text":"「判斷大電EE適配性」對話關注資料中心或廠房供配電，將人才分為電力系統設計、建廠施工及兩者兼具。使用者明確表示 A、B 都要找。"},{"title":"E14 Power EE","text":"「E14 EE」初談關注 CDU 設備內部電力電子、電源轉換、變頻器及供應商審查。其技術背景與建廠配電有交集，但需要不同實績。"},{"title":"Control 與一般硬體","text":"Control 偏控制邏輯、流量／轉速調節；一般硬體可能偏電路板、訊號或產品除錯。需確認具體工作範圍，不能單靠 EE 職稱分類。"},{"title":"四種工作分開看","text":"大電設計：整座設施的容量、單線圖、配電、備援與保護。\n大電施工：設備安裝、線纜／Busway、承包商、測試與送電。\nPower EE：設備內部的電源轉換、功率級、損失、散熱及保護。\nControl EE：控制盤、PLC／HMI、I/O、感測與控制邏輯。實際團隊可能交疊，但每一種都有不同交付物。"},{"title":"相似關鍵字的不同意思","text":"Power Sequence 可能只是板級電源啟動時序；Power Consumption 可能是產品功耗量測；On-site Support 可能是客戶產品除錯。這些都不能單獨當作廠房配電設計或施工經驗。應繼續問設備層級、本人責任與交付物。"},{"title":"匿名案例：充電樁與高壓電子負載","text":"做過充電樁內部轉換電路，和規劃充電站外部變壓器、配電盤、AC 進線是兩段不同工作。高壓電子負載或功率半導體測試設備，也不同於整座設施的 MW 容量與配電。這些經驗可能相關，但需逐項核對，不能由電壓或功率數字直接判定。"}],"questions":["你的交付物是設備功率模組，還是建築供配電系統？","實際做過哪些設計與現場驗證？"],"related":["power-design","power-build","e14-role","evidence"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"power-design","units":["跨領域"],"cat":"人才需求","title":"大電 A：電力系統設計型","en":"Electrical Power Design","summary":"以配電規劃、設備配置與設計交付物確認能力。","tags":["大電","SLD","UPS","配電","設計"],"body":[{"title":"工作範圍","text":"A 設計型與 B 施工型都是正式需求。A 聚焦高低壓配電、容量與負載、單線圖、設備配置及保護協調；B 聚焦施工、設備安裝、測試與送電，各自有獨立交付物。"},{"title":"建議找的證據","text":"本人負責的系統範圍、設計計算、圖面、設備選型及審查紀錄。公司有大型設備產品，不能直接推定本人做過整體配電。"},{"title":"分類原則","text":"A、B 是專業方向，沒有高低等級；只有單一方向實績仍可符合對應職缺。具體必備條件須以職缺確認。"},{"title":"A 類的完整責任","text":"依這次招募需求明確要求，A 電力系統設計型與 B 建廠施工型均為正式需求。A 聚焦建置前期的容量、負載、MV／LV 架構、SLD、變壓器、Switchgear、配電盤、UPS、PDU、Generator、N+1／2N、短路分析與保護協調。備援名稱仍須對應實際架構與運轉條件。"},{"title":"履歷與面試應看到的成果","text":"請說明專案容量、設備層級、設計依據、單線圖範圍、計算書、設備規格與審查責任。分清本人設計、外部顧問設計、僅審圖與協調。可用去識別化文件或案例說明，不要求公開機密圖面。"},{"title":"搜尋背景與交界","text":"資料中心、半導體廠務、科技廠房、EPC、機電工程、電力顧問或關鍵設施等背景可搜尋。設備廠商也可能有人負責系統規劃，但仍須看實際責任。A 專業人才不必因缺少 B 的施工履歷就被視為不符；跨設計施工是另加的完整性。"}],"questions":["你負責過哪一段供配電系統的設計？","請說明你交付的單線圖或負載分析。","你負責哪些容量／負載計算及 SLD？","如何決定備援架構、設備容量及保護配置？","設計變更如何帶到施工、測試與驗收？"],"related":["power-build","power-split","evidence"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"power-build","units":["跨領域"],"cat":"人才需求","title":"大電 B：建廠施工與試運轉型","en":"Electrical Construction & Commissioning","summary":"確認設備安裝、現場管理、測試及送電驗收責任。","tags":["大電","施工","Commissioning","送電","MEP"],"body":[{"title":"對話整理方向","text":"B 類偏高低壓設備安裝、電纜與 Busway 施工、承包商協調、測試與試運轉、送電驗收。這是適配性討論中的職能框架。"},{"title":"需要區分","text":"到客戶現場支援產品除錯，與負責建廠電力施工是不同的經歷。應追問設備、現場責任、施工圖及驗收文件。"},{"title":"需要補問的能力","text":"履歷沒寫送電或施工實績時，先補問實際責任、工程文件與驗收結果，不直接當作沒有能力；也不以設備工作電壓或到現場出差代替施工證據。"},{"title":"B 類的完整責任","text":"高低壓配電施工、變壓器與開關設備安裝、電纜與 Busway、施工圖審查、現場工程管理、設備測試、系統整合、Testing & Commissioning、送電計畫與驗收，以及承包商／設備商協調。具體資格、程序與安全規範依專案所在地及設備要求。"},{"title":"交付物與責任深度","text":"追問施工範圍、圖面與現場落差、介面衝突、設備測試、缺失整改、送電前條件、試運轉紀錄與驗收文件。到現場看過設備不等於負責施工；配合單一產品測試也不等同整體設施送電。"},{"title":"與 A 類如何銜接","text":"A 提供系統設計與計算，B 把設計落地、確認安裝與測試；現場變更需回到設計核准與最終圖面。招募需求明確要求 A、B 都要招募，不能把只具 B 專長的人當成次級需求。"}],"questions":["你在現場負責的工程範圍與驗收交付物是什麼？","施工異常或測試不合格時，你如何推動結案？","你實際管理哪段配電施工與承包商？","送電前由你確認哪些條件？","測試失敗時如何定位、整改並重新驗收？"],"related":["power-design","power-split","evidence"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"evidence","units":["T34","E13","E14","跨領域"],"cat":"職能判斷","title":"適配性判斷：關鍵字後面要有證據","en":"Evidence Before Rating","summary":"公司產品、職稱與技術名詞，都只是進一步確認的起點。","tags":["履歷","適配性","待確認","證據"],"body":[{"title":"可重複使用的原則","text":"從 TPM、供應鏈、研發與 EE 對話可歸納：判斷應回到本人工作、決策範圍、交付物及驗證結果。產品功率或公司知名度，不能直接代表個人能力。"},{"title":"三種紀錄狀態","text":"已明確證實：有具體工作說明或可核實成果。待確認：履歷或對話未提供足夠證據。已確認無此經驗：本人明確否認，或經查證不在責任範圍。"},{"title":"評分限制","text":"未經正式核定的權重與分級只能當作討論工具，不用來自動淘汰人選。適配性應回到工作條件、本人責任與可核對成果。"},{"title":"補充資訊後應重新核對","text":"設備作品可能提供新的追問線索，但公司產品具有大功率，仍不能直接證明本人負責該產品或外部供配電。新增證據後重新核對責任、文件與驗證，不固定沿用第一次印象。"},{"title":"用責任、文件、結果還原工作","text":"以匿名案例問：產品／設施是什麼、本人做哪段、交付何種圖面或報告、誰審查、如何測試、最後結果如何。缺少證據時記錄需要補問的項目，不把未寫在履歷上的工作直接當成一定不會。"}],"questions":["哪項成果能證明這是本人做的？","目前缺的是能力，還是資料？"],"related":["power-split","tpm","supplier-review"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"drybulb","units":["跨領域","E13","T34"],"cat":"技術概念","title":"乾球溫度，就是一般空氣溫度","en":"Dry-Bulb Temperature","summary":"從面談裡的「乾求溫度」，整理成能連回散熱情境的概念。","tags":["乾球溫度","乾求溫度","Dry Bulb","空氣","散熱"],"body":[{"title":"一句話理解","text":"乾球溫度是乾燥、適當遮蔽與通風的溫度感測器測得的空氣溫度。與濕球讀值相比，它沒有刻意透過濕潤感測端的蒸發降溫。"},{"title":"對話中的應用背景","text":"相關討論將它連到散熱器進風與 Dry Cooler。理解規格時，需問清楚量測位置與環境條件，不能把室外溫度直接當作設備所有位置的溫度。此段是應用推論。"},{"title":"招募追問","text":"可問工程師，如何記錄散熱測試的進風與環境條件，以及怎麼區分測試條件變化和產品本身的改善。"},{"title":"怎麼理解與測量","text":"一般溫度計量到、不靠感溫部位水分蒸發降溫的空氣溫度，可理解為乾球溫度。測量仍需避免日照輻射、附近熱源與取樣位置造成偏差；機房室溫不一定等於散熱器真正進風溫度。"},{"title":"為什麼影響設備性能","text":"Heat Sink 需要把熱傳到進風；Dry Cooler 需要把液體熱量排到環境空氣。環境越熱，在其他條件相同時可用溫差可能越小，達到相同排熱量所需的換熱面積、風量或供液溫度條件會不同。"},{"title":"教學情境","text":"乾球 30°C、濕球 25°C 的空氣，不能把 25°C 直接當成純乾式 Dry Cooler 的供液能力。純乾式顯熱交換與蒸發冷卻的參考條件不同；實際還有 Approach、流量、換熱器與負載限制。這些是示意條件，不是特定產品保證。"}],"questions":["測試報告中的空氣溫度量在哪裡？","兩次測試的進風條件不同，結果如何比較？"],"related":["wetbulb","thermal-fa"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"熱環境"},{"id":"wetbulb","units":["跨領域"],"cat":"技術概念","title":"乾球、濕球與露點，分別在說什麼？","en":"Dry Bulb / Wet Bulb / Dew Point","summary":"空氣溫度、蒸發冷卻與凝結條件是不同資訊。","tags":["濕球溫度","露點","乾球溫度","濕度"],"body":[{"title":"乾球","text":"一般的空氣溫度讀值。"},{"title":"濕球","text":"濕潤感測端受蒸發冷卻後的溫度，與空氣濕度及壓力條件有關。在常見、非結冰的飽和空氣條件下，濕球與乾球相同；未飽和時濕球通常較低。"},{"title":"露點","text":"在壓力與含水量不變等條件下，空氣冷卻至飽和的溫度。不要把濕球與露點當作同一個溫度。三者區別已參照美國國家氣象局資料。"},{"title":"三個溫度的差別","text":"乾球：目前空氣溫度。濕球：水分蒸發帶走熱量後的參考溫度，與空氣含濕量及壓力有關。露點：空氣在含水量不變的情況下冷卻到開始凝結的溫度。露點不是濕球溫度。"},{"title":"飽和與工程用途","text":"在相同壓力與常見未飽和條件下，露點通常不高於濕球，濕球不高於乾球；飽和時三者可相等。乾濕球差可反映蒸發潛力，但不能只憑溫差直接得到所有濕度與設備性能。"},{"title":"設備選型與結露","text":"Cooling Tower 主要看濕球相關的蒸發冷卻條件；Dry Cooler 主要看乾球相關的顯熱交換條件。液冷供液若使表面低於環境露點，可能結露，因此控制需考慮露點裕度與保溫。不能把降低供液溫度視為無代價的性能提升。"}],"questions":["這份規格需要乾球、濕球，還是露點條件？"],"related":["drybulb"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"熱環境"},{"id":"ramp","units":["跨領域"],"cat":"技術概念","title":"斜坡濾波器，不等於斜坡控制","en":"Ramp Filter vs. Ramp Control","summary":"先確認原文與情境，避免把影像重建與設備控制混在一起。","tags":["斜坡濾波器","Ramp Filter","Ramp Control","Rate Limiter"],"body":[{"title":"Ramp Filter","text":"在影像斷層重建中，ramp 是濾波反投影使用的一種濾波選項。scikit-image 官方範例將它與其他濾波器一起說明。"},{"title":"Ramp Control / Rate Limiter","text":"控制情境中可能指限制命令變化速率，例如逐步提高轉速命令。MathWorks 的 Rate Limiter 文件明確定義為限制訊號的一階變化率。"},{"title":"尚未確認","text":"使用者最初只提供中文名詞，沒有原始英文、設備畫面或完整上下文。因此不能斷言面談所說的就是其中一項；先保留可能解讀。"},{"title":"真正的 Ramp Filter","text":"典型影像應用是 CT 濾波反投影，理想頻域增益與頻率絕對值成正比。它補償反投影的模糊，也會強化高頻雜訊，實作可能配合窗函數。這不是讓幫浦平順加速的控制器。"},{"title":"Ramp Control／Rate Limiter","text":"限制每秒命令變化量，常用在 Pump、Fan、溫度設定值或扭力命令。上升與下降速度可以不同；命令變得平順，不代表實際流量、壓力或轉速必然依同一條線變化。"},{"title":"如果原詞來自面談","text":"需問是在談影像重建、量測訊號濾波、PWM、馬達加減速還是設定值漸變。不能因中文都叫斜坡，就把 Ramp Filter、Ramp Control、Rate Limiter 與低通濾波直接合併。"}],"questions":["你說的 ramp 是頻域濾波，還是命令變化率限制？","有原文、控制方塊或設備參數名稱嗎？"],"related":["ramp-demo","e14-role"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"感測與控制"},{"id":"ramp-demo","units":["跨領域"],"cat":"技術概念","title":"讓轉速命令慢慢改變：斜坡示例","en":"Rate Limiter Example","summary":"用可調整示意理解「每秒最多變多少」。","tags":["斜坡控制","Rate Limiter","Pump","Fan"],"body":[{"title":"示意條件","text":"假設命令由 30% 上升到 80%，上升速率限制為每秒 10 個百分點，命令需要 5 秒到達目標。這是簡化教學示例。"},{"title":"工程界線","text":"限制的是命令訊號，實際轉速仍由馬達、驅動器與系統響應決定。此例不代表任何 CDU 的指定設定。"},{"title":"如何閱讀互動圖","text":"調整每秒變化量，觀察命令到達目標的時間。圖中折線是理想命令，不是設備實測資料。"},{"title":"30% 到 80% 的完整算例","text":"假設上升限制為每秒 10 個百分點，命令由 30% 到 80% 需約 5 秒；不是每秒乘 1.1。離散控制每 0.1 秒更新時，每次最多增加 1 個百分點。這是理想命令教學，不代表馬達可立即跟隨。"},{"title":"下降與保護如何處理","text":"正常減速可以有另一個下降限制；故障停機、急停或最低流量保護是否繞過正常斜坡，需要由風險分析與設備控制設計決定。不能直接把展示中的參數當成現場控制設定。"},{"title":"看展示時注意什麼","text":"比較目標命令、受限後命令與實際回授是三條不同訊號。想知道有沒有減少衝擊，還要量轉速、流量、壓力與溫度的實際響應。"}],"questions":["速率限制設定作用在命令，還是回授訊號？"],"related":["ramp"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"感測與控制"},{"id":"kits","units":["T34","跨領域"],"cat":"技術概念","title":"Feeder Kit、Hose Kit 與 Loop Charge Kit","en":"Liquid Cooling Equipment","summary":"先區分補液設備、連接管路與充填／維護工具。","tags":["Feeder Kit","Hose Kit","Loop Charger","液冷"],"body":[{"title":"對話中的功能分類","text":"相關討論把 Feeder Kit 整理為補液設備，Hose Kit 為軟管與接頭等連接套件；Loop Charge Kit 則作為迴路充填、沖洗與回收的相關工具。"},{"title":"對應人才能力","text":"可從產品功能追問機電整合、流體控制、管路配置、材料相容與測漏驗證。這是招募應用推論，並非某職缺的正式必備清單。"},{"title":"規格待校核","text":"不沿用討論中的容量、壓力、濾網精度或交貨日期。Loop Charger 是否等同特定 Loop Charge Kit，仍須用料號與官方產品文件確認。"},{"title":"三種產品逐項比較","text":"Feeder Kit：有儲槽、幫浦與控制的注液／補液設備，可能提供沖洗、過濾與壓力控制。\nHose Kit：軟管、接頭與管路配件，連接 CDU、Manifold 與伺服器，重點是流體輸送、配置與密封。\nLoop Charge Kit：用於迴路充填、沖洗、過濾及回收的調試維護設備；實際功能依型號。三者不能只用新舊或大小區分。"},{"title":"補液設備規格比較","text":"對應的產品例中，Feeder Kit 為 150 L、25 μm、最高 40 psi；Loop Charge Kit 為 25 L、5 μm、最高冷卻液壓力 70 psi。另有 25 L 回收槽的描述尚未單獨核對。規格只適用相應型號與版本，不可推到所有補液設備，實際選用需核對完整產品文件。"},{"title":"產品命名與工程能力","text":"Loop Charger 可能是口語或專案名稱，未確認料號前不直接等同所有 Loop Charge Kit。Feeder 開發偏幫浦、流體控制與機電整合；Hose 偏材料相容性、接頭、耐壓、防漏及安裝。能做其中一種，不自然等於另一種也有完整設計經驗。"},{"title":"2.5 MW CDU 的單位","text":"討論中的 2.5 MW 等於 2,500 kW，描述排熱能力的產品等級，不是直接代表設備耗電量。實際能排多少熱仍取決於一次側／二次側溫度、流量、壓降及額定條件。"}],"questions":["你負責的產品是補液設備，還是管路組件？","你驗證過哪些流體、接頭或材料條件？"],"related":["leadtime","e14-role"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"液冷系統"},{"id":"eta","units":["T34","跨領域"],"cat":"技術概念","title":"ETA、ETD、Lead Time：把日期問清楚","en":"Delivery Vocabulary","summary":"預計抵達、預計出發與前置時間，不能放在同一欄。","tags":["ETA","ETD","Lead Time","交期"],"body":[{"title":"對話整理","text":"ETA 指預計抵達時間；ETD 指預計出發時間；Lead Time 是一段前置時間。預計日期不等於實際完成。"},{"title":"專案使用","text":"記錄時加上對象、地點、時區與狀態，例如是物料到工廠、成品出貨還是設備到客戶端。"},{"title":"連到面試","text":"交期問題要確認節點：完成製造、出貨、到港、通關與到廠可能是不同時間，應追問承諾的是哪個節點。"},{"title":"四個名詞對照","text":"ETA：Estimated Time of Arrival，預計到達。\nETD：Estimated Time of Departure，預計出發／離港。\nLead Time：從定義的起點到終點所需時間，例如下單到出貨；須說清邊界。\nECD：Estimated Completion Date，預計完成日。這四者不等於實際發生日期，也不自動互相代換。"},{"title":"例子要問清楚哪個交付物","text":"問 CDU 的 ETA 時，可能是樣機到實驗室、物料到工廠或成品到客戶。Loop Charger under validation 是驗證狀態，不能直接由預計到貨日推定已驗證完畢。進度表應分列產品／版本、里程碑、地點、日期、依賴與風險。"}],"questions":["這個 ETA 指到哪裡、哪一批貨？","日期依據是供應商承諾，還是內部推估？"],"related":["leadtime","scpm"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"供應鏈術語"},{"id":"supply-planning","units":["跨領域"],"cat":"職能判斷","title":"供應鏈規劃：把需求、供應與產能接起來","en":"Demand, Supply & Capacity","summary":"從提早辨識風險，走到跨部門推進改善。","tags":["Supply Chain","Forecast","Capacity","Ramp-up"],"body":[{"title":"使用者觀察","text":"使用者在供應鏈面試對話中明確整理：團隊需要能從整體專案辨識風險、提出可執行方案的人，並從開發前期掌握工程、品質、物料及產能準備。"},{"title":"和日常追料的差別","text":"依對話歸納，重點延伸到未來需求與工廠可交付能力是否一致。記錄缺料之後，還要有人負責方案、資源與完成時間。"},{"title":"可保留的證據","text":"需求預測來源、供應限制、產能假設、庫存代價、替代方案及改善結果。這些是公開整理框架，不是主管核定的評分表。"},{"title":"從 Sales 到工廠的一條需求鏈","text":"把 Sales Forecast、Customer Demand 與 Factory Plan 對在一起。每個數字需有版本、時間區間、可信度與負責人；預測不是正式訂單，工廠排程也不是客戶承諾。SCM 的工作是在需求、供應與產能之間找出落差並提出選擇。"},{"title":"風險必須從 EVT／DVT 提早看","text":"工作重點特別強調主動辨識，而非等量產缺料才依流程處理。樣品階段就該確認 BOM、長交期料、供應商工藝、產能擴張與替代方案；PVT 前逐步收斂量產條件。實際關卡與時點仍依產品規則。"},{"title":"安全庫存如何討論","text":"依 BOM 用量、需求波動、供應前置時間、關鍵度與服務需求分類。長交期、不可替代的料，與便宜通用料不應只套同一庫存天數。還需算資金占用、呆滯、保存期限與設計變更風險。"},{"title":"供應鏈與採購責任的差別","text":"採購可以負責供應商與交易條件；完整 SCM 還要把需求、庫存、物料、產能與客戶交付連起來。應以實際責任判斷，不能靠職稱升級。本篇為跨領域參考，不推定屬於特定單位。"},{"title":"Planning 與完整交付責任","text":"Demand Forecast、Supply Allocation、庫存與 S&OP 可能連到訂單交付；但完整 Fulfillment Owner 還需確認訂單、承諾、改期、出貨、物流及結案責任。接觸其中幾個環節不代表已負責全流程。"}],"questions":["Forecast 改變後，怎麼調整備料與產能？","你如何把風險預警轉成實際改善？","如何選供應商？如何準備爬坡產能？","長交期超出可控範圍時，何時提出風險？","如何決定安全庫存與提前備料？","投標尚未得標時，如何談供應承諾？","Planned PO 對你和供應商各代表什麼？","EVT、DVT、PVT 各階段要準備什麼？","量產爬坡的首要風險如何排序？","什麼時候導入 Second Source？","SCM 與採購的責任差在哪？","如何比較外包與內製成本？","你對過去產品從需求到交付負責到哪裡？"],"related":["capacity","leadtime","evidence"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"second-source","units":["跨領域","T34"],"cat":"面試洞察","title":"Second Source：導入時點與分量的取捨","en":"Second Source Readiness","summary":"第二來源要能通過驗證，也要有足以支撐投入的合作條件。","tags":["Second Source","PVT","風險","供應商"],"body":[{"title":"使用者觀察","text":"導入規劃上，第二來源應在量產前或更早評估技術、品質與產能條件，避免等量產發生問題才準備。"},{"title":"分量的取捨","text":"同時要注意，採購量過度分散可能影響供應商投入資源的意願。多來源與供應商承諾之間，需要按實際需求判斷。"},{"title":"追問方式","text":"確認第二來源是列入名單、完成樣品，還是已通過必要驗證且可量產；再確認切換時程、相容性與可供數量。"},{"title":"第二來源要在風險發生前準備","text":"先看單一來源的交期、產能、技術、地區與品質風險，再決定是否在開發驗證期間引入第二家。量產缺料後才開始找，仍要走打樣、規格確認、測試、可靠度與客戶核准，往往趕不上交付。"},{"title":"多一家不等於風險直接減半","text":"採購量切得太碎，可能降低議價力、模具投資與供應商服務意願，也增加驗證、管理與規格一致性的成本。需說明主副供分量、何時轉單、兩家共用哪些上游風險，以及維持備援的實際費用。"},{"title":"面試要看導入全流程","text":"從觸發原因、技術規格、工程樣品、量產驗證、轉單條件到導入結果追問；分清本人只是找報價，還是負責資格認證、品質及產能放行。"}],"questions":["你的第二來源什麼時候真正可以出貨？","導入成本與採購量如何安排？"],"related":["supply-planning","leadtime","reliability"],"addedAt":"2026-11-19","updatedAt":"2026-11-22","section":"jobs","knowledgeTopic":null},{"id":"dfm","units":["E13"],"cat":"開發流程","title":"DFM：把製造與品質風險帶回設計","en":"Design for Manufacturing","summary":"從教育訓練摘要，理解設計、製程與驗收如何銜接。","tags":["DFM","焊接","製程","品質"],"body":[{"title":"RD／DFM 要定義什麼","text":"焊接區的材料與表面要求、禁鍍範圍、加工餘量、最終尺寸、接頭形式、裝配間隙、焊接可接近性、定位／夾持、受力與檢驗位置。要檢查除鍍後是否仍有足夠壁厚與密封強度，焊後變形是否影響接觸面或接口。只在備註寫「焊接良好」無法替代可量測要求。"},{"title":"ME／PE 要把設計轉成受控步驟","text":"選擇加工方式，定義先後順序、切削與去毛邊、清潔、乾燥、保存與搬運、裝配固定、焊接參數與保護條件。設備程式、治具、操作者資格及變更版本也要對得上。工藝驗證完成後，才把可行條件變成作業窗口，不讓不同班別自行猜。"},{"title":"QA／IQC 的檢查責任","text":"來料檢查不只看尺寸，還要確認材質／表面、焊接面鍍層殘留與加工狀態；製程與成品則按圖面及計畫檢查焊縫、截面、尺寸、密封與必要性能。QA／IQC、製程品質及最終驗收的實際分工需在品質計畫寫清，不能假設某一單位包辦全部。"},{"title":"案例中的設計與保護條件表","text":"| 項目 | 案例討論的參考條件 | 解讀時必須帶的限制 |\n|---|---|---|\n| 焊接區禁鍍範圍 | 焊縫周圍約 1–1.5 mm | 需依接頭、熱影響範圍及量測基準確認 |\n| 設計加工餘量 | 約 0.3–0.5 mm | 不是每一面都直接切除相同厚度 |\n| 裝配間隙 | 不超過約 0.1 mm | 需說清量測位置、裝夾與溫度狀態 |\n| 保護氣體 | 氬氣，純度記為不低於 99.999% | 氣源純度不等於焊區實際保護效果 |\n| 氣體流量 | 約 12–18 L/min | 與噴嘴、位置、漏氣、風及接頭有關 |\n| 延時停氣 | 約 0.5–1.0 秒 | 需與設備、冷卻及焊區保護程序一起驗證 |\n\n本表是案例條件的完整記錄，不是直接套用於其他零件的量產設定。實際製程必須有對應材料、圖面、焊接程序及驗證結果。"},{"title":"禁鍍區不是畫一圈就結束","text":"先定義以焊縫中心、接頭邊緣或其他基準量測，處理轉角、孔口及遮蔽誤差；再檢查鍍層邊界是否會進入熔池或熱影響區。禁鍍也可能改變耐蝕表面，因此焊接與使用環境的要求需一併解決，不單獨追求「越大越好」。"},{"title":"為何間隙影響熔合與漏液","text":"接頭間隙改變熱與材料的分布，可能讓局部搭接、填充或熔合不足；零件公差、夾持、熱變形也會改變實際間隙。量到某一點小於限制，不代表整圈都相同。應定義最不利位置、裝配方式與焊後尺寸，對照截面與密封結果。"},{"title":"保護氣體要看整條鏈","text":"確認氣體規格、管路與接頭、流量計、噴嘴、焊區位置、前後送氣、周圍氣流與必要的內部保護。流量過低可能覆蓋不足，單純加大也不保證更好，因為流場可能受到擾動。最後仍以焊縫品質與適用試驗確認。"},{"title":"變更如何進入正式標準","text":"把有效對策寫回圖面、BOM／材料要求、加工及焊接程序、治具與檢驗計畫；對供應商與製造端發出一致版本。保留變更原因、適用料號／範圍、驗證與生效時間，舊版物料的處置也要清楚。這才是由失敗案例轉成可重用知識。"},{"title":"匿名失效案例：先還原現象","text":"案例為不鏽鋼零件與水嘴接合，焊後出現氣孔、微裂紋，密封檢查漏液。案例記錄的原批量為 200 件，該批不良率記為 100%；水嘴帶高磷鎳鍍層，鍍層厚度描述為 10 μm 以上。這些是單一案例條件，不能推成所有鍍鎳水嘴都會同樣失效。"},{"title":"匿名失效案例：設計與製程一起改","text":"改善方向是在水嘴設計上增加約 0.3 mm 的加工餘量，在焊前用 CNC 處理接合面，案例記錄去除量至少約 0.2 mm，以移除鍍層及相關表層影響。真正的改變不只是多一道加工：RD 必須讓工廠有空間、有基準且不破壞最終尺寸地加工，製程再確保表面與組裝符合要求。"},{"title":"加工量、鍍層厚度與單位","text":"10 μm = 0.010 mm；0.2 mm = 200 μm。不能因去除量大於鍍層厚度，就推定一定合格：要確認去除位置、局部殘留、尺寸基準、剩餘壁厚、平整度、表面與接合間隙。圖面預留的加工餘量和最後實際切除量，也不是可以任意互換的同一個數字。"},{"title":"匿名失效案例：結果要怎麼讀","text":"改善後良率記為 99.5%。這表示該批條件下結果改善，不能直接證明製程從此永遠穩定，也不能自行假定改善批仍然是 200 件。教學上若一批 200 件中 199 件合格，才會得到 99.5%；這只是比例算例，不是反推改善批的真實件數。還需要知道樣本、判定方法、失效分類與後續量產表現。"}],"questions":["設計怎麼確保後續工序能完成？","改善方案由誰驗證，如何回寫圖面或標準？"],"related":["project-status","reliability","thermal-fa","e13-engineering-complete"],"addedAt":"2026-11-19","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"產品開發與驗證","changeKind":"update"},{"id":"project-status","units":["E13","跨領域"],"cat":"開發流程","title":"專案狀態與開發階段，要分開讀","en":"Project Status vs. Development Stage","summary":"「還在進行」與「走到哪個階段」回答不同問題。","tags":["專案","版本","進度","Status"],"body":[{"title":"四個資料區各做什麼","text":"| 區域 | 記錄重點 | 使用時要確認 |\n|---|---|---|\n| Project List 基本資料 | 產品、專案、客戶類型、平台與整體狀態 | 身分與範圍是否一致、是否重複列案 |\n| Project Status | 負責角色、階段與產品示意 | 階段、狀態與角色不能混用 |\n| 研發工程紀錄 | 規格、文件版本、設計／測試與異常 | 要連到對應樣品、條件及結果 |\n| 製造／其他團隊紀錄 | 樣品、工藝、進度、問題與下一步 | 是否與研發版本同步、介面問題誰處理 |\n\nA3 Version／Content 類欄位用來追文件與內容；不能只憑 A3 三字就認定一定是某種紙張尺寸或固定問題解決模板。"},{"title":"整體狀態與工程階段分兩條軸","text":"On-going 表示仍進行；Pending 表示等待條件或後續處理；Close 表示結案狀態，但原因可能是完成、停止或其他安排，不能只看字面推定量產成功。C0～C5 則回答工程進到哪個內部關卡。同一案 On-going 且 C4 並不矛盾。"},{"title":"C0 至 C5 的這套階段分法","text":"| 階段 | 這套表格中的名稱 | 應補問的放行證據 |\n|---|---|---|\n| C0 | 新案 | 需求、範圍、可行性與負責人 |\n| C1 | 設計 | 規格、設計版本、分析與待解風險 |\n| C2 | 樣品 | 樣品版次、製作與初測結果 |\n| C3 | 模具 | 工裝／模具與試作、修正及驗證 |\n| C4 | 試產 | 工藝、測試、良率、供應與量產準備 |\n| C5 | 量產 | 正式版、驗證與持續品質／交付 |\n\n名稱是這套內部分法；右欄為工程檢查框架，不代表所有公司或每一案都有完全相同關卡。不能直接把每個 C 碼逐一等同 EVT／DVT／PVT。"},{"title":"一筆有用的進度紀錄","text":"日期、樣品／圖面版本、做了哪個試驗、條件與目標、結果、問題分類、暫時處置、永久對策、責任人、下次交付物及日期。例：「V2 以條件 A 完成熱測，目標尚未達到；先查 TIM 接觸與風量，下次交付重裝對照與模擬差異表。」這比「持續處理中」可行動得多。"},{"title":"版本變更如何避免假改善","text":"改了底座、流道、材料、焊接、測試治具或規格，都可能使前後結果不再可比。需把圖面、BOM、樣品、測試程序、原始數據與報告版本連起來；不能拿舊版合格報告替新版放行，也不能把不同條件的變化直接稱為設計改善。"},{"title":"主管實際需要的工程答案","text":"性能是否達標、樣品與試驗是否如期、主要阻礙是設計還是製程／物料／測試、誰有責任與資源、規格是否變更、下一個樣品或報告何時交。這些是管理應檢查的問題，不是為了填滿報表而產生的欄位。"},{"title":"跨團隊追蹤要讓問題能被關閉","text":"把同一問題的設計端、製造端與品質端內容連起來。例如漏液不能只由製造端回報已重焊，還要回到材料與表面、圖面前處理、截面及密封驗證；關閉標準應是所需證據完成，而非日期到了或某人說已處理。"}],"questions":["這個 Close 是交付完成，還是專案停止？","目前版本有哪些未結工程問題？"],"related":["npi","dfm","eta","e13-engineering-complete"],"addedAt":"2026-11-19","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"產品開發與驗證","changeKind":"update"},{"id":"cooling-levels","units":["E13","T34","跨領域"],"cat":"技術概念","title":"Chassis、Rack、冷板與 CDU：設備層級不同","en":"Chassis / Rack / Cold Plate / CDU","summary":"把伺服器機箱、機櫃、晶片冷卻元件與液冷設備分開理解。","tags":["Chassis","Rack","Cold Plate","CDU"],"body":[{"title":"從原始提問整理","text":"使用者在對話中提到「chaces」「cold palte」「heathink」，後續整理對應為 Chassis、Cold Plate、Heat Sink。英文辨識依語境推定，仍可由圖面或產品標示確認。"},{"title":"設備層級","text":"Chassis 是單台伺服器的機箱；Rack 是容納設備的機櫃；Cold Plate 是冷板；CDU 則屬液冷分配與熱交換相關系統設備。這些名詞不能互相替代。"},{"title":"招募判斷","text":"會設計冷板不等同會整合 CDU；做機箱不代表負責建築側冷卻系統。追問設計邊界、介面、實際交付物與驗證方式。"},{"title":"由晶片到設施的層級","text":"Chip／CPU／GPU 是熱源；Heat Sink 或 Cold Plate 是熱源附近的散熱模組；Chassis 是伺服器機箱；Rack 集中多台伺服器與歧管；CDU 管理與交換冷卻液熱量；設施端再把熱排到外界。Chassis 不是 Heat Sink，Rack 也不是 CDU。"},{"title":"熱與冷卻液怎麼走","text":"冷板內的流體吸熱，經軟管到機櫃歧管，再回到 CDU 的系統迴路。液對液 CDU 通常透過熱交換器把熱交到另一個迴路，而不是讓兩邊冷卻液直接混合。實際有液對氣、液對液等不同拓樸，應先看系統圖。"},{"title":"讀職缺時對應責任","text":"E13 的模組設計可能重點在熱阻、接觸、流道與製程；T34 液冷／CDU 則可能延伸到 Pump、HX、Valve、配管、感測與控制整合。這是技術層級的比較，不用來補造尚無口語的 T34 RD、FAE 或其他職缺。"},{"title":"十四、CDU 與 AI 資料中心液冷系統","text":"這一章要把前面的電力電子知識和 E14 實際產品連起來"},{"title":"CDU 是什麼？","text":"CDU 全名是 Coolant Distribution Unit，冷卻液分配單元\n\n它負責協助冷卻液在 IT 設備與外部冷卻系統之間流動、交換熱量及監控操作狀態\n\n一次側\n\nFacility Water System\n\n接建築或外部冷卻水系統\n\n二次側\n\nTechnology Cooling System\n\n將冷卻液送往 IT Rack 與 Cold Plate\n\nHeat Exchanger 熱交換器\n\n兩側交換熱量，典型液對液設計的流體彼此隔離\n\nASHRAE 的資料中心冷卻資料也說明，CDU 常用來連結設施冷卻水系統與 IT 冷卻迴路，並利用熱交換器傳遞熱量"},{"title":"CDU 的關鍵設備","text":"| 名稱 | 用途 |\n|--------|--------|\n| Pump | 推動冷卻液循環 |\n| Motor | 帶動 Pump 運轉 |\n| VFD | 視設計需要調整 Pump 馬達轉速 |\n| Heat Exchanger | 交換熱量 |\n| Temperature Sensor | 偵測溫度 |\n| Pressure Sensor | 偵測壓力 |\n| Flow Sensor | 偵測流量 |\n| Leak Sensor | 偵測漏液 |\n| Control Board／PLC | 執行控制與保護 |\n| Power Supply／PDU | 提供或分配設備所需電力 |"},{"title":"為什麼 E14 需要懂電力電子？","text":"因為 CDU 雖然是液冷設備，但它並非只有管路與水\n\nCDU 裡面的 Pump、馬達、變頻器、感測器、控制板、電源及安全保護，都與電機、電子及電力系統相關\n\n例如冷卻液流量不足，可能是 Pump 轉速不夠，也可能是管路阻塞、感測器異常或控制器設定問題\n\n因此系統工程師需要同時理解電力、控制與流體系統如何互相影響"},{"title":"氣冷、液冷、Chiller、Dry Cooler 差異","text":"| 設備 | 中文 | 主要功能 |\n|--------|--------|--------|\n| Heat Sink | 散熱器 | 將元件熱量傳至周圍空氣 |\n| Cold Plate | 冷板 | 將元件熱量傳到冷卻液 |\n| CDU | 冷卻液分配單元 | 分配冷卻液、監控及交換熱量 |\n| Chiller | 冰水主機 | 透過製冷循環提供冷水 |\n| Dry Cooler | 乾式冷卻器 | 利用外界空氣移除冷卻液的熱量 |\n| Cooling Tower | 冷卻水塔 | 通常透過蒸發散熱等方式排除熱量 |\n\nCDU 不一定自己製造冷水，也不等於 Chiller\n\n使用 Dry Cooler 或 Chiller，要看系統的供水溫度、環境條件、散熱需求與整體設計"},{"title":"PDU 和 CDU 不一樣","text":"- PDU（Power Distribution Unit）：配電單元，管理或分配電力\n- CDU（Coolant Distribution Unit）：冷卻液分配單元，處理冷卻液循環與熱交換\n\n還有一個同名縮寫值得注意：\n\nTCS 在電動機車是 Traction Control System；在資料中心液冷領域，也常指 Technology Cooling System\n\n這兩者完全不是同一個系統"},{"title":"二、Chassis｜伺服器機箱","text":"英文：Chassis\n\n中文：機箱、機殼\n\n功能：\n- 容納 CPU、GPU、主機板、記憶體、電源供應器等元件\n- 提供散熱模組、風扇、冷板與管路的安裝空間\n- 支援伺服器內部氣流與液冷管路配置\n\n需要區分：\n\n- Chassis：單台伺服器的機箱\n- Rack：放置多台伺服器的機櫃\n- Cold Plate：直接接收晶片熱量的液冷元件\n- CDU：負責液冷系統冷卻液分配、控制及熱交換的設備\n\n液冷路徑示例：\n\nCPU／GPU → Cold Plate → Chassis 內部軟管 → Rack Manifold → CDU\n\n上述箭頭用於簡化設備連接關係，實際冷卻液在供水與回水管路中循環"}],"questions":["你負責的是晶片冷卻元件、伺服器整機，還是 CDU 系統？"],"related":["e13-engineering-complete","air-liquid","primary-secondary","kits"],"addedAt":"2026-11-20","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"液冷系統","changeKind":"update"},{"id":"air-liquid","units":["E13","T34","跨領域"],"cat":"技術概念","title":"氣冷 Heat Sink 與液冷 Cold Plate 怎麼比？","en":"Air Cooling & Cold Plate Cooling","summary":"先看熱量經過哪裡，再比較介質、流量與阻力。","tags":["Heat Sink","Cold Plate","氣冷","液冷"],"body":[{"title":"氣冷情境","text":"相關討論以伺服器氣冷散熱器為例：熱從晶片傳入底座與鰭片，再由流動空氣帶走。是否搭配 VC 或熱管，取決於設計。"},{"title":"冷板情境","text":"相關討論描述冷卻液流過冷板內部，把熱帶往其他熱交換設備。檢查時除了溫度，也要看流量、壓降、密封與系統介面。"},{"title":"比較界線","text":"Heat Sink 是廣義散熱元件名稱，不能在所有場合都解讀成只用空氣。氣冷與液冷方案比較必須在相同邊界條件及目標下進行。"},{"title":"氣冷 Heat Sink 的路徑","text":"晶片 → TIM → 金屬底座／VC／Heat Pipe → 鰭片 → 空氣。風扇或機箱風道影響實際風量與壓差；不能只看散熱器面積。Heat Sink 在廣義上是散熱構件，本篇依相關討論用於氣冷模組的比較。"},{"title":"液冷 Cold Plate 的路徑","text":"晶片 → TIM → 冷板金屬 → 內部流道冷卻液 → 管路與後段排熱。主要設計包括通道／鰭片、分流、進出液口、材料、接合密封、壓降與維修。冷板不代表系統不再需要把熱排到外界。"},{"title":"完整比較條件","text":"比較熱負載、允許溫度、空間、噪音、氣流／液流、壓差、Pump／Fan 功耗、成本、漏液、材料相容與維護。液冷並非在任何條件都自動更好，氣冷也不能只因名稱就排除高性能設計。"},{"title":"二、E13 主要產品與技術原理","text":"Server Heat Sink\n\n伺服器散熱器，負責將晶片熱量傳遞至外部環境。\n\n\n\nVapor Chamber（VC）\n\n均熱板，利用相變熱傳將局部熱量擴散。\n\n\n\nHeat Pipe\n\n熱導管，將熱量從吸熱端傳送至散熱區域。\n\n\n\nCooling Fins\n\n散熱鰭片，增加與空氣接觸的散熱表面積。"},{"title":"Heat Sink 的散熱流程","text":"實際散熱器不一定同時使用 VC 與 Heat Pipe，須依產品規格決定。"},{"title":"熱傳遞的三種基本方式","text":"| 原理 | 英文 | 應用 |\n|--------|--------|--------|\n| 熱傳導 | Conduction | 晶片、底座、鰭片之間的熱傳遞 |\n| 熱對流 | Convection | 風扇驅動氣流帶走鰭片表面的熱 |\n| 熱輻射 | Radiation | 散熱器表面向周圍環境輻射熱量 |"},{"title":"VC 與 Heat Pipe 的兩相熱傳","text":"VC 和 Heat Pipe 通常利用內部工作流體的相變進行熱量傳輸：\n\n1. Evaporation（蒸發）：液體從熱源吸收熱量後變成蒸氣。\n2. Vapor Transport（蒸氣傳輸）：蒸氣移動至較低溫區域。\n3. Condensation（冷凝）：蒸氣釋放熱量後凝結為液體。\n4. Liquid Return（液體回流）：液體透過毛細結構回到吸熱區域，持續循環。\n\n其中，VC 偏重熱量擴散，Heat Pipe 則常用於將熱量傳送至較遠的鰭片區域。"},{"title":"三、Heat Sink｜氣冷散熱器","text":"英文：Heat Sink\n\n常見於伺服器的氣冷散熱設計\n\n基本構造：\n- 金屬底座（Base）\n- 散熱鰭片（Fins）\n- Heat Pipe（熱導管），視設計而定\n- Vapor Chamber（均熱板），視設計而定\n- 系統風扇提供氣流，可能不屬於散熱器本體\n\n工作原理：\n\nCPU／GPU 發熱 → 金屬底座吸熱 → 熱量傳遞至鰭片 → 空氣流經鰭片 → 熱量被帶走\n\n主要熱傳機制：\n- Conduction（熱傳導）\n- Convection（對流熱傳）\n\n研發重點：\n- 熱阻\n- 鰭片面積與間距\n- 空氣流量\n- 壓降與風阻\n- Heat Pipe／VC 傳熱性能\n- 結構尺寸與製程可行性\n\n注意：\n\nHeat Sink 是散熱元件的廣義名稱，並非所有 Heat Sink 都只能用於氣冷，但此模組主要介紹伺服器氣冷散熱器"},{"title":"四、Cold Plate｜液冷板","text":"英文：Cold Plate\n\n主要功能：\n\n利用冷卻液流經冷板內部流道，直接帶走 CPU／GPU 的熱量\n\n工作流程：\n\nCPU／GPU 發熱 → 熱量傳入 Cold Plate → 冷卻液吸熱 → 經管路流向 CDU → 熱交換後返回 Cold Plate\n\n基本構造：\n- 金屬底板\n- 內部流道\n- 冷卻液入口與出口\n- 接頭與密封結構\n- 視設計使用微通道或其他強化熱傳結構\n\n主要研發參數：\n- 冷卻液流量\n- 入口及出口溫度\n- 壓降\n- 熱阻\n- 流道結構\n- 冷卻液分配均勻性\n- 密封與漏液可靠度"},{"title":"Heat Sink 與 Cold Plate 比較","text":"| 項目 | Heat Sink（氣冷） | Cold Plate（液冷） |\n|---|---|---|\n| 主要冷卻介質 | 空氣 | 水或其他冷卻液 |\n| 熱量傳遞 | 晶片→底座→鰭片→空氣 | 晶片→冷板→冷卻液 |\n| 常見結構 | 鰭片、Heat Pipe、VC | 內部流道、微通道、接頭 |\n| 重要性能 | 熱阻、風量、風阻 | 熱阻、流量、壓降 |\n| 系統設備 | 風扇、機箱風道 | Pump、Manifold、CDU、管路 |"}],"questions":["你比較的性能條件與量測邊界一致嗎？"],"related":["e13-engineering-complete","cooling-levels","wick-microchannel","thermal-fa"],"addedAt":"2026-11-20","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"散熱技術","changeKind":"update"},{"id":"wick-microchannel","units":["E13","跨領域"],"cat":"技術概念","title":"毛細結構與微通道：不是同一個作用","en":"Wick & Microchannel","summary":"分辨回流用的毛細結構，與冷卻液通過的流道。","tags":["Wick","毛細結構","Microchannel","VC","Heat Pipe"],"body":[{"title":"毛細結構","text":"對話用紙巾吸水比喻毛細作用，並連到 VC／Heat Pipe 的工作液體回流。理解重點是蒸發、冷凝與回流如何形成循環。"},{"title":"微通道","text":"冷板中的細小流道讓冷卻液與受熱壁面交換熱量。對話提醒，尺寸縮小仍需評估阻力、流量分配、製造與堵塞問題。"},{"title":"模型與能力","text":"一般單相冷板的流動分析，與含相變及毛細回流的模型有不同假設。熟悉 CFD 軟體名稱，不代表已做過所有類型的散熱分析。"},{"title":"VC／Heat Pipe 的封閉相變循環","text":"熱端工作液蒸發，蒸氣移往較冷區域，冷凝後由毛細結構帶回熱端，再循環。燒結粉、金屬網與溝槽可形成不同回流結構；性能還受毛細極限、姿態、工作液、熱負載與製造品質影響。"},{"title":"Cold Plate 微通道的作用","text":"外部 Pump 讓冷卻液流過細小通道以吸熱，細化可增加換熱面積並改變局部熱傳，但也可能增加壓降、堵塞、清潔與加工難度。不能只說越細越好，需在散熱、流阻與可製造性間比較。"},{"title":"為何名稱相似卻不同","text":"毛細結構重點是靠表面張力與孔隙回液；微通道描述流道尺度與幾何。某些產品可能同時使用細微結構，但不能僅看顯微照片就判定是封閉相變或外部泵送液冷。"},{"title":"五、毛細結構｜Capillary Structure / Wick","text":"毛細結構利用毛細作用，使液體在細小孔隙或溝槽內移動\n\n生活比喻：\n\n紙巾接觸到水後，水會沿著紙巾內部細小空隙移動，即為毛細作用"},{"title":"應用於 VC 與 Heat Pipe","text":"典型運作過程：\n\n1. 發熱端吸收 CPU／GPU 熱量\n2. 內部工作液體受熱蒸發\n3. 蒸氣移動至較冷區域\n4. 蒸氣冷凝成液體\n5. 毛細結構將液體送回發熱端\n6. 形成持續的兩相熱傳循環\n\n常見毛細結構：\n- Sintered Powder Wick（燒結粉末毛細結構）\n- Mesh Wick（金屬網毛細結構）\n- Grooved Wick（溝槽式毛細結構）\n\n研發重點：\n- 毛細壓力\n- 滲透率\n- 孔隙率\n- 回流能力\n- 熱阻\n- 毛細極限與乾涸風險\n\n重要區分：\n\nVC／Heat Pipe 內部工作液體通常透過毛細力回流，不需要像一般 Cold Plate 系統那樣依靠外部 Pump 驅動循環"},{"title":"六、微通道｜Microchannel","text":"微通道是設計在散熱元件內部的細小流體通道\n\n在液冷 Cold Plate 中，冷卻液可以流經微通道，與受熱金屬壁面進行熱交換"},{"title":"為什麼使用微通道？","text":"主要目的：\n- 增加流體與金屬的接觸面積\n- 縮短熱傳導路徑\n- 提升局部對流熱傳能力\n- 改善高熱通量晶片的冷卻效果"},{"title":"微通道的工程挑戰","text":"微通道不代表越細越好\n\n通道尺寸縮小可能造成：\n- 壓降增加\n- Pump 功耗需求提高\n- 堵塞風險\n- 製造成本上升\n- 流量分配不均\n- 清潔及可靠度問題\n\n需要透過 CFD 模擬與實際測試，找出散熱性能及流動阻力之間的平衡"}],"questions":["你分析的流動是外部泵驅動，還是毛細回流？","模型處理了哪些物理效應，如何驗證？"],"related":["tree-channel","air-liquid"],"addedAt":"2026-11-20","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"散熱技術","changeKind":"update"},{"id":"tree-channel","units":["E13","跨領域"],"cat":"技術概念","title":"「樹枝狀」先問是在描述什麼","en":"Tree-like Channels & Wicks","summary":"可能指冷板流道，也可能是在談毛細結構的幾何形態。","tags":["樹枝狀","流道","微通道","毛細結構"],"body":[{"title":"先辨識產品","text":"原提問是「樹枝狀，是流道嗎？」後續整理保留兩種可能：用於流體分配的分岔流道，或特殊毛細結構。沒有上下文不能直接選定。"},{"title":"再辨識目的","text":"冷板流道要看流體如何分配與帶走熱量；毛細結構則要看回流機制與補液能力。幾何外觀相似，不代表功能與驅動力相同。"},{"title":"性能需要證據","text":"樹枝形狀不自動代表性能較佳。比較應交代相同熱負載、流量或泵功等條件，以及溫度、熱阻與壓降的驗證結果。"},{"title":"可能是兩種結構","text":"樹枝狀分岔流道：主流道逐級分流，設計流量分配與壓力損失。樹枝狀毛細結構：描述孔隙／毛細回流的形貌。兩者外觀都可能像樹枝，實際驅動機制、分析方法與驗證不同。"},{"title":"要先問的五個問題","text":"流體從哪裡進出？有外部 Pump 嗎？是單相流動還是蒸發冷凝？主張改善的是均溫、回流、熱阻還是壓降？用什麼邊界條件與實測證明？只有結構名稱或模擬彩圖，無法知道完整功能。"},{"title":"公平比較設計","text":"應在相同熱負載、入口溫度、流量或泵功率等可比基準下，看最高溫、均溫、壓降、流量分配與製造成本。不能把一張溫度較低的彩圖直接當成設計優勢。"},{"title":"七、樹枝狀結構｜Tree-like / Dendritic Structure","text":"樹枝狀是描述幾何形態的名稱，並不必然代表某一種固定產品\n\n在散熱研究中，可能指："},{"title":"A. 樹枝狀分岔流道","text":"英文：Tree-like Branching Channel\n\n常用於微通道或液冷板研究\n\n概念：\n- 主流道類似樹幹\n- 第一層分流類似大樹枝\n- 第二層分流類似小樹枝\n- 透過多層分岔將冷卻液分配至不同散熱區域\n\n設計目的：\n- 改善流量分配\n- 改善溫度均勻性\n- 提升局部熱傳效率\n- 在適當設計下控制壓降\n\n但實際性能取決於分支角度、尺寸、長度、流量及出口配置，不可假設樹枝狀流道一定優於平行流道"},{"title":"B. 樹枝狀毛細結構","text":"可能應用於特殊 VC、Heat Pipe 或兩相熱傳研究\n\n主要目的：\n- 提供液體回流路徑\n- 改善工作液體分配\n- 提升局部補液能力\n- 降低部分區域乾涸的風險"},{"title":"兩者差異","text":"| 比較 | 樹枝狀流道 | 樹枝狀毛細結構 |\n|---|---|---|\n| 主要產品 | Cold Plate、微通道散熱器 | VC、Heat Pipe 等 |\n| 流動驅動 | 通常使用 Pump | 通常利用毛細壓力 |\n| 主要目的 | 冷卻液分流與熱交換 | 工作液體回流 |\n| 研發重點 | 流量、壓降、熱阻 | 毛細力、滲透率、回流能力 |\n\n重要：會議只提到「樹枝狀」時，不可直接認定是流道，必須確認是在描述 Cold Plate，還是 VC／Heat Pipe 的內部結構"}],"questions":["原圖是在 Cold Plate，還是 VC／Heat Pipe 裡面？"],"related":["wick-microchannel","air-liquid"],"addedAt":"2026-11-20","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"散熱技術","changeKind":"update"},{"id":"primary-secondary","units":["T34","跨領域"],"cat":"技術概念","title":"CDU 一次側與二次側：先畫清楚邊界","en":"Primary & Secondary Cooling Loops","summary":"用熱交換與供回水關係，釐清設施側及 IT 設備側。","tags":["一次側","二次側","CDU","熱交換","Chiller"],"body":[{"title":"對話中的脈絡","text":"使用者轉述目前做二次側、努力開發一次側。這只能當作對話背景，不能據此宣稱公司已自製冷水機或取得特定產品能力。"},{"title":"以液對液架構理解","text":"相關討論以 CDU 熱交換器隔開設施側與 IT 設備側迴路說明。冷板、機櫃管路及設施冷卻設備分屬不同邊界，熱量傳遞不代表同一股冷卻液直接流遍全部設備。"},{"title":"需要確認","text":"實際產品可能有不同架構與名詞定義。面談提到蒸發端、冷凝端時，要確認是否正在談冷媒循環；不能自動等同 CDU 一次側、二次側。"},{"title":"典型液對液 CDU 的兩個迴路","text":"一次側常指 Facility Water System，連到建築／設施的排熱水系統；二次側常指 Technology Cooling System，連到機櫃與伺服器。熱經熱交換器傳遞，但兩側液體一般分離。命名仍需核對實際廠商圖面，不能只靠側別用語。"},{"title":"為何分開","text":"伺服器側可能需要特定水質、材料相容、潔淨度、溫壓與控制條件；設施側有自己的水處理及運轉需求。熱交換器可分隔兩邊，但同時增加溫差與壓降的設計限制；「分離」不代表兩邊完全沒有熱與控制的相互影響。"},{"title":"從冷板到外界的完整熱路","text":"Chip → Cold Plate → 二次側回液 → CDU HX → 一次側回液 → 設施排熱設備 → 外界。Chiller 冷媒迴路中的蒸發器／冷凝器是另一組元件名稱，不能直接拿來稱一次／二次側。"}],"questions":["這張系統圖用哪個設備作為迴路邊界？","是液對液熱交換，還是含冷媒相變的設備？"],"related":["cooling-levels","drybulb","kits"],"addedAt":"2026-11-20","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"液冷系統"},{"id":"leak-sensing","units":["T34","E14","跨領域"],"cat":"技術概念","title":"盛水盤與漏液感測器，功能怎麼分？","en":"Drip Tray & Leak Detection Sensor","summary":"收集液體、偵測漏液、執行保護是三個不同環節。","tags":["漏液","Sensor","盛水盤","Leak Detection"],"body":[{"title":"從聽到的術語開始","text":"使用者提到「盛水盤」「防漏液的 cencer」。對話依液冷語境將後者辨識為 Sensor；「折到」的原詞尚不確定。"},{"title":"分工","text":"盛水盤是液體承接／收集結構；漏液感測器提供偵測訊號；控制系統依設計執行警報或其他處置。感測器並不等於實體防漏構造。"},{"title":"不預設保護動作","text":"偵測到漏液後，是否停泵、停機、關閥或僅警報，必須查實際控制邏輯及風險分析。不能把討論中的例子直接套到每一台 CDU。"},{"title":"被動承接與主動偵測","text":"盛水盤（Drip／Drain Pan）承接漏出的液體；Leak Detection Sensor 偵測液體並輸出訊號。常見探頭或感測線的原理與適用液體不同，盛水盤本身不等於會偵測，感測器也不能阻止洩漏發生。"},{"title":"從漏液到控制動作","text":"漏液 → 被導流或收集到可偵測位置 → Sensor 改變輸出 → 控制器判斷 → 警報／保護。每一步都可能受位置、液體性質、感測器故障、配線與控制邏輯影響；測試要確認實際可偵測的洩漏路徑。"},{"title":"警報與停 Pump 不是固定同一反應","text":"依風險可能只警報、停特定泵、關閥、切換備援或受控停機。立即停泵也可能造成冷卻中斷，因此要看漏液位置、流量與設備安全設計；不能把示意流程當成所有 CDU 的設定。"},{"title":"術語辨識限制","text":"cencer 依情境可能是 Sensor；「折到」可能是「偵測到」。沒有足夠前後文時，保留待確認，不把近音詞確定成另一種工程術語。"}],"questions":["感測器放在哪裡，如何確認漏液能被偵測？","偵測後的告警與保護邏輯如何驗證？"],"related":["e14-role","ramp","reliability"],"addedAt":"2026-11-20","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"感測與控制"},{"id":"power-loss-interview","units":["E14"],"cat":"技術概念","title":"功率級損失：導通、切換與反向恢復","en":"Power Stage Losses","summary":"功率元件並非理想開關；電流通過與切換時都會產生損失。","tags":["Power Stage","導通損失","切換損失","反向恢復"],"body":[{"title":"功率級在做什麼","text":"Power Stage 是處理主要能量轉換的電路區塊，例如驅動器中的功率開關與相關電路。控制板產生控制訊號，功率級則依電路架構實際控制能量；兩者需要配合，但不是同一項設計工作。"},{"title":"導通損失","text":"元件導通時仍有電阻或壓降，會把一部分能量轉成熱。MOSFET 的導通損失與電流及導通電阻有關，不能只看額定功率，也要看實際操作條件。"},{"title":"切換損失與反向恢復","text":"開關切換時電壓與電流會在短時間內重疊。矽 MOSFET 體二極體等元件在導通後關斷，還可能出現反向恢復電流，增加損失與應力。器件與電路不同，損失機制也可能不同。"},{"title":"為什麼散熱與效率要一起看","text":"損失最終成為熱負擔。元件選型需要同時考慮效率、溫升、切換條件與可靠度，而不是單獨挑最小導通電阻。這份概念說明補充參照 TI 官方應用文件。"},{"title":"這段知識來自哪裡","text":"E14 面談中，主管從功率平台、控制板責任追問到損失與設計餘裕。這篇把技術解釋單獨抽出；職缺要求與供應商審查另放在 E14 的 EE 職缺詳解。"},{"title":"計算必須帶操作條件","text":"MOSFET 導通損失近似 I_RMS²×RDS(on)，需使用合適接面溫度下的阻值與實際導通波形。IGBT 常用 VCE(sat) 與電流積分估算；不能把同一近似式直接套到兩種元件。"},{"title":"切換、二極體與熱模型","text":"切換損失可從每次開關能量 Eon／Eoff 與頻率估算，但須核對電壓、電流、驅動與溫度條件。還有二極體導通、反向恢復、死區及其他損失。熱設計需將總損失連到接面到殼、介面與散熱路徑；短時過載應看暫態熱阻，而非只看穩態熱阻。"},{"title":"MOSFET、IGBT 與 SiC 的選型","text":"MOSFET 常以導通電阻與高速切換特性比較，IGBT 常以飽和壓降與切換能量比較；但高壓 SiC MOSFET 也可用於大功率。應一起比較耐壓、電流、頻率、效率、熱、驅動、EMI、成本與供應，不用「高壓一定 IGBT」做固定規則。"},{"title":"主管追問的深度","text":"不是只列出兩種損失名稱，而是選一顆元件，指出 Datasheet 曲線、工作點、算式、散熱假設、預估接面溫度，最後用波形、效率與溫升測試對照。"},{"title":"五、MOSFET、IGBT、SiC 到底差在哪？","text":"MOSFET\n\n金氧半場效電晶體\n\n\n\nIGBT\n\n絕緣閘雙極電晶體\n\n兩者都可以作為功率開關，但適用條件不同\n\n| 比較 | MOSFET | IGBT |\n|--------|--------|--------|\n| 常見優勢 | 高速切換、低電壓下可有較低導通損耗 | 適合部分高電壓、大功率應用 |\n| 導通損失 | 與 R_DS(on) 有關 | 與 V_CE(sat) 有關 |\n| 切換特性 | 通常可達較高頻率 | 一般切換速度較慢 |\n| 常見應用 | 電動機車、DC/DC、電源 | 工業變頻器、大型驅動器 |\n| 選型條件 | 電壓、電流、頻率、效率、成本 | 同樣要考慮電壓、電流、頻率及散熱 |\n\n這不是絕對分法，高壓 SiC MOSFET 也已廣泛應用於高功率設備，不能認為高壓一定使用 IGBT"},{"title":"Power Loss（功率損耗）","text":"主管問的 Power Loss，就是要知道功率元件運作時會損失多少能量，這些能量通常有相當一部分轉成熱\n\n導通損失 Conduction Loss\n\n以 MOSFET 為例，常用近似關係\n\n\nP_cond≈ I_RMS² R_DS(on)\n\n\n代表電流越大、導通電阻越高，發熱可能越明顯\n\n切換損失 Switching Loss\n\n當元件從開啟變成關閉，或從關閉變成開啟時，電壓與電流可能短暫重疊，造成能量損耗\n\nIGBT 常使用的估算概念\n\n\nP_sw≈ (E_on+E_off)f_sw\n\n\n其中 E_on 與 E_off 是每次開關的能量損失，f_sw 是切換頻率\n\nReverse Recovery（反向恢復）\n\n錄音還有提到二極體的反向恢復損失\n\n二極體由導通切換為反向截止時，可能短暫出現反向電流，造成額外損耗與電氣應力\n\n因此功率設計不能只看 MOSFET 或 IGBT，還要一起考慮續流二極體、切換條件及散熱能力"}],"questions":["實際操作條件如何影響導通與切換損失？","如何用量測確認損失估算與溫升判斷？"],"related":["e14-role","supplier-review","regeneration"],"addedAt":"2026-11-20","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"電力電子","changeKind":"update"},{"id":"sensing-parallel","units":["E14"],"cat":"技術概念","title":"電流感測、並聯均流與訊號干擾","en":"Current Sensing, Sharing & EMC","summary":"不同感測方案與功率元件配置，都要回到應用條件與量測。","tags":["Hall","Shunt","MOSFET","均流","EMC"],"body":[{"title":"電流感測在量什麼","text":"控制與保護需要知道實際電流。轉錄提到 Shunt 與磁感測等不同方案；選型要問量測範圍、隔離、精度、頻寬、延遲、損失、漂移及成本。沒有一種方法適合全部應用。"},{"title":"精度與響應是不同問題","text":"精度是在指定條件下量到的值與參考值有多接近；響應則與訊號跟上變化的速度有關。校準靜態讀值與觀察動態波形，回答的是不同問題。"},{"title":"並聯不代表電流自動平均","text":"功率 MOSFET 並聯時，元件導通電阻差異與配線阻抗會影響分流；動態切換也要留意驅動與寄生效應。TI 文件討論獨立閘極電阻、對稱配置及均流等設計考量，實際值仍須依電路與量測確認。"},{"title":"訊號干擾怎麼理解","text":"感測訊號與功率切換可能互相干擾。需要先界定異常頻段、耦合路徑與量測方法，再評估走線、接地、濾波或元件調整，不能只因加了濾波元件就認定問題解決。"},{"title":"與職缺內容分開","text":"以上是從 E14 錄音文字轉錄抽出的技術主題。用人條件、設計責任與面試觀察保留在 EE 職缺；本篇專門解釋技術名詞與判斷邏輯。"},{"title":"感測器方案完整比較","text":"Shunt：量電阻壓降，需考慮 I²R 發熱、共模與隔離。Hall：量磁場，可提供隔離方案，但要看 Offset、溫漂、頻寬與外部磁場。MR：磁阻式方案，仍依實際元件特性。CT 不能直接量穩態 DC；Rogowski 量電流變化，需合適訊號處理。不能只用量程或原理名稱判斷精度。"},{"title":"量程、精度與反應時間分開","text":"固定輸出範圍與 ADC 位元數時，選過大的量程可能浪費解析度，但量程小不等於精度高。需看線性、偏移、雜訊、溫漂、頻寬、傳播延遲、採樣與控制週期。控制回授與快速保護可能有不同速度需求。"},{"title":"並聯元件不是自然均分","text":"靜態看 RDS(on)、溫度與導體電阻；動態看 Gate Driver、RG、QG、Source／Gate 回路、寄生電感與切換時序。三顆並聯不保證每顆永遠承擔三分之一；要在正常與極端條件下量個別電流、波形與溫升。"},{"title":"干擾處理要有頻率與波形","text":"Hall 訊號可能受馬達與長線束影響。磁珠與電容需依阻抗頻率特性、直流偏壓、訊號需求與回流路徑選用；盲目增加濾波會改變延遲或訊號品質。比較改善前後波形、誤動作與 EMC 結果才有證據。"},{"title":"為什麼並聯 MOSFET 要注意均流？","text":"假設一組功率級要承受 300 A 電流，設計上讓三顆 MOSFET 並聯\n\n理想上，每顆分配 100 A\n\n但實際上，元件的內阻、Gate Driver、PCB 走線、寄生電感及溫度都可能不同\n\n結果可能是其中一顆承受較大電流而過熱\n\n這就叫 Current Sharing（均流）問題\n\n設計時要兼顧靜態均流與切換瞬間的動態均流，Gate Resistor（RG）與 PCB Layout 都很重要"},{"title":"六、Current Sensor 電流感測器完整知識","text":"電流感測器的用途是測量「有多少電流正在通過」\n\n在馬達控制器內，它可以協助控制扭力、監測負載、限制電流及執行過電流保護"},{"title":"常見電流感測方式","text":"| 技術 | 原理 | 優點與限制 |\n|--------|--------|--------|\n| Shunt Resistor | 量測電阻兩端電壓 | 精度可高、成本可低，但有電阻損耗 |\n| Hall Effect | 測量電流產生的磁場 | 可做隔離式量測，需考慮偏移及溫漂 |\n| MR Sensor | 利用磁阻效應感測磁場 | 靈敏度可高，取決於設計與元件 |\n| Current Transformer | 電磁感應 | 適合交流及變動電流，不能直接量測穩態 DC |\n| Rogowski Coil | 感測電流變化產生的訊號 | 適用動態或交流電流量測 |\n\n不同技術需要在精度、頻寬、隔離、功耗、成本及工作環境間取捨"},{"title":"Shunt Resistor 是怎麼量電流？","text":"它利用歐姆定律\n\n\nI=(V)/(R)\n\n\n只要知道電阻大小，以及電阻兩端的電壓差，就可以算出電流\n\n但電阻會發熱，損耗與電流平方有關\n\n\nP=I²R\n\n\n因此大電流應用必須特別注意電阻的功率額定值、溫升與量測電路設計"},{"title":"為什麼要改用 Hall Current Sensor？","text":"Hall 電流感測器可以利用電流周圍的磁場進行量測，有些設計能讓高電流導體與低電壓訊號端彼此電氣隔離\n\n好處是適合某些高電流或高隔離需求的應用\n\n但它仍需要考慮磁芯飽和、Offset、溫度漂移、外部磁場干擾及頻寬"},{"title":"為什麼感測器不能隨便選最大量程？","text":"假設設備需要量測約 300 A，卻選擇 1,000 A 的感測器\n\n這不一定錯，但如果輸出範圍固定、ADC 解析度也固定，就可能無法充分利用可用的量測範圍\n\n選擇更適合的量程，有機會提高實際可用的解析度\n\n不過 量程較小不等於精度一定較高，還是要看 Datasheet 的精度、雜訊、線性度及溫漂"},{"title":"為什麼還要看 Response Time？","text":"因為電流感測器不只要量得準，還要量得夠快\n\n假設馬達電流突然暴增，但感測器回報太慢，控制器可能來不及限制輸出\n\n這就牽涉到\n\n- Bandwidth：頻寬\n- Response Time：響應時間\n- Propagation Delay：傳播延遲\n- ADC Sampling：類比數位轉換採樣\n- Control Loop：控制迴路更新速度\n\n這些會直接影響馬達控制的動態反應與保護能力"}],"questions":["哪些因素會影響電流感測的精度與響應？","為什麼功率元件並聯仍需檢查均流？"],"related":["power-loss-interview","evidence","reliability"],"addedAt":"2026-11-20","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"電力電子","changeKind":"update"},{"id":"dry-cooler","units":["跨領域"],"cat":"技術原理","title":"Dry Cooler、Chiller、Cooling Tower：三種設備怎麼分？","en":"Heat rejection equipment","summary":"從換熱方式、環境條件與系統位置分清乾冷器、冰水主機、冷卻塔及 CDU。","tags":["液冷系統","Dry Cooler、Chiller、Cooling Tower"],"body":[{"title":"Dry Cooler 乾式冷卻器","text":"讓冷卻液流過換熱盤管，由風扇帶動室外空氣排熱。純乾式主要靠顯熱交換，受環境乾球與換熱溫差限制；不是因名字有 Cooler 就具有壓縮式冷凍能力。加裝噴霧或蒸發預冷的混合形式，須另外確認架構。"},{"title":"Chiller 冰水主機","text":"以冷凍循環製造冷卻水。蒸發器吸收被冷卻水的熱，壓縮機驅動冷媒，冷凝器再排熱。氣冷式冷凝器排到空氣，水冷式常連到冷卻水與冷卻塔；不能只說 Chiller 一定看乾球或一定看濕球。"},{"title":"Cooling Tower 冷卻塔","text":"主要藉水與空氣接觸、部分水蒸發排熱，因此性能與環境濕球密切相關，也需要補水、水處理及維護。不是所有屋頂的大型散熱設備都是冷卻塔或 Dry Cooler，需看管路、盤管、風扇與是否有蒸發水系統。"},{"title":"與 CDU 如何銜接","text":"CDU 管理伺服器冷卻液與熱交換，不等於 Chiller。設施可依水溫需求、氣候與負載選 Dry Cooler、Chiller 或其他排熱架構。判斷時先畫熱量從哪到哪，再確認設備邊界與額定條件。"},{"title":"回到 Supply Chain 的產業背景","text":"設備業務或 HVAC 背景的價值，在於理解產品規格、泵閥／換熱器供應、設備報價與工程交付。維修、施工、業務與採購仍有不同責任，不能用同一個冷凍空調標籤取代確認。"}],"questions":["如何辨識屋頂設備到底是哪一種？","冷卻水需求低於環境乾球時，純乾式方案有哪些限制？"],"related":["drybulb","wetbulb","scpm","primary-secondary"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"液冷系統"},{"id":"motor-drive","units":["跨領域"],"cat":"技術原理","title":"VFD、Servo、DC Bus 與 Power Stage 完整架構","en":"Motor drive architecture","summary":"從供電、DC Bus、功率板到控制板，完整比較變頻器、伺服驅動器與馬達。","tags":["電力電子","VFD、Servo、DC Bus 與 Power Stage 完整架構"],"body":[{"title":"一、先理解整套電力與馬達系統","text":"你可以把電動機車、工業伺服驅動器、CDU 的 Pump 控制，看成使用部分相同技術的不同產品\n\n電力如何讓馬達轉動\n\n電力來源\n\n工業交流電 AC ／ 電動機車電池 DC\n\n電力轉換與 DC Bus\n\n整流、直流母線、電容、必要的電源轉換\n\nPower Stage 功率級\n\nMOSFET／IGBT＋Gate Driver，產生控制馬達的電力\n\nMotor 馬達\n\n把電能轉成旋轉動力\n\nSensor＋Controller 控制與回授\n\n偵測電流、溫度、轉速、位置，修正輸出及執行保護\n\n簡化架構，實際系統還包含保險絲、接觸器、濾波器、保護電路及通訊等模組\n\n最重要的是理解下面五個角色\n\n| 元件 | 用白話理解 |\n|--------|--------|\n| 電源 | 提供能量 |\n| 驅動器 | 決定如何將能量送給馬達 |\n| 馬達 | 真正產生旋轉動力 |\n| 感測器 | 告訴系統目前運作狀態 |\n| 控制器 | 根據目標與感測結果，決定下一步怎麼控制 |\n\n例如電動機車轉動油門後，不是電池直接決定車速，而是控制器依照油門需求及安全條件，控制驅動器輸出，讓馬達產生扭力"},{"title":"二、變頻器、伺服驅動器、馬達有什麼不同？","text":"這是理解台達 ASDA-H3 專案最重要的基礎"},{"title":"1. VFD／Inverter 變頻器","text":"VFD 全名是 Variable Frequency Drive\n\n它可以調整交流馬達的供電頻率、電壓與電流，進而控制馬達速度和扭力\n\n例如工廠的抽水馬達\n\n- 不需要大量出水時，讓馬達轉慢一些\n- 需要大量出水時，提高轉速\n- 可以減少不必要的耗電\n\n變頻器的核心是馬達速度與扭力控制，並非所有變頻器都只能做簡單控制，有些高階變頻器也能使用編碼器回授及進階控制演算法"},{"title":"2. Servo Drive 伺服驅動器","text":"伺服驅動器不只是讓馬達轉動，通常更重視精準的位置、速度及扭力控制\n\n例如機械手臂要將零件精準移到指定位置，就需要知道現在轉到哪裡、距離目標還差多少，再不斷修正\n\n| 比較 | 變頻器 VFD | 伺服驅動器 Servo Drive |\n|--------|--------|--------|\n| 主要目的 | 速度與扭力調整 | 精密運動控制 |\n| 位置控制 | 視機種而定 | 重要功能 |\n| 回授裝置 | 可有可無，依系統而定 | 通常使用編碼器等回授 |\n| 動態反應 | 視應用而定 | 通常要求更高 |\n| 常見應用 | Pump、Fan、輸送機 | 機械手臂、精密加工、自動化設備 |\n\n伺服與變頻器的功率電子架構可能相似，但控制演算法、回授、運動控制與安全要求可能不同"},{"title":"3. Encoder 編碼器","text":"編碼器是一種回授裝置，可以量測馬達軸的角度、位置或轉速\n\n好比你閉著眼睛轉旋鈕，不知道自己轉了多少；編碼器就像一個感測器，不斷告訴控制器目前已經轉到哪裡\n\n控制器就能比較\n\n目標位置 − 實際位置 = 位置誤差\n\n再根據誤差調整馬達輸出"},{"title":"三、台達 ASDA-H3 是什麼？","text":"這是台達針對大型工業機械推出的高功率、多軸交流伺服系統\n\n官方列出的應用包括射出成型機、彎管機、多線切割機、造紙與印刷相關設備，產品支援位置、速度及扭力控制\n\n官方型錄也說明了模組化設計、單軸與雙軸驅動、共直流母線及安全轉矩關閉（STO）等功能"},{"title":"ASDA-H3 的主要模組","text":"| 名稱 | 用途 |\n|--------|--------|\n| Power Module | 電源模組，提供系統所需的直流電力 |\n| Drive Module | 驅動模組，控制馬達 |\n| DC Bus | 直流母線，提供各驅動模組共用的直流電力 |\n| Encoder Feedback | 回報馬達位置與速度 |\n| Control System | 執行運動控制、保護與通訊 |\n\n官方型錄的例子，輸入為三相 380～480 V AC，直流母線為約 537～679 V DC，並列出不同額定功率的驅動模組，包括 70 kW 和 85 kW 等級，並非只有單一 75 kW 規格"},{"title":"為什麼錄音提到從 15 kW 到 75 kW？","text":"匿名案例描述的概念是\n\n原本伺服驅動產品的容量無法滿足新設備需求，而公司已有高功率變頻器平台\n\n因此重新設計控制部分，利用符合功率需求的既有 Power Stage，將變頻器平台發展成大功率伺服驅動應用\n\n這不等於把原本 15 kW 的電路板直接改成 75 kW\n\n15 kW 與 75 kW 的差異主要涉及：\n\n- 能承受的電流與功率\n- 功率半導體選型\n- DC Bus 電容容量\n- 散熱能力\n- 電路板及銅排電流承載能力\n- 電氣保護與絕緣設計\n- 控制器及回授能力"},{"title":"瞬間過載 150%～200% 是什麼？","text":"馬達啟動、加速或承受突然變化的負載時，可能需要在短時間內提供高於額定條件的扭力與電流\n\n例如機器平常運轉正常，但突然需要推動很重的負載，驅動器就可能需要短時間輸出更大的電流\n\n重點：額定功率、峰值功率與可承受的過載時間，是不同的規格\n\n不能只把額定功率直接乘以 200%，就當作任何產品都一定能連續輸出那個功率"},{"title":"四、Power Stage 是什麼？為什麼主管一直追問？","text":"Power Stage（功率級）就是負責實際處理大電流、大功率的電路部分\n\n你可以把它想成馬達驅動器的「動力輸出核心」\n\n一個典型三相馬達驅動器的主要組成"},{"title":"1. DC Bus（直流母線）","text":"工業設備常使用三相交流電，經過整流及濾波後，形成直流母線\n\nDC Bus 可以理解成一條提供直流電能的主要通道\n\n其中的 DC-Link Capacitor（直流母線電容） 可以協助穩定電壓、吸收電流脈動及應對短時間能量變化\n\n不過大型電容也可能在斷電後保留危險電壓，必須依設備規範進行放電與安全確認"},{"title":"2. Gate Driver（閘極驅動器）","text":"MOSFET 與 IGBT 都是可控制的功率半導體開關\n\nGate Driver 負責依控制器命令，快速、可靠地控制這些元件開啟或關閉\n\n它不只是提供一個開關訊號，還可能涉及驅動電流、電氣隔離、欠壓保護及短路保護"},{"title":"3. Power Board 與 Control Board","text":"| Power Board 功率板 | Control Board 控制板 |\n|--------|--------|\n| 處理高功率電力轉換 | 處理控制運算與訊號 |\n| IGBT、MOSFET、電容等 | MCU、DSP、通訊與控制介面 |\n| 重視耐壓、電流及散熱 | 重視演算法、訊號精度及控制反應 |\n| 損壞可能造成大電流故障 | 控制錯誤可能導致功率級異常 |\n\n錄音中提到的「將變頻器改為伺服驅動器」，主要就在討論這兩個部分如何搭配"}],"questions":["控制板與功率板分別負責什麼？","共直流母線與回送電網差在哪？"],"related":["e14-role","power-loss-interview","regeneration"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"電力電子"},{"id":"motor-tcs","units":["跨領域"],"cat":"技術原理","title":"輪速、Hall／MR、TCS 與 ABS：量什麼、怎麼控制？","en":"Wheel sensing and traction control","summary":"分清輪速與電流感測，理解循跡防滑如何判斷、降扭，以及和 ABS 的差異。","tags":["感測與控制","輪速、Hall／MR、TCS 與 ABS"],"body":[{"title":"七、MR Sensor、Hall Sensor 與 TCS 防滑系統","text":"這是案例中的電動機車案例非常重要的一段"},{"title":"先區分兩種完全不同的感測任務","text":"輪速感測器：測量輪子轉得多快\n\n電流感測器：測量馬達或電路通過多少電流\n\n兩者都可能使用 Hall 或磁阻式技術，但測量的物理量與系統用途不同\n\n磁性編碼器可以透過 Hall 或 MR 等感測原理，偵測旋轉磁場，得到位置或速度資訊"},{"title":"TCS（Traction Control System）","text":"TCS 是循跡防滑系統，主要目的是降低驅動輪過度空轉造成的抓地力損失\n\nGogoro 官方也說明，當後輪空轉時，TCS 可介入調整動力"},{"title":"完整工作流程","text":"前輪與後輪輪速感測\n\n控制器計算車輪速度與滑差\n\n是否判斷為驅動輪打滑？\n\n否\n\n維持正常控制\n\n是\n\n調整馬達扭力輸出\n\n持續監控輪速、重新調整控制\n\n真正量產的 TCS 不會只是單純「後輪比前輪快就立刻減半輸出」\n\n還要考慮輪胎半徑、轉彎、加速度、車速、路面狀況及感測誤差等條件"},{"title":"Slope／Ramp 斜率控制","text":"錄音中的 1,000 → 500 → 250，是在說明逐步降低輸出的概念\n\n工程上常使用 Ramp（漸變控制），避免命令突然改變造成車輛不穩定或系統衝擊"},{"title":"TCS 和 ABS 有何不同？","text":"| TCS | ABS |\n|--------|--------|\n| 循跡防滑 | 防鎖死煞車 |\n| 主要處理驅動時的打滑 | 主要處理煞車時車輪鎖死 |\n| 可降低馬達輸出扭力 | 調節煞車力 |\n| 重點在驅動抓地力 | 重點在維持煞車時的車輪轉動與可控性 |"}],"questions":["輪速感測與電流感測的物理量有何不同？","降扭何時只是少供能，何時才是回生？"],"related":["ramp","regeneration","sensing-parallel"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"感測與控制"},{"id":"hall-pcb","units":["跨領域"],"cat":"技術原理","title":"Hall PCB 改善：逆向分析、限流、軟啟動與濾波","en":"Hall PCB and reverse engineering","summary":"還原 Hall PCB 逆向分析與改善的技術脈絡：元件規格、限流、軟啟動、濾波及驗證。","tags":["感測與控制","Hall PCB 改善"],"body":[{"title":"九、Hall PCB、逆向工程與電路改善","text":"錄音提到輪轂馬達內的 Hall PCB\n\n這是一片裝有 Hall IC 等元件的小型電路板，用來偵測磁場變化，提供馬達轉子位置相關訊號"},{"title":"逆向工程 Reverse Engineering","text":"意思是取得現有產品後，分析它的電路、元件、訊號、功能與設計方式，了解為何這樣設計，以及是否有改善空間\n\n它不只是拆開看看，而可能包含\n\n- 分析 PCB 線路與元件配置\n- 查閱 IC Datasheet\n- 確認工作電壓與電流\n- 測試啟動與切換波形\n- 檢查可能的失效風險"},{"title":"錄音提到的改善元件","text":"| 元件／技術 | 功能 |\n|--------|--------|\n| Current-Limiting Resistor | 限制特定路徑電流 |\n| RC Circuit | 電阻加電容形成時間常數或濾波功能 |\n| Soft Start | 避免啟動過程過於突然 |\n| Output Capacitor | 可能用於濾波、改善特定雜訊 |\n| ESD Protection | 靜電放電防護 |\n| Cable Signal Integrity | 長線束的訊號完整性 |\n\n例如 RC 電路的時間常數為\n\n\\[\n\\tau=RC\n\\]\n\n但 加入電容不代表一定能提升 ESD 防護，而且電容過大可能降低訊號速度、改變波形，甚至影響正常偵測\n\n是否有效需要根據電路及實測驗證"}],"questions":["如何證明限流／軟啟動解決原來問題？","加電容會不會改變響應或誤判？"],"related":["sensing-parallel","electrical-test"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"感測與控制"},{"id":"motor-foc","units":["跨領域"],"cat":"技術原理","title":"SPM、IPM、FOC、MTPA 與弱磁控制","en":"PMSM control concepts","summary":"從轉子磁鐵位置、d-q 軸到 FOC、MTPA 與弱磁，理解硬體與演算法的交界。","tags":["電力電子","SPM、IPM、FOC、MTPA 與弱磁控制"],"body":[{"title":"十、SPM、IPM、FOC 與馬達控制演算法","text":"這是錄音後半段較偏進階的馬達控制知識"},{"title":"SPM 與 IPM 是兩種馬達轉子設計","text":"SPM\n\nSurface Permanent Magnet，磁鐵放在轉子表面\n\n\n\nIPM\n\nInterior Permanent Magnet，磁鐵嵌在轉子內部\n\nIPM 馬達通常可以利用轉子 d 軸與 q 軸電感差異，產生額外的磁阻轉矩"},{"title":"FOC（Field-Oriented Control）磁場導向控制","text":"FOC 是常見的交流馬達控制方法\n\n它將三相電流透過數學轉換，建立方便控制的 d-q 軸座標\n\n可先簡單理解成\n\n- d 軸：主要與磁通控制有關\n- q 軸：主要與扭力控制有關\n\n控制器便能調整電流分量，達到需要的轉矩與運轉特性"},{"title":"MTPA 與 Field Weakening","text":"| 名稱 | 中文 | 用途 |\n|--------|--------|--------|\n| FOC | 磁場導向控制 | 精密控制馬達電流與扭力 |\n| MTPA | 最大扭力電流比控制 | 在特定條件下，以更有效率的電流分配產生所需扭力 |\n| Field Weakening | 弱磁控制 | 在電壓限制下擴展高速操作範圍 |\n| PWM | 脈寬調變 | 控制功率開關的切換時序 |\n| Id／Iq | d-q 軸電流 | 馬達控制中的兩個電流分量 |\n\n這些在工業伺服、電動車與高性能馬達驅動系統中都很重要"}],"questions":["硬體設計與控制演算法各由誰負責？","不同轉子結構如何影響控制策略？"],"related":["motor-drive","motor-tcs"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"電力電子"},{"id":"electrical-test","units":["跨領域"],"cat":"技術原理","title":"電氣測試：電流精度、Response、保護與 EMC","en":"Electrical validation","summary":"功能、精度、響應與保護測試怎麼分，連同示波器、ADC、EMI／EMC／ESD 一起看。","tags":["產品開發與驗證","電氣測試"],"body":[{"title":"十一、測試工程：電流精度、Response、Protection","text":"面談中提到的測試可以分成四大類\n\n| 測試類型 | 在確認什麼 |\n|--------|--------|\n| Function Test | 功能是否正常 |\n| Accuracy Test | 測量與控制是否準確 |\n| Response Test | 系統反應是否夠快 |\n| Protection Test | 異常時能否安全保護 |"},{"title":"示波器 Oscilloscope","text":"示波器可以把電壓訊號隨時間的變化顯示出來\n\n工程師可以觀察電流感測器的輸出波形、控制訊號的切換時間，以及有沒有異常尖峰或雜訊"},{"title":"ADC（Analog-to-Digital Converter）","text":"ADC 會把類比電壓訊號轉換成數位資料，提供 MCU 或 DSP 使用\n\n例如電流感測器輸出一個與電流成比例的電壓，控制器經過 ADC 轉換後，才能進行數位計算\n\n注意：ADC 讀值必須依電路比例與校正參數換算，不能直接當成安培數"},{"title":"常見保護項目","text":"- OCP：Over Current Protection，過電流保護\n- OVP：Over Voltage Protection，過電壓保護\n- UVP：Under Voltage Protection，欠電壓保護\n- OTP：Over Temperature Protection，過溫保護\n- Short-Circuit Protection：短路保護\n- Thermal Derating：熱降載，在過熱風險增加時限制輸出\n\n熱降載不是等到設備壞掉才停止，而是依溫度或相關條件降低功率，協助設備維持在允許的操作範圍"},{"title":"十二、EMI、EMC、ESD 與安規","text":"這四個名詞常一起出現，但意思不同\n\n| 名詞 | 中文 | 白話說明 |\n|--------|--------|--------|\n| EMI | 電磁干擾 | 設備發出的雜訊影響其他設備或訊號 |\n| EMC | 電磁相容性 | 設備能在電磁環境中正常運作，且不造成不符合要求的干擾 |\n| ESD | 靜電放電 | 靜電瞬間釋放，可能干擾或損壞電子元件 |\n| Safety Certification | 安規認證 | 確認產品符合適用的安全標準 |"},{"title":"Ferrite Bead 磁珠","text":"磁珠可在某些高頻範圍呈現較高阻抗，協助抑制高頻雜訊\n\n但要看它的阻抗頻率曲線、電流額定值及實際電路，不能認為所有磁珠都能消除任何干擾"},{"title":"電容濾波","text":"不同電容值、介電材料、封裝、ESR、ESL 都會影響高頻表現\n\n所以工程師通常要搭配實測與模擬，而不是只憑電容大小判斷"},{"title":"工業設備常見安全標準","text":"IEC 60204-1 涉及機械設備的電氣安全要求，IEC 61800-5-1 則是可調速電力驅動系統的電氣、熱及能量等安全要求 \n\n產品需要符合哪些標準，仍須依實際產品類型、用途與銷售市場決定"},{"title":"名詞與標準保留辨識限制","text":"相關討論的安規名稱與編號未由原音及產品認證文件重新確認。列出標準不等於該設備已取得認證；實際適用版本、範圍與測試需由原廠與實驗室文件核對。"}],"questions":["測試的參考量測與 ADC 如何同步？","磁珠依什麼頻率與波形選？"],"related":["reliability","sensing-parallel","supplier-review"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"產品開發與驗證"},{"id":"plc-integration","units":["跨領域"],"cat":"技術原理","title":"PLC、HMI、配電盤與 Connector：整機怎麼接起來？","en":"Electrical controls and integration","summary":"理解 PLC、HMI、設備配電盤與接頭在控制及電氣整合中的不同責任。","tags":["感測與控制","PLC、HMI、配電盤與 Connector"],"body":[{"title":"十三、PLC、HMI、配電盤、Connector","text":"這些是 E14 工作內容的另一大部分"},{"title":"PLC（Programmable Logic Controller）","text":"PLC 是工業自動化常用的可程式控制器\n\n它接收感測器、開關及設備狀態，依照程式邏輯控制馬達、泵浦、閥門及其他設備\n\n例如 CDU 可能需要這種控制流程\n\n1. 檢查液位、壓力及安全狀態\n2. 確認是否允許啟動 Pump\n3. 控制 Pump 運轉\n4. 根據流量或壓力調整輸出\n5. 發生故障時進行警報或保護\n\nPLC 常用 Ladder Logic（梯形圖）進行控制程式開發，也可使用其他 IEC 61131-3 類型的程式語言"},{"title":"HMI（Human Machine Interface）","text":"HMI 是人機介面，讓操作員查看設備狀態或輸入設定\n\n例如顯示流量、壓力、溫度、Pump 轉速，以及故障警報\n\nPLC 負責執行控制邏輯，HMI 主要負責操作與顯示"},{"title":"配電盤是什麼？","text":"配電盤是集中安裝配電、控制及保護元件的設備\n\n常見元件有斷路器、接觸器、電源供應器、端子台及控制裝置"},{"title":"Connector 選型要注意什麼？","text":"- 額定電壓及額定電流\n- 接點溫升\n- 防水、防塵等級\n- 絕緣間距及爬電距離\n- 線材截面積及耐溫能力\n- 插拔壽命與維修便利性\n\n錄音提到的 Clearance 是空氣間隙，Creepage Distance 是沿絕緣表面的爬電距離，兩者在高電壓設備的安全設計中都很重要"}],"questions":["PLC 控制與 Power Stage 設計的邊界在哪？","接頭除了電流額定，還要驗證哪些條件？"],"related":["e14-role","power-split","leak-sensing"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"感測與控制"},{"id":"cfd-analysis","units":["跨領域"],"cat":"技術原理","title":"CFD 熱流分析：穩態、暫態與模擬驗證流程","en":"Steady-state and transient CFD","summary":"穩態與暫態的假設、CFD 模型與邊界條件、後處理、實驗驗證及異常排查。","tags":["散熱技術","CFD 熱流分析"],"body":[{"title":"研究背景","text":"案例以渦輪葉片內冷卻研究說明熱傳增強，包含 CFD 與靜態／旋轉實驗。研究主題與能力範圍仍需以實際參與、模型及驗證確認。"},{"title":"1. 穩態分析（Steady-State Analysis）","text":"定義：\n\n假設系統已達穩定運轉狀態，固定位置的流速、壓力及溫度等物理量不再隨時間改變\n\n例如：\n- 冷卻液入口溫度固定為 25°C\n- 入口流速固定為 2 m/s\n- 系統達到穩定運轉後，觀察各位置的溫度、壓力與流速分布\n\n重點：\n- 穩態不代表所有位置溫度相同\n- 穩態不代表流體完全沒有渦流\n- 穩態分析主要研究穩定運轉條件下的流場及熱傳特性"},{"title":"2. 暫態分析（Transient Analysis）","text":"定義：\n\n研究流場、溫度及壓力等物理量隨時間的變化\n\n例如：\n- 冷卻系統剛開機時的升溫過程\n- 流量突然增加或降低\n- 加熱功率隨時間改變\n- 冷卻系統啟動與關閉過程\n\n穩態與暫態差異：\n\n| 比較項目 | 穩態 | 暫態 |\n|---|---|---|\n| 時間因素 | 不分析隨時間的變化 | 分析隨時間的變化 |\n| 溫度 | 固定位置溫度不隨時間變化 | 固定位置溫度可能隨時間變化 |\n| 流速 | 固定位置流速不隨時間變化 | 固定位置流速可能隨時間變化 |\n| 應用 | 穩定運轉散熱性能 | 啟動、關閉、負載變化 |"},{"title":"3. CFD（計算流體力學）","text":"CFD 是利用電腦數值方法，模擬流體的流動與熱傳現象\n\n主要分析：\n- Velocity：流速與流動方向\n- Temperature：溫度分布\n- Pressure：壓力分布\n- Pressure Drop：壓降\n- Heat Transfer：熱傳性能\n- Flow Structure：流場結構與渦流特性\n\n基本流程：\n\n建立 3D 流道模型 → 設定材料與流體性質 → 設定邊界條件 → 建立網格 → 執行 CFD 模擬 → 分析結果 → 實驗驗證"},{"title":"五、研究實際工作流程","text":"Step 1｜設計流道\n\n建立不同晶格狀、肋條狀或其他冷卻流道結構\n\nStep 2｜設定 CFD 邊界條件\n\n設定流體性質、入口速度或流量、入口溫度、加熱條件及出口壓力等\n\nStep 3｜選擇模擬類型\n\n依照研究目的，選擇穩態或暫態分析\n\nStep 4｜執行數值模擬\n\n計算速度場、壓力場及溫度場\n\nStep 5｜進行後處理分析\n\n計算協同角、熱傳性能、壓降等指標\n\nStep 6｜比較不同設計\n\n分析各流道的散熱改善效果與流動阻力\n\nStep 7｜實驗驗證\n\n透過實驗量測熱傳及壓降，驗證數值模擬的可靠性"},{"title":"模擬不等於彩圖","text":"需要幾何、材料與流體物性、入口／出口與熱邊界、網格獨立性、收斂、湍流或其他模型假設，再與測試比較。模擬與實測不一致時，應逐項查邊界、接觸、物性、數值與量測，而非只調參讓顏色相同。"},{"title":"七、Simulation｜模擬分析","text":"E13 RD 需要了解設計如何透過模擬預測散熱性能。\n\n| 模擬項目 | 英文 | 分析內容 |\n|--------|--------|--------|\n| 熱模擬 | Thermal Simulation | 晶片溫度、熱阻、熱傳路徑 |\n| 流體模擬 | CFD | 氣流分布、風量、壓降 |\n| 結構分析 | Structural FEA | 機構變形、應力 |\n| 接觸分析 | Contact Analysis | 散熱器與晶片接觸壓力 |\n| 公差分析 | Tolerance Analysis | 零件公差對組裝及壓緊力的影響 |\n\n常見工具包括 Ansys Icepak、Flotherm、Ansys Mechanical 等，但是否為 E13 實際指定軟體，尚未確認。\n\n主管關注的不是只有會不會操作模擬軟體，而是能否設定合理條件、判讀數據，並將模擬結果轉化為設計決策。"},{"title":"八、與 CFD、熱傳模擬的關係","text":"上述技術可透過 CFD 或其他適用的數值方法進行分析\n\nCold Plate 常見研究項目：\n- Velocity Field（速度場）\n- Temperature Field（溫度場）\n- Pressure Drop（壓降）\n- Heat Transfer Coefficient（熱傳係數）\n- Thermal Resistance（熱阻）\n- Flow Distribution（流量分配）\n\nVC／Heat Pipe 常見研究項目：\n- 氣液兩相熱傳\n- 蒸發與冷凝\n- 毛細回流\n- 內部壓力分布\n- 毛細極限\n- 有效熱傳性能\n\n注意：\n\n一般單相液冷 Cold Plate CFD 與 VC／Heat Pipe 兩相熱傳模擬不是完全相同的分析問題，不能直接視為同一套模型"}],"questions":["為何選穩態而非暫態？","如何證明結果不受網格大小主導？","模擬與實測不一致時從哪裡查？"],"related":["synergy-angle","thermal-fa","tree-channel"],"addedAt":"2026-11-22","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"散熱技術","changeKind":"update"},{"id":"synergy-angle","units":["跨領域"],"cat":"技術原理","title":"協同角、壓降與流道比較：為何角度小還不夠？","en":"Field synergy and pressure drop","summary":"從速度與溫度梯度向量理解協同角，保留原研究比較脈絡並一起評估壓降與泵功率。","tags":["散熱技術","協同角、壓降與流道比較"],"body":[{"title":"向量定義","text":"協同角是局部速度向量 V 與溫度梯度 ∇T 的夾角，不是流道幾何角度。cosθ=(V·∇T)/(|V||∇T|)，當任一向量為零時不能直接用該式定義。"},{"title":"5. 壓降（Pressure Drop）","text":"定義：\n\n流體通過流道時，入口與出口之間的壓力差\n\n通常表示為：\n\nΔP = P_in − P_out\n\n影響因素：\n- 流速\n- 流道長度及截面形狀\n- 流道彎曲與障礙物\n- 流體黏滯性\n- 流動阻力與渦流\n\n工程意義：\n\n某種流道設計可能提升散熱，但同時增加壓降，使泵浦需要消耗更多能量\n\n因此，流道優化必須兼顧散熱性能與流動阻力"},{"title":"三、為什麼入口流速方向固定，還會出現不同協同角？","text":"入口流動方向固定，並不代表整個流道內所有位置的速度方向都固定\n\n當流體遇到不同流道結構時，可能產生：\n- 局部轉向\n- 二次流\n- 渦流\n- 流體混合\n- 局部速度分布變化\n\n不同流道也會形成不同溫度梯度\n\n因此，即使入口條件完全相同，不同流道的協同角仍可能不同"},{"title":"五種流道的比較與判讀限制","text":"案例比較 SR、ZR、WR、OCP、ODP 五種結構，完整縮寫未確認，不自行展開。讀圖紀錄為 Re 約 10,000～30,000、協同角約 87.5°～89.5°，ODP 的角度指標較低。這些是特定案例的約略值，尚未重新量讀曲線，也不能代表 ODP 在所有條件下最佳。"},{"title":"為何不能只看角度大小","text":"場協同解讀需保留溫度梯度方向、局部與平均方式、邊界條件及其他因子，不能用「越小一定越好」作通則。還要比較熱傳係數、Nu、最高溫、壓降、摩擦因子、泵功率與實驗。相同流量與相同泵功率可能得到不同設計排序。"},{"title":"與 E13／T34 的連結","text":"熱流研究可能提供 CFD、熱傳、流道與實驗比對能力，但不自動等同 Heat Sink／VC／Heat Pipe 的產品開發，亦不等同 CDU 整機、Pump 選型或控制整合。面試應問實際參與與移轉到產品還缺哪些驗證。"}],"questions":["入口方向相同為何局部協同角不同？","改善熱傳卻提高壓降時如何比較？","平均協同角的定義與加權方式是什麼？"],"related":["cfd-analysis","wick-microchannel","e13-role"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"散熱技術"},{"id":"thermal-metrics","units":["跨領域"],"cat":"技術原理","title":"散熱數據怎麼讀：熱阻、功率、流量與壓差","en":"Thermal performance metrics","summary":"用條件、單位與算例解讀熱阻、熱負載、流量及壓差，避免把不同測試直接相比。","tags":["散熱技術","散熱數據怎麼讀"],"body":[{"title":"先分功率、熱阻、風量與壓差","text":"W 是功率；°C/W 或 K/W 是指定路徑的熱阻；CFM 是體積風量；Pa 是壓力／壓差。功率大不等於散熱設計好，風量大不等於晶片接觸好，壓降低也不等於熱阻最低。每個量都需要邊界與量測位置。"},{"title":"匿名案例 A：高功率散熱目標","text":"| 項目 | 設計資料中的數字 | 必須確認的定義 |\n|---|---|---|\n| 熱負載相關值 | 2,500 W | 是額定、測試、局部或整組熱量 |\n| 熱阻相關值 | 0.016°C/W | 哪兩個溫度點之間、是否包含 TIM |\n| 風量條件 | 550 CFM | 通過散熱器還是整機、對應哪個工作點 |\n\n在這些定義與達標證據未確認前，這三項先視為設計／測試條件記錄，不寫成已通過的性能宣告。"},{"title":"熱阻算例：40°C 的溫升代表什麼","text":"若熱阻 Rθ=0.016°C/W 與 Q=2,500 W 確實屬於同一熱路徑及條件，ΔT=Q×Rθ=40°C。這是兩個已定義溫度點的差，不直接等於晶片絕對溫度。如果只是教學假設參考點為 30°C，另一端才會為 70°C；參考點不同，絕對溫度也不同。不能未確認 Rθ 定義就把此算例當作結溫。"},{"title":"高功率氣冷設計要同時考慮什麼","text":"底座／VC 能否把熱攤開，熱管能否搬運到鰭片，鰭片間距與厚度是否適合風量，系統高度與安裝方向、風道是否旁通或回流，風扇能否在實際阻力下提供所需風量。還要考慮材料、重量、機械載荷、成本與製造。只把金屬加大，可能先撞到空間或風阻限制。"},{"title":"匿名案例 B：熱性能與風阻一起看","text":"另一組資料為熱阻約 0.0249°C/W、風量約 110 CFM、壓差約 190 Pa。它與案例 A 的流量、結構、熱源與條件可能不同，因此不能看到 0.0249 大於 0.016 就判定產品較差。需先對齊目標、邊界、空間與量測定義。"},{"title":"CFM 與流動功率的教學計算","text":"1 CFM 約為 0.000472 m³/s，因此 110 CFM 約 0.0519 m³/s，550 CFM 約 0.260 m³/s。若案例 B 的 110 CFM 與 190 Pa 是同一工作點，理想空氣流動功率約 Qv×ΔP=0.0519×190≈9.9 W。這不是風扇電功率；還有風扇／馬達效率與其他損失，也不能把不同工作點的最大流量與最大壓力相乘。"},{"title":"鰭片加密為何可能反而更熱","text":"面積增加可改善換熱，但流道更窄可能增加系統阻力。在同一風扇下，實際風量可能下降；局部流量也可能不均。比較應看風扇與系統曲線交點、最高溫與均溫、噪音及功耗，並在一致邊界下實測，而不是單看鰭片數量。"},{"title":"Remote HSK 的配置原理","text":"Remote 指把散熱位置移離熱源上方，常見需求是晶片附近高度、主板布局或風道不適合放大鰭片。需要一段可行的熱傳輸路徑，再在其他位置與空氣換熱。可能的實作依產品不同，不能只憑名稱就確定用了哪種熱管、VC 或其他架構。"},{"title":"遠端散熱新增的驗證問題","text":"從接觸、熱傳輸、遠端接合到鰭片與空氣都形成熱阻；路徑長度、彎折、姿態、支撐與受力也可能改變性能。需要確認熱負載分配、安裝變形、運輸／振動、組裝與維護，而非只證明遠端鰭片摸起來有變熱。"},{"title":"如何安排公平的性能比較","text":"固定熱源尺寸與功率、TIM 與安裝力、進風溫度、風量／風扇與風道、感測器位置、穩態判定及樣品版本。若要比較相同風量、相同風扇或相同噪音三種情境，應分開列結論，因為它們不保證同一設計排名。"},{"title":"液體吸熱的關係","text":"在單相、穩態且熱損可合理處理的近似下，Q≈ṁcp(Tout−Tin)。要有質量流率、流體比熱與進出液溫，不能只看出液很熱就判斷散熱差；溫差也受流量影響。液體組成、溫度與量測誤差需列出。"}],"questions":["比較兩款散熱器前要先對齊哪些測試條件？","鰭片加密後為何最高溫可能反而升高？"],"related":["thermal-fa","cfd-analysis","air-liquid","e13-engineering-complete"],"addedAt":"2026-11-22","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"散熱技術","changeKind":"update"},{"id":"weld-inspection","units":["跨領域"],"cat":"技術原理","title":"雷射焊接前處理、EDM 白層與金相／漏測","en":"Weld preparation and inspection","summary":"把教育訓練的問題、材料表面機理、焊前處理、金相、壓測與漏測串成完整改善流程。","tags":["產品開發與驗證","雷射焊接前處理、EDM 白層與金相／漏測"],"body":[{"title":"Wire EDM 與再凝固白層","text":"線切割以放電移除材料，表面局部熔融後再凝固，可能形成與母材不同的 Recast Layer，常稱再凝固／重鑄白層。依材料與條件，可能伴隨裂紋、孔隙、殘留應力或電極／介質相關影響。白層是加工結果，不是另外貼上去的鍍層，處理方法與判定也不同。"},{"title":"白層為何與雷射焊接有關","text":"若直接在受影響表面焊接，既有缺陷與表層狀態可能參與熔融與凝固，使熔合、氣孔與裂紋風險難以控制。案例的管制方向是不直接使用保留白層的線切割接合面，而是先以適當機械加工等方式處理並檢驗；不能只用外觀看不見白色就當作已去除。"},{"title":"去除後要確認什麼","text":"需定義處理面、去除量如何決定、剩餘尺寸與表面、轉角與內孔能否處理、如何取樣確認受影響層。實際深度與方法要依材料及工藝驗證，不給所有 EDM 零件同一個通用切除量。若加工改變間隙與壁厚，也要回到圖面及焊接驗證。"},{"title":"CNC 後的清潔、乾燥與防再污染","text":"CNC 去鍍後可能留下切削液、油、金屬屑、毛邊與處理液。超音波清潔可成為核准程序的一部分，但清潔液、濃度、時間、溫度、零件相容、漂洗與乾燥需要整體規劃；清洗完成後的手套、包裝、放置時間與搬運也會影響再污染。清潔不是用來替代金屬層的實際去除。"},{"title":"XRF 能量測什麼","text":"X-ray Fluorescence 利用材料對 X 射線激發的特徵響應分析元素，適合配置的儀器與模型可估算 Ni-P 鍍層的厚度及磷成分。這使檢查不必只靠顏色或肉眼，也能比較加工前後的局部表層狀態。鍍層厚度、磷含量與是否殘留是不同判讀問題。"},{"title":"XRF 的限制與抽測位置","text":"量測點大小、位置、曲面／小水嘴幾何、基材、層狀模型、校正與檢出能力都可能影
