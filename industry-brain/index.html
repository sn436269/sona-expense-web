響結果。測一點未發現，不等於整圈完全沒有；基材本身含鎳時，也不能把量到鎳直接等同仍有 Ni-P 鍍層。需指定方法、參考樣、測點、允收與必要的截面／其他證據，不能用儀器名稱替代量測方案。"},{"title":"前處理檢查的完整順序","text":"辨識材質與表面 → 確認禁鍍／加工要求 → 去除指定鍍層或受影響層 → 去毛邊、清潔及乾燥 → 檢查尺寸與表面殘留 → 防污染保存 → 依核准條件裝配與焊接。若其中一步變更，需要判斷哪些後續證據必須重新建立。"},{"title":"金相截面怎麼看","text":"把指定位置切開，依適當的鑲埋、研磨、拋光與顯微檢查程序觀察接頭。製樣本身也可能造成拖曳、邊緣變形或其他假象，因此需有適當製樣品質與量測尺度。截面用來看內部熔合與缺陷，不是只拍一張好看的照片。"},{"title":"截面上要分開看的項目","text":"| 項目 | 工程意思 | 不能直接推論的事情 |\n|---|---|---|\n| Penetration 熔深 | 熔入指定材料的深度 | 深就一定密封或一定更強 |\n| Fusion 熔合 | 接合界面是否有效熔合 | 表面連成一線就內部全接合 |\n| Porosity 氣孔 | 內部空洞的形態、大小、位置與分布 | 每一個孔都已形成貫通漏道 |\n| Crack 裂紋 | 裂開位置、方向與延伸 | 一張截面沒看到就整圈沒有 |\n| Undercut／局部形貌 | 焊趾或邊緣的缺口與幾何 | 可不看受力與密封需求就接受 |\n| S1／S2 等標示 | 該圖面／報告定義的量測尺寸 | 所有公司都用同一幾何定義 |"},{"title":"熔深比例與尺寸案例","text":"案例條件曾要求熔深達板厚約 90% 以上，另有接合位置大於 0.5 mm 的尺寸要求。兩者可能指不同位置或不同量，不能合成所有焊縫的共同規範。若教學假設板厚 t=0.60 mm、該位置要求 90%，比例門檻才會是 0.54 mm；這個板厚只是算例，並非實際產品尺寸。"},{"title":"S1、S2 與不同切面如何記","text":"對照圖面定義量測起點、方向、界面與允收上下限，標清切片位置、試件、版次、比例尺與判定。同一圓周的不同切面可能不同，應按驗證計畫選位置，而不是只挑最好看的區域。若標示與圖面不一致，先釐清定義，不能用相似符號猜。"},{"title":"ISO 13919-1 的適用層次","text":"ISO 13919-1:2019 涉及鋼、鎳、鈦及其合金之電子束與雷射焊接接頭的缺欠品質等級。它有三個品質等級，B 對成品焊縫要求最高。這是製作品質等級，不直接等於產品用途適用性；不能用符合某個焊接等級，代替所有液冷件的密封、承壓與使用可靠度。具體缺欠限值與適用條件需核對所採條款。"},{"title":"金相、壓測、漏測與可靠度的比較","text":"| 驗證 | 主要回答 | 仍需別的證據補足 |\n|---|---|---|\n| 外觀／尺寸 | 可見缺陷與幾何是否符合 | 內部熔合、微小漏道 |\n| 金相截面 | 被切到位置的內部結構與缺陷 | 整圈／整件是否密封、使用壽命 |\n| 耐壓 | 指定壓力、時間與方式下的承壓及變形 | 更細微的漏率與長期疲勞 |\n| 漏測 | 該介質、方法、條件與靈敏度下的密封 | 所有未來溫壓循環都不漏 |\n| 可靠度後複測 | 指定環境／循環後是否劣化 | 未被測試條件代表的全部使用情境 |"},{"title":"漏測報告需要哪些條件","text":"介質、壓力／壓差、保壓或量測時間、溫度與穩定時間、方法、儀器校正、背景／治具影響、允收漏率或判定方式。壓降法結果可能受溫度、容積與穩定性影響；氦或其他方法也有各自的靈敏度與邊界。此處不提供可直接套產線的試驗壓力。"},{"title":"失效後如何形成閉環","text":"先區分外觀、尺寸、截面、密封與受力失效 → 保存試件及條件 → 提出材料、表面、裝配、焊接或試驗假設 → 用對照驗證 → 設計／製程改版 → 重做必要的性能與可靠度 → 更新標準與供應商要求。不能只有一句「補焊後 OK」。"},{"title":"TIG 與軌道焊是不同的分類角度","text":"TIG／GTAW 用非消耗性鎢極產生電弧，並以保護氣體隔離焊接區與周圍空氣；是否加填料與具體條件依工藝。軌道焊描述焊接頭繞管接頭移動的自動化方式，常可採 TIG，因此不是與 TIG 完全互斥的另一種熱源。不能只看設備名稱判定品質。"},{"title":"管路採購要確認的製程能力","text":"除了焊機，還需確認管材與端面、對心與間隙、清潔、固定、保護與內部氣體、焊接程序、操作者／自動程式控制、檢驗及追溯。工藝能力、產能與最後耐壓／漏測要分開驗證；會做漂亮焊道不表示整批產品都能符合密封與變形要求。"}],"questions":["如何證明缺陷來自鍍層或 EDM 層？","漏測通過但截面有缺陷時如何處理？"],"related":["dfm","reliability","project-status","e13-engineering-complete"],"addedAt":"2026-11-22","updatedAt":"2026-11-23","section":"industry","knowledgeTopic":"產品開發與驗證","changeKind":"update"},{"id":"coolant-quality","units":["跨領域"],"cat":"技術原理","title":"冷卻液品質：pH、導電度、ORP 與材料相容","en":"Coolant quality considerations","summary":"分清 pH、導電度與 ORP 的用途，連到材料相容、監測與維護，而非直接套用通用配方。","tags":["液冷系統","冷卻液品質"],"body":[{"title":"為什麼規格不只看流量溫度","text":"冷卻液要接觸泵、換熱器、冷板、軟管與密封材料。除了移熱能力，還需考慮腐蝕、沉積、微粒、材料相容、黏度與維護。原 TPM 對話列出 pH、ORP、導電度等監控詞，這不等於每台 CDU 都必須安裝全部感測器。"},{"title":"指標各在說什麼","text":"pH 描述酸鹼相關狀態；導電度反映液體導電能力，與離子等因素有關；ORP 是氧化還原電位。三者不能互相替代，也不能單憑一個數值就判定冷卻液適用或無腐蝕風險。"},{"title":"哪些數字不能憑空填","text":"允收範圍要依原廠冷卻液、材料、系統與保固文件。去離子水也不代表進系統後永遠保持原本狀態；添加劑、污染與材料反應都可能改變性質。本篇不提供未經確認的通用加藥或操作配方。"},{"title":"產品與面試如何追問","text":"需求是監測、告警、維護判定還是控制？採樣點、校正、漂移、反應時間與異常處理由誰定義？做出量測值之外，還需知道該值如何支持可驗證的工程判斷。"}],"questions":["為何選某項水質指標？與材料或故障風險如何對應？"],"related":["primary-secondary","kits","leak-sensing"],"addedAt":"2026-11-22","updatedAt":"2026-11-22","section":"industry","knowledgeTopic":"液冷系統"},{"id":"fulfillment","title":"Supply Chain 與 Fulfillment：從供需規劃到訂單交付","en":"Supply planning and order fulfillment","summary":"供應鏈規劃把需求、材料、供應、產能、生產與庫存接起來；Fulfillment 聚焦客戶訂單如何依承諾的數量、日期與地點完成交付。兩者持續互相回饋，不是接力後就不再聯繫。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"供應鏈術語","tags":["供應鏈術語"],"body":[{"title":"一條流程、不同責任","text":"供應鏈規劃把需求、材料、供應、產能、生產與庫存接起來；Fulfillment 聚焦客戶訂單如何依承諾的數量、日期與地點完成交付。兩者持續互相回饋，不是接力後就不再聯繫。"},{"title":"各自交付什麼","text":"| 項目 | 供應鏈規劃 | 訂單履行 |\n|---|---|---|\n| 輸入 | 預測、訂單、庫存、供應與產能 | 客戶訂單、要求日、可供量與物流 |\n| 產出 | 供應計畫、缺口、庫存與產能方案 | 承諾日、出貨／交付追蹤與異常處理 |\n| 常見問題 | 料與產能是否足夠 | 這張訂單何時、分幾批交到哪裡 |\n| 衡量 | 預測、庫存、供需與成本 | OTD、OTIF、訂單達交 |"},{"title":"Pull-in 與 Push-out","text":"Pull-in 是客戶希望提早，Push-out 是希望延後。提前可能擠壓其他客戶、增加運輸或加班；延後可能形成在製品、庫存與資金占用。需求異動要更新承諾、工廠排程、物料及物流，不能只改一個日期欄位。"},{"title":"匿名 CDU 情境","text":"假設客戶要一批 CDU 並希望提前兩週。Planner 確認 Pump、Valve、管路、產能與庫存；Fulfillment 確認可承諾數量、分批方案與到貨日，追到交付。若供應不可行，要在承諾前呈現選項及風險。此為教學情境，不是實際訂單。"},{"title":"OTD 與 OTIF 要先定義","text":"OTD 關心準時，OTIF 還加入完整數量；計算可能按訂單、訂單行或出貨批次，基準日可能是原始要求日或承諾日。若容許窗口、分批、取消與改期規則不同，百分比不能直接比較。"},{"title":"職能辨識","text":"Sales 可能負責客戶開發、商務與報價；PM 可能負責專案範圍與里程碑；Planner 與 Fulfillment 也可能在同一人手上。ODM 任職背景、與 ODM 合作、主導供應規劃與完整 Order Owner 是四個不同問題，需分開確認。"}],"questions":["請從 PO／訂單確認說到交貨結案，哪些由你負責？","客戶提早兩週，你如何重算供應與承諾？","OTIF 分母、日期與分批規則如何定義？","ODM 背景指任職、客戶合作還是實際供應鏈責任？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"glass-fabric","title":"玻纖布：Low CTE、Low Dk／Df 與載板用途怎麼分？","en":"Glass fabric for electronic substrates","summary":"玻璃纖維可先成紗，再織成布；搭配樹脂形成電子基材的一部分。玻纖布、樹脂、銅箔、覆銅板、印刷電路板與晶片載板是不同層級，不能把其中一家供應商的能力推成包辦整條鏈。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"材料與製程","tags":["材料與製程"],"body":[{"title":"先分材料與產品層級","text":"玻璃纖維可先成紗，再織成布；搭配樹脂形成電子基材的一部分。玻纖布、樹脂、銅箔、覆銅板、印刷電路板與晶片載板是不同層級，不能把其中一家供應商的能力推成包辦整條鏈。"},{"title":"CTE 與熱翹曲","text":"CTE 是熱膨脹係數，描述溫度變化下尺寸變化的程度。低 CTE 玻纖可協助控制複合材料膨脹與翹曲，但整體仍受樹脂、纖維方向、層疊、銅分布、厚度與製程影響。低 CTE 不等於高導熱，也不等於製品完全不會翹曲。"},{"title":"Dk、Df 與高速訊號","text":"Dk 是介電常數，Df 是介電損耗相關指標。高速／高頻基材會在意傳播、損耗與設計一致性；數值需帶測試頻率、方法、溫濕度及材料方向。低 Dk／Df 與低 CTE 是不同目標，不能看到高階玻纖布就把三者當同一性質。"},{"title":"材料系列的比較","text":"以特殊玻璃的常見產品定位理解：T-glass 著重高彈性模數及低熱膨脹，NE／NER 類著重低介電、低損耗等特性。名稱與配方依供應商而異，仍需逐型號檢查，不能將不同廠商的命名直接視為可互換。"},{"title":"公司題材與供應資格分開","text":"有玻纖業務不等於已量產某個高階布種，更不等於已獲特定平台認證。核對時分開看材料型號、量產、產能、客戶認證與營收；未確認的客戶關係、持股、股價與平台推測不當作材料知識。"}],"questions":["請分別說明 CTE、Dk、Df 解決什麼問題。","比較兩份規格表前要先對齊哪些測試條件？","有樣品、已認證及穩定量產，差在哪裡？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"crah-crac","title":"CRAH、CRAC 與 CDU：冷卻空氣還是冷卻液？","en":"Room cooling and liquid cooling","summary":"CRAH／CRAC 常處理機房空氣；CDU 則處理設備液冷迴路的熱交換、循環及控制。機房同時有空氣冷卻與晶片液冷並不矛盾，因為不同元件與區域可能走不同熱路徑。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"液冷系統","tags":["液冷系統"],"body":[{"title":"先看被冷卻的對象","text":"CRAH／CRAC 常處理機房空氣；CDU 則處理設備液冷迴路的熱交換、循環及控制。機房同時有空氣冷卻與晶片液冷並不矛盾，因為不同元件與區域可能走不同熱路徑。"},{"title":"CRAH 的典型架構","text":"Computer Room Air Handler 使用風扇讓空氣流經冷水盤管，熱交到冰水／設施水系統，再由後段排熱設備處理。要看送回風、盤管、水溫／水量、壓損、過濾、控制與結露條件，而非只看機組外觀。"},{"title":"CRAC 的典型架構","text":"Computer Room Air Conditioner 常指使用冷媒／直接膨脹系統處理空氣的精密空調。實際市場命名可能混用，因此仍以管路圖、冷媒／冷水介面及產品規格為準，不能從縮寫保證內部構造。"},{"title":"CRAH 不等於 CDU","text":"CRAH 將空氣熱量交給水；典型液對液 CDU 將伺服器側液體的熱交到設施側。具備空調設備選型、現場導入與承包商協調經驗，可能有系統介面價值，但仍須另外核對冷板、二次側、液冷水質、Pump 及漏液保護。"},{"title":"工程導入要問到交付","text":"設備容量如何依熱負載與冗餘決定？進出水與送回風條件由誰定義？材質、圖面、現場會勘、施工、控制介面與試運轉由誰負責？用這些交付物分清設備業務、專案管理、維運與設計責任。"}],"questions":["請畫出空氣與水的完整熱路。","哪些部件低於露點會結露？","如何證明空調專案能力可轉移到 CDU，又有哪些還未覆蓋？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"qd-leak-diagnosis","title":"QD 接頭與 Rack 漏液：從安裝、密封到故障定位","en":"Quick disconnect and rack leak diagnosis","summary":"Quick Disconnect 是方便連接與拆卸的流體接頭。尺寸、接合方式、密封材料、工作溫壓、流量與壓降、冷卻液相容及插拔壽命都可能不同；外觀能接上不代表規格相容，低滴漏設計也不是任何情況都絕對零漏。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"液冷系統","tags":["液冷系統"],"body":[{"title":"QD 是什麼","text":"Quick Disconnect 是方便連接與拆卸的流體接頭。尺寸、接合方式、密封材料、工作溫壓、流量與壓降、冷卻液相容及插拔壽命都可能不同；外觀能接上不代表規格相容，低滴漏設計也不是任何情況都絕對零漏。"},{"title":"先定位漏在哪一段","text":"區分軟管本體、端接、QD 接合面、螺紋、Manifold、冷板或 Pump。觀察液體可能沿線束或表面移動，濕的位置不一定是起漏點。保存狀態、時間、壓力、溫度與操作歷程，避免拆完後失去判讀線索。"},{"title":"安裝與零件風險分開","text":"檢查是否完全接合、配對正確、有側向拉力、彎曲半徑不足、密封損傷、異物、材料相容或壓溫超限。不可只因更換接頭後不漏，就直接判定根因是接頭本體；重裝同時也改變了安裝條件。"},{"title":"盛水盤與感測鏈一起驗證","text":"漏液是否被導到可偵測位置？Sensor 對該液體是否能可靠反應？訊號、配線、控制器、告警與保護動作是否正確？測試需按核准程序進行，不能用未知壓力或讓未保護電子設備暴露的方式試漏。"},{"title":"面試要還原排查與驗證","text":"先說現象與條件，再說如何分段、排除假設、找到原因、修復及複測。現場組裝／維修、量產製程與液冷系統設計是不同責任，應分別記錄。"}],"questions":["如何分辨接頭缺陷與安裝問題？","不拆管時有哪些觀察可協助定位？","修復後做了什麼複測，如何確認未移轉成其他問題？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"precision-module-reliability","title":"精密模組可靠度：VCM、振動、固化應力與 IMC 裂紋","en":"Precision module failure mechanisms","summary":"VCM 是利用線圈與磁場作用產生運動的致動器；Sensor-shift 語境涉及移動感測器，Folded Optics 則涉及折疊光路與模組配置。這些是精密機電／光學整合題材，不等同伺服器冷板或 CDU 經驗。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"材料與製程","tags":["材料與製程"],"body":[{"title":"產品、零件與失效機制分開","text":"VCM 是利用線圈與磁場作用產生運動的致動器；Sensor-shift 語境涉及移動感測器，Folded Optics 則涉及折疊光路與模組配置。這些是精密機電／光學整合題材，不等同伺服器冷板或 CDU 經驗。"},{"title":"振動失效不只是一個測試沒過","text":"可能涉及結構模態、固定、膠層、焊接介面、慣性載荷與測試治具。要記錄振動方向、頻率／能量、固定方式及失效位置，先定位機理，再比較設計與製程變更。單一測試通過不能保證其他方向與條件。"},{"title":"膠材固化應力","text":"固化收縮、熱膨脹不匹配及溫度歷程可能在受約束的組件中留下應力。更改時間／溫度不一定同時改善強度與尺寸穩定，需要看材料反應、塗膠量、幾何、表面與固定條件，並用試驗對照。"},{"title":"IMC 不是出現就代表失效","text":"金屬間化合物可能在焊接接合介面形成，適當接合反應與過度成長／脆性裂紋是不同問題。需檢查裂紋路徑、介面、厚度、熱歷程與受力，不能只看到 IMC 名稱就定根因。"},{"title":"雷射離焦與驗證","text":"改變離焦會影響能量分布與接合作用，能否改善裂紋取決於材料與工藝，不是通用修復法。需要焊接截面、強度、熱影響、功能及可靠度對照；沒有圖面與工藝條件時不給通用參數。"}],"questions":["先分設計、材料、工藝與治具，你會怎麼做？","通過率改善的樣本數、測試條件與分母是什麼？","雷射改參數後除了裂紋還需驗證什麼？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"cnc-sourcing","title":"CNC 與設備零件採購：從加工能力到供應商整合","en":"Machined parts and supplier consolidation","summary":"CNC 車銑加工件、閥件、管路、特殊氣體零件、化學品與封裝／測試委外不是相同商品。它們需要不同的規格、品質、追溯、供應與變更管理；不能因都屬科技業採購，就假定完全相同的審查方法。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"供應鏈術語","tags":["供應鏈術語"],"body":[{"title":"採購對象先分清","text":"CNC 車銑加工件、閥件、管路、特殊氣體零件、化學品與封裝／測試委外不是相同商品。它們需要不同的規格、品質、追溯、供應與變更管理；不能因都屬科技業採購，就假定完全相同的審查方法。"},{"title":"加工件報價要帶圖面條件","text":"材料牌號、毛坯、加工步驟、裝夾次數、尺寸與幾何公差、表面處理、檢驗、數量及交期都影響成本。相同設備可以加工不同材料，不表示切削、刀具、變形、清潔與合格率都相同。"},{"title":"供應商整合與第二來源","text":"集中可增加議價與管理效率，過度集中也增加停線或議價依賴。要按零件重要度、可替代性、地區與上游共同風險設計供應組合；不能只用供應商家數減少當作成功證明。"},{"title":"降本成果要可比","text":"區分議價降幅、設計變更、量增、原物料下跌、匯率與供應商整合；先定義基準價格、期間、數量、一次性支出與實現成本。不同年度或不同口徑的百分比不能重複加總。"},{"title":"設備與潔淨用途的額外限制","text":"管路與閥件若用於特殊氣體或其他受控流體，需依用途看材料、密封、潔淨、相容、檢漏與追溯，不能把一般機構件驗收單直接套用。具體允收與處理依核准規範。"}],"questions":["你如何由圖面判斷報價差在哪？","減少供應商後備援能力如何維持？","請把降本結果拆成價格、數量、規格與市場變動。"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"grr-measurement","title":"GRR 與量測可信度：先確認尺，再比較設計","en":"Gage repeatability and reproducibility","summary":"尺寸、力量或性能有差異時，可能是產品變異，也可能是儀器、操作者、治具與方法造成。若量測系統分不清差異，後面用數據決定設計、良率與供應商優劣都可能誤判。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"產品開發與驗證","tags":["產品開發與驗證"],"body":[{"title":"為何面試會先問量測","text":"尺寸、力量或性能有差異時，可能是產品變異，也可能是儀器、操作者、治具與方法造成。若量測系統分不清差異，後面用數據決定設計、良率與供應商優劣都可能誤判。"},{"title":"Repeatability 與 Reproducibility","text":"重複性看相同量測條件下的變動；再現性看操作者或指定條件改變後的變動。GRR 是量測系統分析的一部分，另有偏倚、線性與穩定性等問題；校正合格不代表所有實際量測情境都足夠可靠。"},{"title":"試驗怎麼設計","text":"選能代表實際變異的零件、操作者與量測範圍，安排多次量測，控制或隨機化順序，記錄重新裝夾與環境。樣品與次數依適用方法及目的決定，不把一組常見配置當成所有產品的硬性規則。"},{"title":"報表不能只看一個百分比","text":"確認分母是製程變異或公差、用的是標準差或變異數、是否包含交互作用，以及該量測用於篩選還是改善。沒有方法與接受準則，不直接套門檻判合格。"},{"title":"數據異常怎麼處理","text":"保留原始值、樣品編號、量測時間與方法，檢查分布、截尾、重複值、版本及可重現性。發現可疑數據要確認量測與記錄流程，不為了通過規格修改測值；對外說明須帶真實結果、限制與改善計畫。"}],"questions":["同一件由同一人量十次，能證明哪些、不能證明哪些？","量測變異很大時，直接討論製程能力有什麼問題？","你如何驗證供應商報告與實際量測一致？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"doe-process","title":"DOE：把噪音、潤滑與製程改善變成可驗證實驗","en":"Design of experiments","summary":"先定義問題、反應值、因子、範圍與不可改的限制，再安排試驗。一次只改一個因子容易漏掉交互作用；完整或部分因子設計、重複、隨機化與區組，需依問題與資源選擇。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"產品開發與驗證","tags":["產品開發與驗證"],"body":[{"title":"DOE 要回答因果與條件","text":"先定義問題、反應值、因子、範圍與不可改的限制，再安排試驗。一次只改一個因子容易漏掉交互作用；完整或部分因子設計、重複、隨機化與區組，需依問題與資源選擇。"},{"title":"潤滑異音的匿名案例","text":"特定激振條件下金屬平衡件產生異音，潤滑可降低摩擦或振動，但也可能擴散污染外觀。因子可包含油材、點油量、位置、針頭、壓力、路徑及治具；反應值不只聲音，也包含外觀、耐久與製程一致性。"},{"title":"主效應與交互作用","text":"點油量增加可能改善噪音，但效果也受油材或點位影響，這就是需要檢查交互作用的原因。多組測試先找到方向，還要在選定條件做確認試驗，不能用最好的一次結果當成穩定量產能力。"},{"title":"設計、執行、審查的責任不同","text":"面試要分清誰選因子與水準、誰安排與操作、誰分析、誰決定導入。參與 Review 有價值，但不能直接寫成獨立設計完整 DOE。"},{"title":"導入產線後要再看什麼","text":"量測方法是否一致、設備參數能否鎖定、材料批次是否改變、良率與噪音是否持續、維護與更換如何管理。實驗室有效不等於自動點油線在節拍與環境變化下也有效。"}],"questions":["這組 DOE 的因子、水準與反應值是什麼？","哪兩個因子可能有交互作用？","如何證明改善可重複，且沒有外觀或壽命代價？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"keyboard-feel","title":"鍵盤結構、力量曲線、手感與可靠度","en":"Keyboard mechanisms and force curves","summary":"剪刀腳、柱塞／套筒式與機械開關是不同的結構路線。比較不只是手感偏好，還涉及厚度、鍵程、模具、零件數、導向、穩定度、壽命與成本；各產品實作可能不同，不用單一高低排名代替工程比較。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"機構與產品設計","tags":["機構與產品設計"],"body":[{"title":"面試中的產品知識要保留","text":"剪刀腳、柱塞／套筒式與機械開關是不同的結構路線。比較不只是手感偏好，還涉及厚度、鍵程、模具、零件數、導向、穩定度、壽命與成本；各產品實作可能不同，不用單一高低排名代替工程比較。"},{"title":"力量—位移曲線","text":"按壓過程的峰值、下降段、回彈、行程與遲滯會影響觸感。可用峰值與谷值的差異理解明顯的段落感，但曲線還受橡膠圓頂、導向、摩擦、結構與測法影響，不能只靠一個力量數字保證整體手感。"},{"title":"薄度、模具與成本","text":"剪刀腳可支援較薄結構與導向，但鍵帽、支架、底板等帶來工具與裝配成本；柱塞式的導向與模具配置不同。共用既有工具或類似尺寸可能降低成本，仍需確認尺寸、手感、外觀及壽命，不能只因能裝上就共用。"},{"title":"可靠度與一致性","text":"檢查按壓壽命、中心與邊角力量、偏壓翹動、環境、彎曲、振動／異音與軟性電路狀態。更薄或更柔軟可能改變手感與耐久，需用試驗找可接受窗口，而非直接套用面談中的單一壽命數字。"},{"title":"熱變形案例的推理","text":"若包裝後熱測造成按鍵變形，要先對照裸機與包裝樣品、溫度歷程、結構干涉及既有設計。多次改包裝仍失敗時，應重新檢查假設；可透過結構補強、間隙或其他方案驗證，並確認外觀、功能及壽命代價。"}],"questions":["怎麼量中心與邊角手感差異？","更薄的設計對工具、強度與壽命有什麼代價？","如何證明熱變形主要來自包裝還是產品結構？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"plastic-injection","title":"塑膠射出與二次料：參數、外觀、結構與成本","en":"Injection molding and regrind","summary":"熔膠／料管溫度、模溫、射出速度與壓力、切換、保壓、冷卻與乾燥等彼此連動。還有澆口、流道、厚度、排氣及材料特性，不能把所有外觀缺陷都歸因於射壓過高。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"材料與製程","tags":["材料與製程"],"body":[{"title":"製程不能只背參數名稱","text":"熔膠／料管溫度、模溫、射出速度與壓力、切換、保壓、冷卻與乾燥等彼此連動。還有澆口、流道、厚度、排氣及材料特性，不能把所有外觀缺陷都歸因於射壓過高。"},{"title":"流痕與其他缺陷要區分","text":"先確認是流動痕跡、噴射紋、熔接線、縮痕、銀絲還是燒焦，位置及形貌不同，對策也不同。記錄澆口、流動方向、填充與溫度條件，再用短射、模流與對照試驗判讀；某參數升高可能改善一種問題又帶來另一種問題。"},{"title":"二次料不等於同一種材料","text":"水口回用、製程回收料與其他回收口語的純度、熱歷程、含水、污染與批次穩定性不同。原生／二次料比例不能直接沿用其他產品的面談數字；需看材料、認證、強度、阻燃、外觀與客戶限制。"},{"title":"報價如何拆","text":"分開材料實際耗用、原生／回用比例與單價、水口與報廢、成型週期、穴數、設備與人工、良率、後處理與檢驗。廢料回收價值、二次料使用效益及已含在報價中的折讓不能重複扣算。"},{"title":"PVT 一詞有兩個語境","text":"產品開發的 PVT 常指量產驗證；塑膠材料的 p-v-T 則是壓力、比容與溫度的關係，模流分析可用於理解收縮等行為。看到相同三個字母，先確認在談材料物性還是開發關卡。"}],"questions":["判斷流痕前先確認哪些現象？","回用比例改變後，哪些性能與認證需再驗證？","供應商報價是否重複計入或扣除廢料效益？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"adhesive-process","title":"材料貼合：熱、壓力、膠材與剝離位置","en":"Bonding process windows","summary":"真皮或其他觸感材料貼合時，外觀、手感、透氣、尺寸與接著強度都可能受熱壓影響。高溫可能破壞表面，低溫可能接著不足；加壓或延長時間也可能帶來變形與節拍成本。不能只挑一個最強的膠。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"材料與製程","tags":["材料與製程"],"body":[{"title":"材料導入是多目標問題","text":"真皮或其他觸感材料貼合時，外觀、手感、透氣、尺寸與接著強度都可能受熱壓影響。高溫可能破壞表面，低溫可能接著不足；加壓或延長時間也可能帶來變形與節拍成本。不能只挑一個最強的膠。"},{"title":"先看裂開的是哪裡","text":"是膠與基材介面脫離、膠層內聚破壞，還是材料本身分層？如果裂在基材層間，單換更強膠可能仍無法解決；可能需要材料背面處理、補強或結構調整，且必須保留觸感與相容要求。"},{"title":"建立製程窗口","text":"依材料、膠膜／膠材與供應商資料選可試範圍，設計溫度、壓力、時間與表面處理的對照。量測剝離、外觀、尺寸與環境後表現；不同材料批次、含水與儲存也需納入。此處不給可直接套產線的通用熱壓數值。"},{"title":"誰做判斷要講清楚","text":"供應商提出建議、RD／ID 定義要求、工程安排試驗、PM 審查成本與時程，是不同責任。要說出本人負責哪段、選擇依據與量產驗證，不把協調工作寫成材料配方研發。"}],"questions":["裂紋路徑如何改變對策？","除了強度，怎麼驗證沒有破壞觸感？","供應商建議如何轉成受控且可量產的條件？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"pump-control","title":"流量、差壓、轉速與保護：看懂控制迴路","en":"Pump control and protection","summary":"流量感測器量液體通過量；壓力與差壓反映系統不同位置的壓力；VFD／驅動器接收轉速或其他命令。命令提高，不表示實際流量一定增加到同樣比例，因為工作點還受管路阻力與泵特性影響。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"感測與控制","tags":["感測與控制"],"body":[{"title":"量測、命令、實際狀態分開","text":"流量感測器量液體通過量；壓力與差壓反映系統不同位置的壓力；VFD／驅動器接收轉速或其他命令。命令提高，不表示實際流量一定增加到同樣比例，因為工作點還受管路阻力與泵特性影響。"},{"title":"控制模式取決於系統","text":"系統可能依供液溫度、流量、差壓或組合邏輯控制。固定差壓與固定轉速不是同一模式；感測位置、濾波、更新速度與故障處理都會影響結果，不宜只靠一條正常運作曲線判斷。"},{"title":"高差壓可能有哪些原因","text":"阻塞、閥位、接管、流量與感測問題都可能相關。要先確認上下游位置、單位、實際流量、閥門與感測可信度，再判斷；不能看到差壓高就直接說泵壞了或直接增加轉速。"},{"title":"保護不是只有一個停機鍵","text":"異常可能觸發告警、降載、備援切換、停特定泵或受控停機。要一起考慮漏液、過壓、缺流、過溫與冷卻中斷風險，並明確定義故障優先順序、遲滯、延遲與復歸條件。具體門檻依設備核准規格。"},{"title":"Power 與 Control 的介面","text":"Control 定義或執行控制邏輯，Power 提供可承受的電源、驅動與保護，系統整合需確認命令、回授及故障訊號的介面。各團隊實際分工需按職缺與專案核對，不能將整套能力歸到同一個 EE 名稱。"}],"questions":["如果流量低而差壓高，你先查什麼？","正常斜坡與故障保護何時採不同路徑？","Power／Control 各要交付哪些介面資料？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"system-modularity","title":"液冷系統標準化：什麼能共用，什麼必須重新選？","en":"System modularity and reuse","summary":"相同溫度或水質量測範圍可能有共用元件的機會；熱負載、流量與壓力差異很大的機型，Pump、管徑、Valve、HX 與感測量程未必可直接沿用。這是需求與驗證問題，不是把所有產品做成一模一樣。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"液冷系統","tags":["液冷系統"],"body":[{"title":"共用的前提是需求窗口重疊","text":"相同溫度或水質量測範圍可能有共用元件的機會；熱負載、流量與壓力差異很大的機型，Pump、管徑、Valve、HX 與感測量程未必可直接沿用。這是需求與驗證問題，不是把所有產品做成一模一樣。"},{"title":"標準化的價值與代價","text":"共用可以降低料號、採購量分散、備料與服務複雜度；但過度統一可能讓小機型過大、過貴或控制解析度不足，也可能讓大機型性能不足。需比較產品族群的整體成本與性能窗口。"},{"title":"模組邊界要定義","text":"機械安裝、流體介面、材料、電源、通訊、感測、故障與維修方式都需列入。相同料號不代表所有操作條件都相同；換到新機型仍要核對邊界、驗證與異常。"},{"title":"TPM 的決策角色","text":"將市場需求與不同產品條件整理成平台策略，與 RD 確認哪些共用、哪些變體，說清取捨與驗證計畫，再連到銷售說明、供應與維護。不是只要求 RD「盡量模組化」。"}],"questions":["哪個需求範圍證明兩款產品可以共用？","共用後的採購效益與性能代價如何量化？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"refrigeration-cycle","title":"蒸發器、冷凝器與壓縮機：冷凍循環和 CDU 側別不同","en":"Vapor-compression refrigeration","summary":"蒸發器讓冷媒吸收被冷卻側的熱；壓縮機提升冷媒壓力；冷凝器向外排熱；膨脹元件使冷媒降壓，之後再回到蒸發器。這是典型蒸氣壓縮循環的功能示意，實機可能有其他元件與控制。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"液冷系統","tags":["液冷系統"],"body":[{"title":"先畫四個主要功能","text":"蒸發器讓冷媒吸收被冷卻側的熱；壓縮機提升冷媒壓力；冷凝器向外排熱；膨脹元件使冷媒降壓，之後再回到蒸發器。這是典型蒸氣壓縮循環的功能示意，實機可能有其他元件與控制。"},{"title":"蒸發與冷凝是冷媒的狀態變化","text":"蒸發端吸熱、冷凝端放熱，不是說設備裡任何水管都在沸騰或結露。Chiller 的冰水、冷卻水與冷媒可以是不同迴路，需分清哪個流體、哪個熱交換器與哪個量測點。"},{"title":"氣冷與水冷是在說排到哪裡","text":"氣冷式冷凝器把熱交給空氣；水冷式把熱交給冷卻水，再由其他設備排出。熱最終仍需離開系統，不能只說冷板把晶片熱帶走就完成全部冷卻。"},{"title":"一次／二次側是另一個命名維度","text":"CDU 一次與二次側常用來劃分設施及 IT 液體迴路，不代表蒸發器與冷凝器。液對液 CDU 的水側熱交換可沒有壓縮機與冷媒相變；是否包含冷凍功能要看實際架構。"}],"questions":["液對液 CDU 一定有冷媒嗎？","請畫出熱從晶片到室外所經的每段流體。"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"power-system-studies","title":"潮流、故障與穩定度：電網模擬和配電落地如何分？","en":"Power system studies and VSC-HVDC","summary":"PSS/E、MATLAB／Simulink 等工具可以用於不同層級的電力分析；是否做過模型、控制或擾動研究，需要看實際建立的模型與結果。操作工具不直接等於已具備建廠圖面、保護整定、設備安裝或送電責任。","units":["跨領域"],"cat":"技術原理","section":"industry","knowledgeTopic":"電力系統","tags":["電力系統"],"body":[{"title":"研究工具與工程交付不同","text":"PSS/E、MATLAB／Simulink 等工具可以用於不同層級的電力分析；是否做過模型、控制或擾動研究，需要看實際建立的模型與結果。操作工具不直接等於已具備建廠圖面、保護整定、設備安裝或送電責任。"},{"title":"潮流、短路與動態問題","text":"潮流看指定運轉條件的電壓、功率與負載分布；短路分析關注故障電流及設備／保護需求；動態穩定則看擾動後狀態隨時間如何變化。三者目的、模型與輸出不同，不能用一份漂亮波形代替全部能力。"},{"title":"VSC-HVDC 的語境","text":"電壓源型高壓直流輸電利用轉換器連結 AC 與 DC 系統，可涉及有功／無功、電壓控制與併網動態。它與設備內 DC Bus 有共同的電力電子概念，但系統規模、控制、保護與工程責任不同。"},{"title":"從研究轉到職務要補問","text":"模型假設是什麼、自己做哪段、如何驗證、故障情境如何設計？如果轉向 Data Center 配電，再核對容量、SLD、備援、保護協調與施工／試運轉；不將研究主題直接等同已具全部實務。"}],"questions":["你如何驗證模型而非只讓曲線看起來合理？","潮流、短路與暫態各用來做什麼決策？","研究能力轉到配電專案還缺哪些交付物？"],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"tpm-case-qa","title":"TPM 技術面試詳解：21 組問題與案例推理","en":"TPM technical interview cases","summary":"以下把面談中的技術主題、匿名案例與追問邏輯逐題保留。右欄是技術脈絡與進一步核對方向，不能當成某位人選已證明的能力或唯一標準答案。","units":["跨領域"],"cat":"人才需求","section":"jobs","knowledgeTopic":null,"tags":["面試問答"],"body":[{"title":"怎麼讀這份問答","text":"以下把面談中的技術主題、匿名案例與追問邏輯逐題保留。右欄是技術脈絡與進一步核對方向，不能當成某位人選已證明的能力或唯一標準答案。"},{"title":"完整技術問答","text":"| 面試問題 | 技術脈絡與追問 |\n|---|---|\n| 量測設備的 GRR 怎麼做？ | 拆分重複性、再現性、重新裝夾與判定方法；不確定轉錄字詞需回到實際量測流程。 |\n| 客戶給定規格後，TPM 還要做什麼？ | 理解規格背後的問題、下一個追問、量測與需求，而非只轉交 RD。 |\n| 報表與原始數據不一致怎麼處理？ | 保留原始值與樣品識別，重新核對方法、分布與重複量測；結果與對策需真實呈報。 |\n| 熱測後按鍵變形，為何不只改包裝？ | 多次驗證失敗後重新查結構與歷史設計，區分 PM 協調、RD 提案與本人決策。 |\n| 潤滑改善異音後為何還要驗證外觀？ | 油材可能擴散；點位、量、針頭、壓力與路徑會影響污染及量產一致性。 |\n| DOE 是誰規劃的？ | 設計、Review、操作、分析與導入是不同責任，要逐項說清。 |\n| 新材料貼合開膠怎麼查？ | 先分介面、膠層與基材分層，再看溫度、壓力、時間、材料與表面處理。 |\n| 新技術做不及客戶期限時怎麼談？ | 展開時程、驗證與現成材料選項，把功能、成本與日期取捨呈現，不能只給新日期。 |\n| 產品競爭力一定是新功能嗎？ | 既有工具共用、模組庫、製造效率、良率與交期也可能有商業價值，但要量化。 |\n| 鍵盤可靠度如何驗證？ | 壽命、邊角力量、偏壓、環境、彎曲與異音等應與用途及標準對應。 |\n| 手感如何由數據說明？ | 用力量—位移曲線、鍵程、回彈與不同位置量測；不能只說主觀好按。 |\n| 剪刀腳與柱塞式有何取捨？ | 比較厚度、導向、模具、裝配、壽命與成本，而非只說一種較好。 |\n| 射出有流痕，你如何開始排查？ | 先確認缺陷形貌、澆口與填充，再查材料、溫度、速度、壓力及模具。 |\n| 陌生產品如何快速理解？ | 拆 BOM、功能、規格、量測與限制，查資料後向有經驗的人確認，再回到現場驗證。 |\n| Unit Cost 與專案總成本如何分？ | 材料／成型／組裝之外還可能有模具、測試、第三方與一次性費用，須界定口徑。 |\n| 客戶要求降價，但材料漲價怎麼辦？ | 用相同基準及市場／採購資料拆差異，提出規格、工序或其他方案，避免拿不同比價條件直接承諾。 |\n| 在展覽與客戶對談要做什麼？ | 說明現有與未來產品的理由，同時蒐集多客戶需求，形成可驗證的 Roadmap 假設。 |\n| TPM 需要親自畫管路與選 Pump 嗎？ | 不必包辦每張圖，但要參與規格、選項與後果的技術討論，能解釋取捨。 |\n| 為何整條產品線不能全部共用同一模組？ | 熱負載、流量、壓力與量測範圍不同，需求窗口可能不重疊。 |\n| 工廠屢次達不到日期時怎麼做？ | 到現場辨識限制，協助取得工程／管理資源並訂恢復計畫。 |\n| 市場催上市而驗證沒完成，如何決定？ | 逐項列未驗證風險、補證、暫時限制與核准責任；商業時程不能自動取代品質放行。 |"},{"title":"口語辨識限制","text":"原始口語轉字有不少近音詞；GRR、製程、材料與結構名稱若無法確認，保留對應問題與條件，不把不清楚的語句補成精確規格、門檻或化學配方。"}],"questions":[],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"scm-case-qa","title":"Supply Chain 技術面試詳解：21 組成本與交付問答","en":"Supply chain technical interview cases","summary":"這份題庫把成本拆解、供應商資源、海外供應、品質、長交期與備料案例分開。每一題都要追到本人做法、依據、交付與結果；右欄是解讀與追問方向，不是個人評級。","units":["跨領域"],"cat":"人才需求","section":"jobs","knowledgeTopic":null,"tags":["面試問答"],"body":[{"title":"保留的是問題與推理","text":"這份題庫把成本拆解、供應商資源、海外供應、品質、長交期與備料案例分開。每一題都要追到本人做法、依據、交付與結果；右欄是解讀與追問方向，不是個人評級。"},{"title":"完整技術問答","text":"| 面試問題 | 技術脈絡與追問 |\n|---|---|\n| 塑膠的新料與二次料，價格如何拆？ | 看材料牌號、比例、實際耗用與合格性能；不將舊案例比例當產品通則。 |\n| 廢料價值是否已反映在報價？ | 先釐清回收／回用、庫存所有權與報價口徑，避免重複扣價。 |\n| 模具成本有哪些部分？ | 鋼材、穴數、加工、表面、壽命、維修與量的分攤。 |\n| 整組散熱模組與單支熱管成本如何分？ | 拆 Heat Pipe、底座、Fin、加工、組裝、焊接與測試。 |\n| 熱管與外觀相同的空心銅管怎麼區分？ | 規格、內部結構與性能不同；報價、驗收及任何替換需經核准，不可默許偷換。 |\n| 價格被壓低後如何防止不當替料？ | 用圖面、BOM、變更、合約、檢驗與追溯控制，降價不能默許規格漂移。 |\n| JIT 與 VMI 怎麼談？ | 庫存位置、補貨責任、所有權與資金成本要分開。 |\n| 供應商近廠設倉的代價誰負擔？ | 量、倉租、資金、運輸、報廢與需求變更需有條件，不只要求配合。 |\n| 銅、鋼等價格如何跟蹤？ | 按材料、報價期間與採購基準對齊；預測與已發生行情分開。 |\n| 保供備料與價格鎖定有何不同？ | 前者保數量，後者管理價格；可能只鎖當月價格而保證後續數量。 |\n| 先鎖料後跌價怎麼處理？ | 看合約與使用計畫、資金與呆滯風險，不假設一定可以轉售或轉嫁。 |\n| 海外供應商樣品過、量產不穩怎麼辦？ | 確認工藝、量測、外觀標準、治具、能力與量產控制；不能只憑簽樣放行。 |\n| 小 BU 無法承諾大採購量，如何爭取資源？ | 需求整合、關鍵料分級、合作承諾與第二來源都要帶成本及可執行條件。 |\n| 集團共用供應商已滿載怎麼辦？ | 可用產能不等於整廠產能，需查分配、瓶頸與新增資源，不能只多找窗口。 |\n| 標準 Pump／Valve 與機構件採購有何不同？ | 標準規格、進口交期、替代認證與供應地可能限制選擇，需逐項確認。 |\n| 供應商說產能不夠，你會查什麼？ | 按工序看工時、設備、治具配置、換線與良品產出，再到現場交叉核對。 |\n| 管路和歧管有什麼新增工藝風險？ | 焊接、密封、耐壓、變形與清潔等不能沿用一般消費電子零件驗收。 |\n| 交貨準時但耐壓後變形，算完成嗎？ | 日期與品質要同時達標；定位設計、工藝與測試條件後整改複驗。 |\n| 只差一顆料，如何縮短到料後交付時間？ | 先確認缺料原因，討論可先完成的組裝、治具與測試，不能跳過必要驗證。 |\n| 空運、提前備原料與替代料怎麼選？ | 分清可省的時間、費用、品質核准及設計變更風險。 |\n| 備料判斷錯誤或 ECO／取消怎麼辦？ | 先停止未必要的投入，確認完成程度、可轉用範圍與合約責任，再談合理處理。 |"},{"title":"不要把口語數字變成標準","text":"回用比例、原物料價、某工廠公差、供應能力與焊接名詞都有特定語境；不清楚的數字不當作採購標準。以已核准圖面、材料與量產證據驗證。"}],"questions":[],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"english-work-interview","title":"跨職務英文面試：開場、12 題情境與逐步追問","en":"Workplace English interview","summary":"自我介紹、即時理解、海外會議、客戶交期解釋與技術轉譯是不同任務。可先問熟悉的工作，再用追問與示範確認能否即時互動；不把背熟的自我介紹當作完整工作英文能力。","units":["跨領域"],"cat":"人才需求","section":"jobs","knowledgeTopic":null,"tags":["面試問答"],"body":[{"title":"先決定要觀察哪種溝通","text":"自我介紹、即時理解、海外會議、客戶交期解釋與技術轉譯是不同任務。可先問熟悉的工作，再用追問與示範確認能否即時互動；不把背熟的自我介紹當作完整工作英文能力。"},{"title":"自然開場與銜接","text":"Before we move on, I'd like to switch to English for a few minutes.\n在繼續前，我想花幾分鐘用英文交流。\n\nTo start, could you walk me through your current role and your main responsibilities?\n首先，請介紹目前職位及主要職責。\n\nThank you. Let's switch back to Chinese.\n謝謝，我們切回中文。"},{"title":"完整中英對照題庫","text":"| English | 中文 |\n|---|---|\n| What would you consider your most significant professional achievement so far? | 你目前最重要的職涯成果是什麼？ |\n| Could you walk me through a challenging project you've been involved in? | 請帶我了解一個你參與過的困難專案。 |\n| What aspects of your previous experience would be most valuable in this position? | 哪些過往經驗最能運用到這份工作？ |\n| Can you describe a situation where things didn't go as planned and explain how you handled it? | 計畫不如預期時，你如何處理？ |\n| How do you approach decision-making when you have limited information? | 資訊不足時如何做決策？ |\n| Looking back at a difficult situation, what would you have done differently? | 回顧困難情境，你會改變什麼做法？ |\n| How would you handle a disagreement between two departments with conflicting priorities? | 兩部門優先順序衝突時如何處理？ |\n| How do you ensure effective communication when working with overseas teams? | 如何確保海外團隊溝通有效？ |\n| How would you explain a complex technical issue to someone without a technical background? | 如何向非技術人員解釋複雜問題？ |\n| If a customer requested an unrealistic delivery schedule, how would you manage their expectations? | 客戶要求不合理交期時如何管理期待？ |\n| Suppose an unexpected issue puts your project at risk. What would be your immediate priorities? | 突發問題危及專案，優先處理什麼？ |\n| If you strongly disagreed with your manager's decision, how would you communicate your concerns? | 不認同主管決定時如何表達疑慮？ |"},{"title":"十句通用追問","text":"| 追問 | 用途 |\n|---|---|\n| Could you elaborate on that? | 請再詳細說明 |\n| Could you give me a specific example? | 要具體案例 |\n| What was your specific role in that situation? | 確認本人責任 |\n| How did you approach the problem? | 還原分析方法 |\n| What challenges did you encounter? | 找出限制 |\n| How did you resolve the issue? | 問對策 |\n| What was the outcome? | 問結果 |\n| What did you learn from that experience? | 問學習 |\n| How would you handle it differently next time? | 問反思 |\n| Could you explain what you mean by that? | 確認意思 |"},{"title":"把工作情境問到底","text":"交期題可追問：What would you actually say to the customer?（請直接示範對客戶怎麼說。）跨部門題可追問：How would you convince both sides to reach an agreement?（如何讓雙方達成共識？）工程題可要求先對非工程師解釋，再補一個技術條件，看是否能調整表達。"},{"title":"三分鐘的安排","text":"簡短開場 → 工作責任 → 一個專案情境 → 一至兩次針對回答的追問 → 結束。重點是連續互動，正式面試可依職務延長，不必為問完題庫犧牲對話品質。"},{"title":"觀察而非正式認證","text":"分別記錄聽力理解、流暢、結構清晰與互動反應。若使用內部 1～5 分小表，需寫下行為例子與適用工作，不宣稱為正式 CEFR 認證，也不單靠口音判斷工作能力。"}],"questions":[],"related":[],"addedAt":"2026-11-22","updatedAt":"2026-11-22"},{"id":"e13-engineering-complete","title":"E13 散熱研發詳記：材料、焊接、熱設計與驗證","en":"Complete thermal engineering notebook","summary":"八章完整閱讀：產品與熱路、Ni-P 焊接失效案例、設計與製程條件、EDM 白層與 XRF、金相與密封驗證、專案階段、散熱數據計算，以及從需求到交付的工程閉環。","units":["E13"],"cat":"技術原理","section":"industry","knowledgeTopic":"散熱研發實務","tags":["E13","Ni-P","DFM","金相","熱阻","壓降","完整詳記"],"body":[{"title":"第一章｜先看產品：熱從晶片走到哪裡","text":"E13 的研發要同時處理熱傳、結構、流動、材料、加工與驗證。產品不是畫完 3D 就完成，而是要在空間、性能、可靠度、可製造性及交付之間形成可重複的方案。","chapter":true},{"title":"氣冷散熱模組的完整熱路","text":"晶片產生熱 → TIM 熱介面材料 → Base 底座／VC／Heat Pipe → Fin Stack 鰭片 → 流動空氣 → 系統排風。每一段都有熱阻；其中一段接觸、傳熱或流動不良，增加其他地方的面積也可能補不回來。熱源尺寸、分布與位置也會影響底座是否能把熱攤開。"},{"title":"零件名稱與實際作用","text":"| 零件／名詞 | 在系統中做什麼 | 需要一起看的限制 |\n|---|---|---|\n| Heatsink／HSK | 散熱構件或整組散熱器的常用稱呼 | 名稱本身不保證內部結構 |\n| Base 底座 | 接收熱源經 TIM 傳來的熱 | 平整度、厚度、擴散與接觸 |\n| VC 均熱板 | 以封閉相變機制把局部熱量攤到較大區域 | 工作液、毛細回流、姿態、承載及製造 |\n| Heat Pipe 熱導管 | 把熱搬到其他位置 | 長度、彎折、壓扁、回流與熱負載 |\n| Fin Stack 鰭片 | 增加與空氣交換熱量的面積 | 間距、厚度、壓降、流量分布 |\n| Fan 風扇 | 提供壓力差驅動空氣通過系統 | 風扇曲線、工作點、噪音、功耗與備援 |\n| Chassis 機箱 | 容納零件並形成整體配置與風道 | 高度、阻擋、旁通、回流及裝配 |"},{"title":"液冷散熱模組的完整熱路","text":"晶片 → TIM → Cold Plate 冷板金屬 → 冷板內流道的冷卻液 → 進出液口與管路 → 後段熱交換與排熱設備。冷板需要吸熱，也需要足夠而分布合理的流量；熱阻、壓降、密封、材料相容與機械強度都必須一起驗證。冷板沒有漏液，不等於熱性能已達標；熱性能達標，也不等於密封與可靠度已通過。"},{"title":"液冷零件的設計問題","text":"| 項目 | 需要定義的內容 | 常見驗證 |\n|---|---|---|\n| 冷板與底座 | 熱源位置、接觸面、厚度與變形 | 溫度、熱阻、平整度與受力 |\n| Flow Channel 流道 | 分流、局部流速、均勻性與阻力 | 流量—壓降曲線、熱測、模擬對照 |\n| Inlet／Outlet 進出液口 | 接口、方向、裝配空間與受力 | 裝配、壓力、漏測與維護 |\n| 焊接／接合區 | 材料、接頭形式、前處理與可檢驗性 | 金相、強度、耐壓、密封與可靠度 |\n| 管路與密封 | 材料相容、彎曲、側向力、接頭 | 流阻、防漏、安裝及循環後複測 |"},{"title":"氣冷、液冷不是只換一種介質","text":"氣冷主要關注熱到空氣的路徑及可用風量；液冷把更多問題帶到冷板流道、泵送、接合與液體品質。兩者仍共享接觸、熱擴散、公差、製造與可靠度問題。比較應以相同熱負載、溫度限制、空間與系統條件為前提，而非只說液冷一定比較強。"},{"title":"E13 與 T34 的工程邊界","text":"E13 的討論聚焦伺服器內散熱器與模組，例如 Heat Sink、VC、Heat Pipe、Cold Plate。T34 液冷設備語境則延伸到 CDU、Pump、HX、Valve、管路、感測及控制。模組與整機互相影響，但做過其中一個零件，不自動代表做過整套系統；用工作責任、交付物與驗證範圍分清。"},{"title":"第二章｜Ni-P 鍍層、雷射焊接與漏液案例","text":"接頭外觀看起來已經焊住，內部仍可能存在氣孔、微裂紋或未熔合。液冷件要求密封，因此問題可能從表面鍍層、材料與接頭設計開始，不能只靠調整焊接機來補救。","chapter":true},{"title":"化學鍍鎳 Ni-P 是什麼","text":"Electroless Nickel Plating 可形成鎳磷合金鍍層；它與純鎳鍍層、母材本身成分是不同層次。表面處理可能為了耐蝕、耐磨或其他製程需求，但有鍍層對某個使用目的有利，不等於對後續熔融焊接也有利。不鏽鋼是否要鍍、鍍在哪裡，都必須由產品需求決定。"},{"title":"鍍層如何進入焊接問題","text":"雷射在接合區形成熔池，表面的鍍層與殘留物可能混入熔池，改變局部成分、凝固與氣體逸出條件。磷含量、鍍層厚度、母材、接頭間隙與熱輸入都可能影響結果。氣孔不一定全由磷造成，裂紋也不一定全由鍍鎳造成；需用對照試驗、截面與材料資訊建立因果。"},{"title":"低磷、中磷、高磷的比較紀錄","text":"| 比較組別 | 案例採用的磷含量分組 | 該焊接情境的觀察方向 |\n|---|---|---|\n| 焊接區不帶 Ni-P 鍍層 | 不適用 | 作為較乾淨接合面的對照，不表示母材沒有鎳 |\n| 低磷化學鎳 | 約 1–4% | 相較高磷組有較好的焊接表現 |\n| 中磷化學鎳 | 約 4–9% | 需注意氣孔敏感性 |\n| 高磷化學鎳 | 約 9–13% | 該案例對裂紋與氣孔較敏感 |\n\n這張表保留案例比較的分組；區間端點有重疊，不能直接當作材料採購邊界或所有鍍層的通用等級。成分允收要以指定材料與供應規範明確定義。耐蝕、硬度與焊接性也是不同性能，不能合併成單一好壞。"},{"title":"匿名失效案例：先還原現象","text":"案例為不鏽鋼零件與水嘴接合，焊後出現氣孔、微裂紋，密封檢查漏液。案例記錄的原批量為 200 件，該批不良率記為 100%；水嘴帶高磷鎳鍍層，鍍層厚度描述為 10 μm 以上。這些是單一案例條件，不能推成所有鍍鎳水嘴都會同樣失效。"},{"title":"匿名失效案例：設計與製程一起改","text":"改善方向是在水嘴設計上增加約 0.3 mm 的加工餘量，在焊前用 CNC 處理接合面，案例記錄去除量至少約 0.2 mm，以移除鍍層及相關表層影響。真正的改變不只是多一道加工：RD 必須讓工廠有空間、有基準且不破壞最終尺寸地加工，製程再確保表面與組裝符合要求。"},{"title":"加工量、鍍層厚度與單位","text":"10 μm = 0.010 mm；0.2 mm = 200 μm。不能因去除量大於鍍層厚度，就推定一定合格：要確認去除位置、局部殘留、尺寸基準、剩餘壁厚、平整度、表面與接合間隙。圖面預留的加工餘量和最後實際切除量，也不是可以任意互換的同一個數字。"},{"title":"匿名失效案例：結果要怎麼讀","text":"改善後良率記為 99.5%。這表示該批條件下結果改善，不能直接證明製程從此永遠穩定，也不能自行假定改善批仍然是 200 件。教學上若一批 200 件中 199 件合格，才會得到 99.5%；這只是比例算例，不是反推改善批的真實件數。還需要知道樣本、判定方法、失效分類與後續量產表現。"},{"title":"如果只做焊後補救，漏掉什麼","text":"增加熱輸入可能改變熔深，也可能引入更多變形或其他缺陷。重複補焊可能改變材料與尺寸。更有效的處理是同時比較無鍍接合面、除鍍、不同表面與適合的焊接條件，用截面與密封結果驗證，而不是只看焊道外觀。"},{"title":"第三章｜把焊接可行性寫進圖面與製程","text":"DFM 的重點是設計能否被穩定製造、裝配與驗證。焊接區域、加工餘量、定位基準、間隙及檢驗位置若沒有在設計時說清，工廠可能只能靠經驗補救，結果難以重複。","chapter":true},{"title":"RD／DFM 要定義什麼","text":"焊接區的材料與表面要求、禁鍍範圍、加工餘量、最終尺寸、接頭形式、裝配間隙、焊接可接近性、定位／夾持、受力與檢驗位置。要檢查除鍍後是否仍有足夠壁厚與密封強度，焊後變形是否影響接觸面或接口。只在備註寫「焊接良好」無法替代可量測要求。"},{"title":"ME／PE 要把設計轉成受控步驟","text":"選擇加工方式，定義先後順序、切削與去毛邊、清潔、乾燥、保存與搬運、裝配固定、焊接參數與保護條件。設備程式、治具、操作者資格及變更版本也要對得上。工藝驗證完成後，才把可行條件變成作業窗口，不讓不同班別自行猜。"},{"title":"QA／IQC 的檢查責任","text":"來料檢查不只看尺寸，還要確認材質／表面、焊接面鍍層殘留與加工狀態；製程與成品則按圖面及計畫檢查焊縫、截面、尺寸、密封與必要性能。QA／IQC、製程品質及最終驗收的實際分工需在品質計畫寫清，不能假設某一單位包辦全部。"},{"title":"案例中的設計與保護條件表","text":"| 項目 | 案例討論的參考條件 | 解讀時必須帶的限制 |\n|---|---|---|\n| 焊接區禁鍍範圍 | 焊縫周圍約 1–1.5 mm | 需依接頭、熱影響範圍及量測基準確認 |\n| 設計加工餘量 | 約 0.3–0.5 mm | 不是每一面都直接切除相同厚度 |\n| 裝配間隙 | 不超過約 0.1 mm | 需說清量測位置、裝夾與溫度狀態 |\n| 保護氣體 | 氬氣，純度記為不低於 99.999% | 氣源純度不等於焊區實際保護效果 |\n| 氣體流量 | 約 12–18 L/min | 與噴嘴、位置、漏氣、風及接頭有關 |\n| 延時停氣 | 約 0.5–1.0 秒 | 需與設備、冷卻及焊區保護程序一起驗證 |\n\n本表是案例條件的完整記錄，不是直接套用於其他零件的量產設定。實際製程必須有對應材料、圖面、焊接程序及驗證結果。"},{"title":"禁鍍區不是畫一圈就結束","text":"先定義以焊縫中心、接頭邊緣或其他基準量測，處理轉角、孔口及遮蔽誤差；再檢查鍍層邊界是否會進入熔池或熱影響區。禁鍍也可能改變耐蝕表面，因此焊接與使用環境的要求需一併解決，不單獨追求「越大越好」。"},{"title":"為何間隙影響熔合與漏液","text":"接頭間隙改變熱與材料的分布，可能讓局部搭接、填充或熔合不足；零件公差、夾持、熱變形也會改變實際間隙。量到某一點小於限制，不代表整圈都相同。應定義最不利位置、裝配方式與焊後尺寸，對照截面與密封結果。"},{"title":"保護氣體要看整條鏈","text":"確認氣體規格、管路與接頭、流量計、噴嘴、焊區位置、前後送氣、周圍氣流與必要的內部保護。流量過低可能覆蓋不足，單純加大也不保證更好，因為流場可能受到擾動。最後仍以焊縫品質與適用試驗確認。"},{"title":"變更如何進入正式標準","text":"把有效對策寫回圖面、BOM／材料要求、加工及焊接程序、治具與檢驗計畫；對供應商與製造端發出一致版本。保留變更原因、適用料號／範圍、驗證與生效時間，舊版物料的處置也要清楚。這才是由失敗案例轉成可重用知識。"},{"title":"第四章｜線切割白層、清潔與 XRF 檢查","text":"接合面看起來平整，不代表表面冶金與潔淨狀態適合焊接。加工造成的受影響層、殘留鍍層、油污與水分需要分開處理，不能用同一道「擦乾淨」替代所有前處理。","chapter":true},{"title":"Wire EDM 與再凝固白層","text":"線切割以放電移除材料，表面局部熔融後再凝固，可能形成與母材不同的 Recast Layer，常稱再凝固／重鑄白層。依材料與條件，可能伴隨裂紋、孔隙、殘留應力或電極／介質相關影響。白層是加工結果，不是另外貼上去的鍍層，處理方法與判定也不同。"},{"title":"白層為何與雷射焊接有關","text":"若直接在受影響表面焊接，既有缺陷與表層狀態可能參與熔融與凝固，使熔合、氣孔與裂紋風險難以控制。案例的管制方向是不直接使用保留白層的線切割接合面，而是先以適當機械加工等方式處理並檢驗；不能只用外觀看不見白色就當作已去除。"},{"title":"去除後要確認什麼","text":"需定義處理面、去除量如何決定、剩餘尺寸與表面、轉角與內孔能否處理、如何取樣確認受影響層。實際深度與方法要依材料及工藝驗證，不給所有 EDM 零件同一個通用切除量。若加工改變間隙與壁厚，也要回到圖面及焊接驗證。"},{"title":"CNC 後的清潔、乾燥與防再污染","text":"CNC 去鍍後可能留下切削液、油、金屬屑、毛邊與處理液。超音波清潔可成為核准程序的一部分，但清潔液、濃度、時間、溫度、零件相容、漂洗與乾燥需要整體規劃；清洗完成後的手套、包裝、放置時間與搬運也會影響再污染。清潔不是用來替代金屬層的實際去除。"},{"title":"XRF 能量測什麼","text":"X-ray Fluorescence 利用材料對 X 射線激發的特徵響應分析元素，適合配置的儀器與模型可估算 Ni-P 鍍層的厚度及磷成分。這使檢查不必只靠顏色或肉眼，也能比較加工前後的局部表層狀態。鍍層厚度、磷含量與是否殘留是不同判讀問題。"},{"title":"XRF 的限制與抽測位置","text":"量測點大小、位置、曲面／小水嘴幾何、基材、層狀模型、校正與檢出能力都可能影響結果。測一點未發現，不等於整圈完全沒有；基材本身含鎳時，也不能把量到鎳直接等同仍有 Ni-P 鍍層。需指定方法、參考樣、測點、允收與必要的截面／其他證據，不能用儀器名稱替代量測方案。"},{"title":"前處理檢查的完整順序","text":"辨識材質與表面 → 確認禁鍍／加工要求 → 去除指定鍍層或受影響層 → 去毛邊、清潔及乾燥 → 檢查尺寸與表面殘留 → 防污染保存 → 依核准條件裝配與焊接。若其中一步變更，需要判斷哪些後續證據必須重新建立。"},{"title":"第五章｜金相、熔深、耐壓與漏測各證明什麼","text":"焊道外觀、截面品質、結構承壓、密封及長期可靠度是不同證據。把其中一種試驗通過當成全部合格，會漏掉未被該方法覆蓋的失效模式。","chapter":true},{"title":"金相截面怎麼看","text":"把指定位置切開，依適當的鑲埋、研磨、拋光與顯微檢查程序觀察接頭。製樣本身也可能造成拖曳、邊緣變形或其他假象，因此需有適當製樣品質與量測尺度。截面用來看內部熔合與缺陷，不是只拍一張好看的照片。"},{"title":"截面上要分開看的項目","text":"| 項目 | 工程意思 | 不能直接推論的事情 |\n|---|---|---|\n| Penetration 熔深 | 熔入指定材料的深度 | 深就一定密封或一定更強 |\n| Fusion 熔合 | 接合界面是否有效熔合 | 表面連成一線就內部全接合 |\n| Porosity 氣孔 | 內部空洞的形態、大小、位置與分布 | 每一個孔都已形成貫通漏道 |\n| Crack 裂紋 | 裂開位置、方向與延伸 | 一張截面沒看到就整圈沒有 |\n| Undercut／局部形貌 | 焊趾或邊緣的缺口與幾何 | 可不看受力與密封需求就接受 |\n| S1／S2 等標示 | 該圖面／報告定義的量測尺寸 | 所有公司都用同一幾何定義 |"},{"title":"熔深比例與尺寸案例","text":"案例條件曾要求熔深達板厚約 90% 以上，另有接合位置大於 0.5 mm 的尺寸要求。兩者可能指不同位置或不同量，不能合成所有焊縫的共同規範。若教學假設板厚 t=0.60 mm、該位置要求 90%，比例門檻才會是 0.54 mm；這個板厚只是算例，並非實際產品尺寸。"},{"title":"S1、S2 與不同切面如何記","text":"對照圖面定義量測起點、方向、界面與允收上下限，標清切片位置、試件、版次、比例尺與判定。同一圓周的不同切面可能不同，應按驗證計畫選位置，而不是只挑最好看的區域。若標示與圖面不一致，先釐清定義，不能用相似符號猜。"},{"title":"ISO 13919-1 的適用層次","text":"ISO 13919-1:2019 涉及鋼、鎳、鈦及其合金之電子束與雷射焊接接頭的缺欠品質等級。它有三個品質等級，B 對成品焊縫要求最高。這是製作品質等級，不直接等於產品用途適用性；不能用符合某個焊接等級，代替所有液冷件的密封、承壓與使用可靠度。具體缺欠限值與適用條件需核對所採條款。"},{"title":"金相、壓測、漏測與可靠度的比較","text":"| 驗證 | 主要回答 | 仍需別的證據補足 |\n|---|---|---|\n| 外觀／尺寸 | 可見缺陷與幾何是否符合 | 內部熔合、微小漏道 |\n| 金相截面 | 被切到位置的內部結構與缺陷 | 整圈／整件是否密封、使用壽命 |\n| 耐壓 | 指定壓力、時間與方式下的承壓及變形 | 更細微的漏率與長期疲勞 |\n| 漏測 | 該介質、方法、條件與靈敏度下的密封 | 所有未來溫壓循環都不漏 |\n| 可靠度後複測 | 指定環境／循環後是否劣化 | 未被測試條件代表的全部使用情境 |"},{"title":"漏測報告需要哪些條件","text":"介質、壓力／壓差、保壓或量測時間、溫度與穩定時間、方法、儀器校正、背景／治具影響、允收漏率或判定方式。壓降法結果可能受溫度、容積與穩定性影響；氦或其他方法也有各自的靈敏度與邊界。此處不提供可直接套產線的試驗壓力。"},{"title":"失效後如何形成閉環","text":"先區分外觀、尺寸、截面、密封與受力失效 → 保存試件及條件 → 提出材料、表面、裝配、焊接或試驗假設 → 用對照驗證 → 設計／製程改版 → 重做必要的性能與可靠度 → 更新標準與供應商要求。不能只有一句「補焊後 OK」。"},{"title":"第六章｜專案表如何承接工程決策","text":"研發進度不只是百分比或日期。每一列應能回答：目前的規格與樣品版本是什麼、哪些證據已完成、卡在何處、誰負責下一步，以及是否影響交付。","chapter":true},{"title":"四個資料區各做什麼","text":"| 區域 | 記錄重點 | 使用時要確認 |\n|---|---|---|\n| Project List 基本資料 | 產品、專案、客戶類型、平台與整體狀態 | 身分與範圍是否一致、是否重複列案 |\n| Project Status | 負責角色、階段與產品示意 | 階段、狀態與角色不能混用 |\n| 研發工程紀錄 | 規格、文件版本、設計／測試與異常 | 要連到對應樣品、條件及結果 |\n| 製造／其他團隊紀錄 | 樣品、工藝、進度、問題與下一步 | 是否與研發版本同步、介面問題誰處理 |\n\nA3 Version／Content 類欄位用來追文件與內容；不能只憑 A3 三字就認定一定是某種紙張尺寸或固定問題解決模板。"},{"title":"整體狀態與工程階段分兩條軸","text":"On-going 表示仍進行；Pending 表示等待條件或後續處理；Close 表示結案狀態，但原因可能是完成、停止或其他安排，不能只看字面推定量產成功。C0～C5 則回答工程進到哪個內部關卡。同一案 On-going 且 C4 並不矛盾。"},{"title":"C0 至 C5 的這套階段分法","text":"| 階段 | 這套表格中的名稱 | 應補問的放行證據 |\n|---|---|---|\n| C0 | 新案 | 需求、範圍、可行性與負責人 |\n| C1 | 設計 | 規格、設計版本、分析與待解風險 |\n| C2 | 樣品 | 樣品版次、製作與初測結果 |\n| C3 | 模具 | 工裝／模具與試作、修正及驗證 |\n| C4 | 試產 | 工藝、測試、良率、供應與量產準備 |\n| C5 | 量產 | 正式版、驗證與持續品質／交付 |\n\n名稱是這套內部分法；右欄為工程檢查框架，不代表所有公司或每一案都有完全相同關卡。不能直接把每個 C 碼逐一等同 EVT／DVT／PVT。"},{"title":"一筆有用的進度紀錄","text":"日期、樣品／圖面版本、做了哪個試驗、條件與目標、結果、問題分類、暫時處置、永久對策、責任人、下次交付物及日期。例：「V2 以條件 A 完成熱測，目標尚未達到；先查 TIM 接觸與風量，下次交付重裝對照與模擬差異表。」這比「持續處理中」可行動得多。"},{"title":"版本變更如何避免假改善","text":"改了底座、流道、材料、焊接、測試治具或規格，都可能使前後結果不再可比。需把圖面、BOM、樣品、測試程序、原始數據與報告版本連起來；不能拿舊版合格報告替新版放行，也不能把不同條件的變化直接稱為設計改善。"},{"title":"主管實際需要的工程答案","text":"性能是否達標、樣品與試驗是否如期、主要阻礙是設計還是製程／物料／測試、誰有責任與資源、規格是否變更、下一個樣品或報告何時交。這些是管理應檢查的問題，不是為了填滿報表而產生的欄位。"},{"title":"跨團隊追蹤要讓問題能被關閉","text":"把同一問題的設計端、製造端與品質端內容連起來。例如漏液不能只由製造端回報已重焊，還要回到材料與表面、圖面前處理、截面及密封驗證；關閉標準應是所需證據完成，而非日期到了或某人說已處理。"},{"title":"第七章｜熱阻、風量、壓降與遠端散熱的深入判讀","text":"性能數字必須連到熱路徑、測試條件與產品配置。下面用匿名設計案例保留數值與計算脈絡；規格欄上的目標值不能直接當成已達成的實測結果。","chapter":true},{"title":"先分功率、熱阻、風量與壓差","text":"W 是功率；°C/W 或 K/W 是指定路徑的熱阻；CFM 是體積風量；Pa 是壓力／壓差。功率大不等於散熱設計好，風量大不等於晶片接觸好，壓降低也不等於熱阻最低。每個量都需要邊界與量測位置。"},{"title":"匿名案例 A：高功率散熱目標","text":"| 項目 | 設計資料中的數字 | 必須確認的定義 |\n|---|---|---|\n| 熱負載相關值 | 2,500 W | 是額定、測試、局部或整組熱量 |\n| 熱阻相關值 | 0.016°C/W | 哪兩個溫度點之間、是否包含 TIM |\n| 風量條件 | 550 CFM | 通過散熱器還是整機、對應哪個工作點 |\n\n在這些定義與達標證據未確認前，這三項先視為設計／測試條件記錄，不寫成已通過的性能宣告。"},{"title":"熱阻算例：40°C 的溫升代表什麼","text":"若熱阻 Rθ=0.016°C/W 與 Q=2,500 W 確實屬於同一熱路徑及條件，ΔT=Q×Rθ=40°C。這是兩個已定義溫度點的差，不直接等於晶片絕對溫度。如果只是教學假設參考點為 30°C，另一端才會為 70°C；參考點不同，絕對溫度也不同。不能未確認 Rθ 定義就把此算例當作結溫。"},{"title":"高功率氣冷設計要同時考慮什麼","text":"底座／VC 能否把熱攤開，熱管能否搬運到鰭片，鰭片間距與厚度是否適合風量，系統高度與安裝方向、風道是否旁通或回流，風扇能否在實際阻力下提供所需風量。還要考慮材料、重量、機械載荷、成本與製造。只把金屬加大，可能先撞到空間或風阻限制。"},{"title":"匿名案例 B：熱性能與風阻一起看","text":"另一組資料為熱阻約 0.0249°C/W、風量約 110 CFM、壓差約 190 Pa。它與案例 A 的流量、結構、熱源與條件可能不同，因此不能看到 0.0249 大於 0.016 就判定產品較差。需先對齊目標、邊界、空間與量測定義。"},{"title":"CFM 與流動功率的教學計算","text":"1 CFM 約為 0.000472 m³/s，因此 110 CFM 約 0.0519 m³/s，550 CFM 約 0.260 m³/s。若案例 B 的 110 CFM 與 190 Pa 是同一工作點，理想空氣流動功率約 Qv×ΔP=0.0519×190≈9.9 W。這不是風扇電功率；還有風扇／馬達效率與其他損失，也不能把不同工作點的最大流量與最大壓力相乘。"},{"title":"鰭片加密為何可能反而更熱","text":"面積增加可改善換熱，但流道更窄可能增加系統阻力。在同一風扇下，實際風量可能下降；局部流量也可能不均。比較應看風扇與系統曲線交點、最高溫與均溫、噪音及功耗，並在一致邊界下實測，而不是單看鰭片數量。"},{"title":"Remote HSK 的配置原理","text":"Remote 指把散熱位置移離熱源上方，常見需求是晶片附近高度、主板布局或風道不適合放大鰭片。需要一段可行的熱傳輸路徑，再在其他位置與空氣換熱。可能的實作依產品不同，不能只憑名稱就確定用了哪種熱管、VC 或其他架構。"},{"title":"遠端散熱新增的驗證問題","text":"從接觸、熱傳輸、遠端接合到鰭片與空氣都形成熱阻；路徑長度、彎折、姿態、支撐與受力也可能改變性能。需要確認熱負載分配、安裝變形、運輸／振動、組裝與維護，而非只證明遠端鰭片摸起來有變熱。"},{"title":"如何安排公平的性能比較","text":"固定熱源尺寸與功率、TIM 與安裝力、進風溫度、風量／風扇與風道、感測器位置、穩態判定及樣品版本。若要比較相同風量、相同風扇或相同噪音三種情境，應分開列結論，因為它們不保證同一設計排名。"},{"title":"第八章｜把需求、DFM、打樣、FA 與交付連成完整開發","text":"教育訓練中的製程問題，必須回到專案的圖面、樣品與放行條件。完整開發不是每一項名詞都做過一次，而是能說清楚前一步的輸出如何支持下一步的決策。","chapter":true},{"title":"從需求到量產的交付物","text":"| 步驟 | 核心工作 | 應留下的交付物 |\n|---|---|---|\n| 需求與可行性 | 熱負載、空間、溫度、流量／壓降、環境與成本 | 規格、邊界、風險與未確認清單 |\n| 設計與模擬 | 熱路、流道／風道、材料、結構與參數 | 3D、分析假設、方案比較 |\n| 圖面與 DFM | 公差、接合、禁鍍、加工、治具與檢驗 | 可製造圖面及審查對策 |\n| 打樣與製造 | CNC、表面、清潔、裝配、焊接 | 樣品履歷、工藝條件與偏差 |\n| 性能與品質驗證 | 熱阻、流量、壓降、金相、密封及可靠度 | 原始數據、報告、失效與結論 |\n| 改版與專案追蹤 | 假設、對策、責任、版本與下個節點 | 變更及未結問題、樣品與排程 |\n| 生產導入 | 工藝窗口、供應、測試、品質及放行 | 正式版、驗收基準與持續監控 |"},{"title":"冷板漏液時的跨部門處理示例","text":"先保留樣品與漏測條件，定位漏點及失效類型；核對材質、鍍層、加工白層、清潔、間隙、定位與焊接。RD 檢查接頭與加工空間，ME／PE 檢查可重複的工藝，品質確認量測與允收。用截面、密封及必要的性能／可靠度證明對策，再回寫圖面與程序。這是工程處理示例，不是說每個漏液都由鍍層造成。"},{"title":"熱性能不達標時的 FA 示例","text":"先確認功率、進風／進液溫度、實際流量、壓差、感測與安裝，排除測試條件不一致；再按 TIM、接觸、底座／VC、熱傳輸、鰭片／流道與系統排熱逐段假設。設計控制變因或對照樣品，將模擬與實測差異具體化。改善後再核對機械、密封、可靠度與成本，避免只把熱問題轉移到別處。"},{"title":"如何判斷已準備好交付","text":"性能、幾何、密封與適用可靠度有相應證據；樣品／圖面／BOM／工藝及測試版本一致；未結項目的風險、限制與核准者明確；工廠、供應商與驗收端使用同一標準。單一測試 OK、專案 Close、進到 C5 或已有交期，都不能各自取代這套證據。"},{"title":"工程問答：用問題檢查是否真的讀懂","text":"| 問題 | 回答應包含的推理 |\n|---|---|\n| 為何外觀已焊住還可能漏？ | 內部氣孔、裂紋、未熔合與貫通路徑，外觀證據不足 |\n| 高磷鎳對該案例有影響，是否所有鍍鎳都不能焊？ | 需看材料、成分、厚度、接頭與工藝，不能一概而論 |\n| 為何除鍍要從設計處理？ | 加工空間、基準、壁厚、尺寸及間隙必須可行 |\n| 為何切除量大於鍍厚仍不保證合格？ | 局部殘留、位置、幾何與表面狀態仍需檢查 |\n| 線切割白層與化學鍍鎳有何不同？ | 前者是加工再凝固表層，後者是施加的合金鍍層 |\n| XRF 量到鎳，是否一定表示除鍍失敗？ | 基材與模型、位置及方法都影響判讀 |\n| 一個金相切面 OK 能證明整圈不漏嗎？ | 只能代表取樣位置，密封與其他位置需另外證據 |\n| 熔深 90% 與 0.5 mm 可以直接互換嗎？ | 先核對板厚、量測位置、幾何及各自定義 |\n| ISO 焊接品質等級等於可用於液冷嗎？ | 製作品質與用途適用性不同，仍需承壓與密封等驗證 |\n| 熱阻較低就一定比較好嗎？ | 需相同熱路、條件、空間與代價才可比較 |\n| 0.016°C/W 乘 2,500 W 得到什麼？ | 同一路徑假設下是 40°C 溫差，不是自動得到結溫 |\n| 把鰭片做密為何可能沒改善？ | 阻力上升可能使同一風扇下的實際流量下降 |\n| Pending 且 C4 是否矛盾？ | 等待狀態與目前工程階段是不同維度 |\n| Close 是否代表已量產且通過全部驗證？ | 需看結案理由、正式版與驗證文件 |\n| RD 的能力如何超出 CAD？ | 能把需求、物理、工藝、試驗、FA 與放行決策串起來 |"},{"title":"閱讀數值與不確定性的原則","text":"本專題保留案例技術數字，並將規格／條件、算例與已驗證結果分開。缺少材料、圖面、試驗方法或原始結果的地方，保留相應限制；不把約略讀值改寫成精確量產標準。客戶、人員、專案代號與內部時程不列入技術教學。"}],"questions":[],"related":["dfm","weld-inspection","project-status","thermal-metrics","e13-role"],"addedAt":"2026-11-23","updatedAt":"2026-11-23","featured":true,"changeKind":"new"}],"external":{},"sync":{"mode":"scheduled","schedule":"每日早上 08:00","timezone":"Asia/Taipei","execution":"Mac 與 Codex 啟用時執行","lastCheckedAt":"2026-11-22T18:14:48+08:00","lastContentUpdatedAt":"2026-11-23T00:48:01+08:00"},"jobs":[{"id":"t34-supply-chain","company":"T34","role":"Supply Chain","overview":"scpm","notes":["cost","capacity","leadtime","scm-case-qa"],"knowledge":["vmi","eta","kits","dry-cooler","fulfillment","cnc-sourcing","plastic-injection","weld-inspection"],"status":"ready"},{"id":"t34-pm","company":"T34","role":"PM","overview":null,"notes":[],"knowledge":[],"status":"pending"},{"id":"t34-tpm","company":"T34","role":"TPM","overview":"tpm","notes":["tradeoff","tpm-case-qa"],"knowledge":["primary-secondary","cooling-levels","npi","coolant-quality","grr-measurement","doe-process","system-modularity"],"status":"ready"},{"id":"t34-sales-pm","company":"T34","role":"Sales PM","overview":null,"notes":[],"knowledge":[],"status":"pending"},{"id":"t34-fae","company":"T34","role":"FAE","overview":null,"notes":[],"knowledge":[],"status":"pending"},{"id":"t34-rd","company":"T34","role":"RD","overview":null,"notes":[],"knowledge":[],"status":"pending"},{"id":"e13-rd","company":"E13","role":"RD","overview":"e13-role","notes":[],"knowledge":["e13-engineering-complete","air-liquid","thermal-fa","tolerance","reliability","dfm","cfd-analysis","synergy-angle","thermal-metrics","weld-inspection","grr-measurement","precision-module-reliability"],"status":"ready"},{"id":"e14-ee","company":"E14","role":"EE","overview":"e14-role","notes":["supplier-review"],"knowledge":["power-loss-interview","sensing-parallel","regeneration","leak-sensing","motor-drive","motor-foc","motor-tcs","electrical-test","plc-integration","pump-control"],"status":"ready"},{"id":"cross-supply-chain","company":"跨單位參考","role":"Supply Chain","overview":"supply-planning","notes":["second-source"],"knowledge":["vmi","eta","fulfillment","cnc-sourcing"],"status":"ready"},{"id":"cross-power-design","company":"跨單位參考","role":"大電 EE · 設計","overview":"power-design","notes":["power-split"],"knowledge":["power-loss-interview"],"status":"ready"},{"id":"cross-power-construction","company":"跨單位參考","role":"大電 EE · 施工","overview":"power-build","notes":["power-split"],"knowledge":["primary-secondary"],"status":"ready"}],"jobGuides":["evidence","english-work-interview"]}</script>

const names={jobs:'職缺詳解',industry:'產業知識',saved:'我的收藏'};
const descriptions={jobs:'選擇單位與職缺，閱讀工作內容、人才需求及面試重點。',industry:'產品、零件、技術原理、測試與產業術語，都整理在這裡。',saved:'把想再次閱讀的職缺內容與產業知識留起來。'};
let view='jobs',company='T34',jobId='t34-supply-chain',topic='',active=null,saved=new Set();
try{const v=JSON.parse(localStorage.getItem('sona-industry-saved')||'[]');if(Array.isArray(v))saved=new Set(v.filter(id=>A.some(a=>a.id===id)));}catch{}

function richText(value){
 const lines=String(value||'').split('\n'),out=[];let p=[],list=[];
 const flushP=()=>{if(p.length){out.push('<p>'+p.map(esc).join('<br>')+'</p>');p=[];}};
 const flushList=()=>{if(list.length){out.push('<ul>'+list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');list=[];}};
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(line.startsWith('|')&&i+1<lines.length&&/^\|[\s:|-]+\|$/.test(lines[i+1].trim())){
   flushP();flushList();const cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());const head=cells(line);i++;const rows=[];
   while(i+1<lines.length&&lines[i+1].trim().startsWith('|'))rows.push(cells(lines[++i]));
   out.push('<div class="table-scroll" tabindex="0" aria-label="可左右捲動的比較表"><table><thead><tr>'+head.map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
  }else if(/^[-*]\s+/.test(line)||/^\d+[.、]\s*/.test(line)){flushP();list.push(line.replace(/^[-*]\s+|^\d+[.、]\s*/,''));}
  else if(!line){flushP();flushList();}
  else{flushList();p.push(line);}
 }flushP();flushList();return out.join('');
}
function renderSections(body){return body.map((s,i)=>'<section class="detail-section '+(s.chapter?'chapter-section':'')+'" data-detail-index="'+i+'"><h3>'+esc(s.title)+'</h3>'+richText(s.text)+'</section>').join('');}
function renderContents(a){const chapters=a.body.map((s,i)=>({...s,index:i})).filter(s=>s.chapter);return chapters.length?'<nav class="reading-contents" aria-label="文章章節"><h3>閱讀章節</h3><div>'+chapters.map(s=>'<button data-section="'+s.index+'">'+esc(s.title)+'</button>').join('')+'</div></nav>':'';}

function sectionName(a){return a.section==='jobs'?'職缺詳解':'產業知識';}
function stamp(a){const kind=a.changeKind||(a.updatedAt!==a.addedAt?'update':'new'),date=kind==='new'?a.addedAt:a.updatedAt;const age=(Date.now()-new Date(date+'T00:00:00+08:00').getTime())/86400000;return(age<7?'<span class="change-badge">'+(kind==='update'?'更新':'新增')+'</span> ':'')+'已收錄 · '+esc(a.addedAt)+(a.updatedAt!==a.addedAt?' · 更新 '+esc(a.updatedAt):'');}
function toast(s){$('#notice').textContent=s;$('#notice').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#notice').hidden=true,2500);}
function changeView(v,setHash=true){if(!names[v])return;view=v;Object.keys(names).forEach(k=>$('#'+k+'-view').hidden=k!==v);document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===v);b.setAttribute('aria-current',b.dataset.view===v?'page':'false');});$('#breadcrumb').textContent=names[v];$('#page-description').textContent=descriptions[v];if(v==='saved')renderSaved();if(setHash)history.replaceState(null,'','#'+v);}
function currentJob(){return J.find(j=>j.id===jobId);}
function renderJobs(){const companies=[...new Set(J.map(j=>j.company))];$('#company-tabs').innerHTML=companies.map(c=>'<button data-company="'+esc(c)+'" class="'+(c===company?'active':'')+'" aria-pressed="'+(c===company)+'">'+esc(c)+'</button>').join('');
const roles=J.filter(j=>j.company===company);if(!roles.some(j=>j.id===jobId))jobId=roles[0].id;
$('#roles').innerHTML='<span>'+esc(company)+' 職缺</span>'+roles.map(j=>'<button data-job="'+esc(j.id)+'" class="'+(j.id===jobId?'active':'')+'" aria-current="'+(j.id===jobId?'page':'false')+'"><span>'+esc(j.role)+'</span>'+(j.status==='pending'?'<small>待補</small>':'')+'</button>').join('');
const j=currentJob(),a=A.find(a=>a.id===j.overview);
if(!a){$('#job-detail').innerHTML='<div class="eyebrow">職缺詳解 / '+esc(j.company)+'</div><h2>'+esc(j.role)+'</h2><div class="pending-role"><h3>這個職缺獨立保留，內容待補。</h3><p>目前尚未取得可核對的 '+esc(j.company)+' '+esc(j.role)+' 工作內容與面試資料。</p><p>不把 TPM、PM、Sales PM、FAE 或 RD 的要求互相套用。後續補充的工作內容與面試問答會整理在這個職缺下。</p></div>';return;}
const extras=j.notes.map(id=>A.find(a=>a.id===id)).filter(Boolean);
$('#job-detail').innerHTML='<div class="eyebrow">職缺詳解 / '+esc(j.company)+'</div><h2>'+esc(j.role)+'</h2><p class="label-note">'+stamp(a)+'</p><p class="lede">'+esc(a.summary)+'</p>'+renderSections(a.body)+'<section><h3>面試重點</h3><ul class="job-question-list">'+a.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul></section>'+extras.map(b=>'<details class="job-extra" open><summary>'+esc(b.title)+'</summary><p class="note-stamp">'+stamp(b)+'</p>'+renderSections(b.body)+'<button data-article="'+esc(b.id)+'">開啟這則詳解</button></details>').join('')+(j.knowledge.length?'<section><h3>相關產業知識</h3><p class="subtle">技術原理解釋放在產業知識區，點選可閱讀。</p><div class="job-related">'+j.knowledge.map(id=>A.find(a=>a.id===id&&a.section==='industry')).filter(Boolean).map(b=>'<button data-article="'+b.id+'">'+esc(b.title)+'</button>').join('')+'</div></section>':'')+'<section><button data-article="'+a.id+'">開啟完整職缺筆記</button></section>';
}
function card(a){return '<article class="card"><button class="card-main" data-article="'+a.id+'"><div class="card-top">'+esc(a.knowledgeTopic||'職缺詳解')+'</div><h3>'+esc(a.title)+'</h3><div class="english">'+esc(a.en)+'</div><p>'+esc(a.summary)+'</p></button><div class="card-foot"><span>'+stamp(a)+'</span><button class="save '+(saved.has(a.id)?'saved':'')+'" data-save="'+a.id+'" aria-label="'+(saved.has(a.id)?'取消收藏':'收藏')+'：'+esc(a.title)+'" aria-pressed="'+saved.has(a.id)+'">'+(saved.has(a.id)?'★':'☆')+'</button></div></article>';}
function renderKnowledge(){const featured=A.filter(a=>a.featured);$('#featured-knowledge').innerHTML=featured.map(a=>'<section class="featured-reading"><span class="eyebrow">完整技術詳記</span><h2>'+esc(a.title)+'</h2><p>'+esc(a.summary)+'</p><button data-article="'+a.id+'">完整閱讀八章</button></section>').join('');const q=$('#search').value.trim().toLowerCase().replaceAll('乾求','乾球').replaceAll('coplay','cold plate'),terms=q.split(/\s+/).filter(Boolean);const all=A.filter(a=>a.section==='industry');const list=all.filter(a=>(!topic||a.knowledgeTopic===topic)&&terms.every(t=>JSON.stringify(a).toLowerCase().includes(t))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
$('#knowledge-cards').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><h3>沒有符合的產業知識</h3><p>試試其他技術名詞，或清除篩選。</p></div>';$('#knowledge-count').textContent=list.length+' / '+all.length+' 則';$('#knowledge-heading').textContent=topic||'全部產業知識';
const topics=['',...new Set(all.map(a=>a.knowledgeTopic))];$('#topics').innerHTML=topics.map(t=>'<button data-topic="'+esc(t)+'" class="'+(t===topic?'active':'')+'" aria-pressed="'+(t===topic)+'">'+esc(t||'全部')+'<span class="tag-count">'+all.filter(a=>!t||a.knowledgeTopic===t).length+'</span></button>').join('');}
function noteButtons(list){return list.map(a=>'<button class="updates-note" data-article="'+esc(a.id)+'"><small>'+sectionName(a)+'</small><span>'+esc(a.title)+'</span></button>').join('');}
function renderSaved(){const list=A.filter(a=>saved.has(a.id));$('#saved-content').innerHTML=list.length?['jobs','industry'].map(k=>{const selected=list.filter(a=>a.section===k);return selected.length?'<section class="saved-group"><h3>'+names[k]+'</h3><div class="knowledge-grid">'+selected.map(card).join('')+'</div></section>':'';}).join(''):'<div class="empty">點選筆記的星號，即可收藏。</div>';}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('sona-industry-saved',JSON.stringify([...saved]));}catch{toast('這個瀏覽器無法保存收藏；本次仍可使用。');}renderKnowledge();renderSaved();updateSave();}
function updateSave(){if(active){$('#reader-save').textContent=saved.has(active.id)?'已收藏 ★':'收藏筆記';$('#reader-save').setAttribute('aria-pressed',saved.has(active.id));}}
function openNote(id,setHash=true){const a=A.find(a=>a.id===id);if(!a)return;active=a;changeView(a.section,false);
if(a.section==='jobs'){const matches=J.filter(j=>j.overview===id||j.notes.includes(id));const chosen=matches.find(j=>j.id===jobId)||matches[0];if(chosen){company=chosen.company;jobId=chosen.id;renderJobs();}}
$('#reader-section').textContent=sectionName(a);const related=a.related.map(id=>A.find(b=>b.id===id)).filter(Boolean);
$('#article-content').innerHTML='<div class="article-category">'+sectionName(a)+(a.section==='industry'?' / '+esc(a.knowledgeTopic):' / '+esc(a.units.join(' · ')))+'</div><h2 id="article-title">'+esc(a.title)+'</h2><div class="english">'+esc(a.en)+'</div><p class="lede">'+esc(a.summary)+'</p><p class="note-stamp">'+stamp(a)+'</p>'+renderContents(a)+renderSections(a.body)+(id==='ramp-demo'?demoHtml():'')+'<section><h3>'+(a.section==='jobs'?'面試追問參考':'延伸理解')+'</h3><ul>'+a.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul></section><section><h3>延伸閱讀</h3><div class="related-list">'+related.map(b=>'<button data-article="'+b.id+'">'+sectionName(b)+' · '+esc(b.title)+'</button>').join('')+'</div></section>';
if(!$('#reader').open)$('#reader').showModal();$('#reader').scrollTop=0;updateSave();if(setHash)history.replaceState(null,'','#note='+encodeURIComponent(id));if(id==='ramp-demo')updateDemo();}
function closeReader(){if($('#reader').open)$('#reader').close();history.replaceState(null,'','#'+view);}
function demoHtml(){return '<section class="demo"><label for="rate">每秒上升幅度 <span id="rate-label">10 個百分點</span></label><input id="rate" type="range" min="2" max="25" value="10" step="1"><svg viewBox="0 0 520 180" role="img" aria-label="百分之三十升到百分之八十的理想命令"><path d="M50 15V145H495" fill="none" stroke="#617775"/><text x="5" y="130" fill="#a7b8b7" font-size="14">30%</text><text x="5" y="40" fill="#a7b8b7" font-size="14">80%</text><text x="48" y="170" fill="#a7b8b7" font-size="14">0 秒</text><text x="440" y="170" fill="#a7b8b7" font-size="14">25 秒</text><path id="ramp-path" stroke="#b5efca" stroke-width="3" fill="none"/></svg><div>到達 80% 命令需要 <output id="ramp-time"></output></div><p>理想命令示意，不代表設備實測速度。</p></section>';}
function updateDemo(){const r=Number($('#rate').value),t=50/r;$('#rate-label').textContent=r+' 個百分點';$('#ramp-path').setAttribute('d','M50 125 L'+(50+t/25*440)+' 35 H490');$('#ramp-time').textContent=t.toFixed(1)+' 秒';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-section')){const section=$('#article-content [data-detail-index="'+b.dataset.section+'"]');if(section)section.scrollIntoView({block:'start'});}else if(b.dataset.article)openNote(b.dataset.article);else if(b.dataset.view)changeView(b.dataset.view);else if(b.dataset.company){company=b.dataset.company;renderJobs();history.replaceState(null,'','#job='+jobId);}else if(b.dataset.job){jobId=b.dataset.job;renderJobs();history.replaceState(null,'','#job='+jobId);}else if(b.hasAttribute('data-topic')){topic=b.dataset.topic;renderKnowledge();}else if(b.dataset.save)toggleSave(b.dataset.save);});
$('#search').addEventListener('input',renderKnowledge);$('#reset').addEventListener('click',()=>{topic='';$('#search').value='';renderKnowledge();});
$('#close-reader').addEventListener('click',closeReader);$('#reader').addEventListener('cancel',()=>history.replaceState(null,'','#'+view));$('#reader-save').addEventListener('click',()=>{if(active)toggleSave(active.id);});
$('#copy-link').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);toast('已複製筆記連結');}catch{toast('請從網址列複製此筆記連結。');}});
document.addEventListener('input',e=>{if(e.target.id==='rate')updateDemo();});document.addEventListener('keydown',e=>{if(e.key==='/'&&!$('#reader').open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();changeView('industry');$('#search').focus();}});
function fromHash(){const hash=location.hash;if(hash==='#updates'){changeView('industry');return;}const note=hash.match(/^#note=(.+)$/),job=hash.match(/^#job=(.+)$/);if(note){try{openNote(decodeURIComponent(note[1]),false);}catch{}return;}if($('#reader').open)$('#reader').close();if(job){const j=J.find(j=>j.id===decodeURIComponent(job[1]));if(j){company=j.company;jobId=j.id;changeView('jobs',false);renderJobs();}return;}if(names[hash.slice(1)])changeView(hash.slice(1),false);}
const sync=DATA.sync||{};$('#sync-status').innerHTML='<div><strong>每日早上 08:00 維護產業大腦</strong><span>台北時間；Mac 與 Codex 啟用時執行。重讀對話，保留技術細節與面試追問。</span></div><div><span>上次檢查 '+esc((sync.lastCheckedAt||'').replace('T',' ').slice(0,16))+' 台北時間</span><button data-view="industry">閱讀產業知識</button></div>';
$('#last-updated').textContent='更新 '+(sync.lastContentUpdatedAt||'').slice(0,10);$('#data-summary').textContent=A.filter(a=>a.section==='jobs').length+' 則職缺說明 · '+A.filter(a=>a.section==='industry').length+' 則產業知識';
$('#job-guides').innerHTML=(DATA.jobGuides||[]).map(id=>A.find(a=>a.id===id)).filter(Boolean).map(a=>'<button data-article="'+a.id+'">'+esc(a.title)+'</button>').join('');
window.addEventListener('hashchange',fromHash);renderJobs();renderKnowledge();fromHash();
</script></body></html>
